name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
      agent: ${{ steps.filter.outputs.agent }}
      contract: ${{ steps.filter.outputs.contract }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'kenny-server/**'
            agent:
              - 'kenny-agent/**'
            contract:
              - 'docs/protocol.md'
              - 'docs/fixtures/**'
            ci:
              - '.github/workflows/ci.yml'

  server:
    name: kenny-server (Python)
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' || needs.changes.outputs.contract == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kenny-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  agent:
    name: kenny-agent (Rust)
    needs: changes
    if: ${{ needs.changes.outputs.agent == 'true' || needs.changes.outputs.contract == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kenny-agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build

  agent-windows:
    name: kenny-agent (Windows)
    needs: changes
    if: ${{ needs.changes.outputs.agent == 'true' || needs.changes.outputs.contract == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: kenny-agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy --bin kenny-agent -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build

  e2e:
    name: real agent <-> server (Linux)
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' || needs.changes.outputs.agent == 'true' || needs.changes.outputs.contract == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build agent
        working-directory: kenny-agent
        run: cargo build
      - name: Install server
        working-directory: kenny-server
        run: pip install -e ".[dev]"
      - name: Run real-agent integration test
        working-directory: kenny-server
        env:
          KENNY_E2E: "1"
          KENNY_AGENT_BIN: ${{ github.workspace }}/kenny-agent/target/debug/kenny-agent
        run: python -m pytest tests/test_integration_e2e.py -q
