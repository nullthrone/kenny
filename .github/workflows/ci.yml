name: CI

# Runs on self-hosted runners (no GitHub-hosted minutes):
#   [self-hosted, linux]   -> Fridolin (arm64, 24/7) or the ubuntu2404-amd64 VM,
#                             whichever is free; label match is case-insensitive.
#   [self-hosted, windows] -> the Windows 11 VM (real #[cfg(windows)] tool paths).
# No hosted fallback: a job queues until a matching runner is online. Runners must
# provide the toolchains the steps assume (git/curl + a C linker for Rust on Linux;
# MSVC build tools + the Windows SDK for the Rust msvc target on Windows).

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changes
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      pull-requests: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
      server_code: ${{ steps.filter.outputs.server_code }}
      agent: ${{ steps.filter.outputs.agent }}
      contract: ${{ steps.filter.outputs.contract }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            server:
              - 'kenny-server/**'
            # Server code excluding the web dashboard. Pure UI changes don't
            # affect the agent<->server wire behaviour, so they skip the e2e jobs.
            server_code:
              - 'kenny-server/**'
              - '!kenny-server/kenny_server/webui/**'
            agent:
              - 'kenny-agent/**'
            contract:
              - 'docs/protocol.md'
              - 'docs/fixtures/**'
            ci:
              - '.github/workflows/ci.yml'

  server:
    name: kenny-server (Python)
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' || needs.changes.outputs.contract == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: kenny-server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  agent:
    name: kenny-agent (Rust)
    needs: changes
    if: ${{ needs.changes.outputs.agent == 'true' || needs.changes.outputs.contract == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: kenny-agent
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build

  agent-windows:
    name: kenny-agent (Windows)
    needs: changes
    if: ${{ needs.changes.outputs.agent == 'true' || needs.changes.outputs.contract == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: [self-hosted, windows]
    defaults:
      run:
        working-directory: kenny-agent
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy --bin kenny-agent -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build

  e2e:
    name: real agent <-> server (Linux)
    needs: changes
    if: ${{ needs.changes.outputs.server_code == 'true' || needs.changes.outputs.agent == 'true' || needs.changes.outputs.contract == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build agent
        working-directory: kenny-agent
        run: cargo build
      - name: Install server
        working-directory: kenny-server
        run: pip install -e ".[dev]"
      - name: Run real-agent integration test
        working-directory: kenny-server
        env:
          KENNY_E2E: "1"
          KENNY_AGENT_BIN: ${{ github.workspace }}/kenny-agent/target/debug/kenny-agent
        run: python -m pytest tests/test_integration_e2e.py -q

  e2e-windows:
    name: real agent <-> server (Windows)
    needs: changes
    if: ${{ needs.changes.outputs.server_code == 'true' || needs.changes.outputs.agent == 'true' || needs.changes.outputs.contract == 'true' || needs.changes.outputs.ci == 'true' }}
    # Self-hosted Windows 11 runner (a single machine), so no hosted-image matrix.
    # It runs the real #[cfg(windows)] tool paths on the actual target OS.
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build agent
        working-directory: kenny-agent
        run: cargo build
      - name: Install server
        working-directory: kenny-server
        run: pip install -e ".[dev]"
      - name: Run real-agent integration test
        working-directory: kenny-server
        env:
          KENNY_E2E: "1"
          KENNY_AGENT_BIN: ${{ github.workspace }}\kenny-agent\target\debug\kenny-agent.exe
        run: python -m pytest tests/test_integration_e2e.py -q
