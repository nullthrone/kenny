name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for all jobs; checkout/build/test need only read.
# The `changes` job overrides this with its own block (it also needs
# pull-requests: read so dorny/paths-filter can read PR file lists).
permissions:
  contents: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
      server_code: ${{ steps.filter.outputs.server_code }}
      web: ${{ steps.filter.outputs.web }}
      agent: ${{ steps.filter.outputs.agent }}
      contract: ${{ steps.filter.outputs.contract }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            server:
              - 'kenny-server/**'
            # Server code excluding the web dashboard. Pure UI changes don't
            # affect the agent<->server wire behaviour, so they skip the e2e jobs.
            # The dashboard's source now lives in kenny-web/ (ADR-0052) -- it was
            # never under kenny-server/**, so this filter needs no change to keep
            # excluding it; the exclusion below (the legacy webui/ package data,
            # kept during the transition) is the only piece still inside the tree.
            server_code:
              - 'kenny-server/**'
              - '!kenny-server/kenny_server/webui/**'
            # The compiled dashboard (ADR-0052): typechecked and unit-tested on
            # its own, not by the server job, and irrelevant to the e2e jobs for
            # the same reason kenny_server/webui/** is above.
            web:
              - 'kenny-web/**'
            agent:
              - 'kenny-agent/**'
            contract:
              - 'docs/protocol.md'
              - 'docs/fixtures/**'
            ci:
              - '.github/workflows/ci.yml'

  server:
    name: kenny-server (Python)
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' || needs.changes.outputs.contract == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kenny-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  web:
    name: kenny-web (frontend)
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kenny-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: kenny-web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  agent:
    name: kenny-agent (Rust)
    needs: changes
    if: ${{ needs.changes.outputs.agent == 'true' || needs.changes.outputs.contract == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kenny-agent
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build

  agent-windows:
    name: kenny-agent (Windows)
    needs: changes
    if: ${{ needs.changes.outputs.agent == 'true' || needs.changes.outputs.contract == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: kenny-agent
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy --bin kenny-agent -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build

  e2e:
    name: real agent <-> server (Linux)
    needs: changes
    if: ${{ needs.changes.outputs.server_code == 'true' || needs.changes.outputs.agent == 'true' || needs.changes.outputs.contract == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Build agent
        working-directory: kenny-agent
        run: cargo build
      - name: Install server
        working-directory: kenny-server
        run: pip install -e ".[dev]"
      - name: Run real-agent integration test
        working-directory: kenny-server
        env:
          KENNY_E2E: "1"
          KENNY_AGENT_BIN: ${{ github.workspace }}/kenny-agent/target/debug/kenny-agent
        run: python -m pytest tests/test_integration_e2e.py -q

  e2e-windows:
    name: real agent <-> server (Windows)
    needs: changes
    if: ${{ needs.changes.outputs.server_code == 'true' || needs.changes.outputs.agent == 'true' || needs.changes.outputs.contract == 'true' || needs.changes.outputs.ci == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # Two hosted images: windows-2022 + the newer windows-2025 where winget
        # is reliably preinstalled. Both run the real #[cfg(windows)] tool paths.
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Build agent
        working-directory: kenny-agent
        run: cargo build
      - name: Install server
        working-directory: kenny-server
        run: pip install -e ".[dev]"
      - name: Run real-agent integration test
        working-directory: kenny-server
        env:
          KENNY_E2E: "1"
          KENNY_AGENT_BIN: ${{ github.workspace }}\kenny-agent\target\debug\kenny-agent.exe
        run: python -m pytest tests/test_integration_e2e.py -q
