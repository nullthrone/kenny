name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: kenny-server (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kenny-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  agent:
    name: kenny-agent (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kenny-agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build

  e2e:
    name: real agent <-> server (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build agent
        working-directory: kenny-agent
        run: cargo build
      - name: Install server
        working-directory: kenny-server
        run: pip install -e ".[dev]"
      - name: Run real-agent integration test
        working-directory: kenny-server
        env:
          KENNY_E2E: "1"
          KENNY_AGENT_BIN: ${{ github.workspace }}/kenny-agent/target/debug/kenny-agent
        run: python -m pytest tests/test_integration_e2e.py -q
