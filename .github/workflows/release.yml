name: Release

# Tag a version to publish: the server image to GHCR and the Windows agent binary
# (sha256, optionally code-signed) as a GitHub Release asset.
#   git tag v0.1.0 && git push origin v0.1.0
#
# This is the stable channel (ADR-0052): a non-prerelease GitHub Release, so
# `GET /repos/{repo}/releases/latest` (which excludes prereleases by definition)
# always resolves to it. See release-dev.yml for the dev channel and
# _release-artifacts.yml for the shared job bodies both call.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release + upload assets
  packages: write   # push to GHCR

jobs:
  release:
    name: Publish stable release
    uses: ./.github/workflows/_release-artifacts.yml
    with:
      version: ${{ github.ref_name }}
      prerelease: false
      channel: stable
    secrets: inherit
