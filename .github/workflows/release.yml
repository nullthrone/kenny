name: Release

# Tag a version to publish: the server image to GHCR and the Windows agent binary
# (sha256, optionally code-signed) as a GitHub Release asset.
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release + upload assets
  packages: write   # push to GHCR

jobs:
  # Both jobs verify the exact artifact they are about to publish *before* the
  # publish step runs: a failing smoke test / e2e fails the job and the later push
  # steps never execute. Without enforceable branch protection on a private repo,
  # this in-workflow gate is the only hard guarantee that a broken image or binary
  # is never released.
  server-image:
    name: kenny-server image -> GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # QEMU lets this amd64 runner build the linux/arm64 image too.
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/kenny-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      # Build only the runner-native amd64 image here so it can be `load`ed and
      # smoke-tested locally (`load: true` cannot handle a multi-arch manifest).
      # The arm64 variant is built and verified in the push step below.
      - name: Build image (load locally, do not push yet)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: kenny-server/Dockerfile
          load: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-to: type=gha,mode=max
          cache-from: type=gha
      - name: Smoke test the image
        run: |
          set -euo pipefail
          image='${{ fromJSON(steps.meta.outputs.json).tags[0] }}'
          echo "Smoke-testing $image"
          docker run -d --name kenny-smoke -p 8000:8000 "$image"
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/login || true)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 1
          done
          docker logs kenny-smoke || true
          docker rm -f kenny-smoke >/dev/null 2>&1 || true
          if [ "$ok" != "1" ]; then
            echo "::error::server image did not serve GET /login"
            exit 1
          fi
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Publish a multi-arch manifest (amd64 + arm64). The amd64 layers are reused
      # from the cache populated by the build above; arm64 is built here via QEMU.
      - name: Push image (only after the smoke test passed)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: kenny-server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          cache-from: type=gha

  agent-binary:
    name: kenny-agent.exe -> Release asset
    runs-on: windows-latest
    env:
      HAS_CERT: ${{ secrets.WINDOWS_CERT_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Build release binary
        working-directory: kenny-agent
        # The release tag is the leading source of the agent version (ADR-0015):
        # build.rs stamps it into the binary (reported as meta.version).
        env:
          KENNY_AGENT_VERSION: ${{ github.ref_name }}
        run: cargo build --release
      # Gate the publish on a real round-trip against the EXACT release binary
      # (LTO/stripped --release profile, not the debug build CI exercises). On
      # Windows this also drives the real #[cfg(windows)] tool paths.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install server
        working-directory: kenny-server
        run: pip install -e ".[dev]"
      - name: E2E against the release binary
        working-directory: kenny-server
        env:
          KENNY_E2E: "1"
          KENNY_AGENT_BIN: ${{ github.workspace }}\kenny-agent\target\release\kenny-agent.exe
        run: python -m pytest tests/test_integration_e2e.py -q
      - name: Stage artifact
        id: stage
        shell: pwsh
        working-directory: kenny-agent
        run: |
          $name = "kenny-agent-${{ github.ref_name }}-x86_64-pc-windows-msvc.exe"
          Copy-Item target/release/kenny-agent.exe $name
          (Get-FileHash $name -Algorithm SHA256).Hash.ToLower() + "  " + $name | Out-File "$name.sha256" -Encoding ascii
          "artifact=$name" >> $env:GITHUB_OUTPUT
      # Optional Authenticode signing when a cert is configured (skipped otherwise).
      - name: Code sign (optional)
        if: ${{ env.HAS_CERT == 'true' }}
        shell: pwsh
        working-directory: kenny-agent
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CERT_PW: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:CERT_B64))
          & "${env:ProgramFiles(x86)}\Windows Kits\10\bin\x64\signtool.exe" sign `
            /f cert.pfx /p $env:CERT_PW /tr http://timestamp.digicert.com /td sha256 /fd sha256 `
            "${{ steps.stage.outputs.artifact }}"
          # refresh the hash after signing
          $name = "${{ steps.stage.outputs.artifact }}"
          (Get-FileHash $name -Algorithm SHA256).Hash.ToLower() + "  " + $name | Out-File "$name.sha256" -Encoding ascii
      - name: Publish to the Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          files: |
            kenny-agent/${{ steps.stage.outputs.artifact }}
            kenny-agent/${{ steps.stage.outputs.artifact }}.sha256
