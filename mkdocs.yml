site_name: kenny
site_description: Self-hosted remote administration and fleet monitoring for Windows and Linux, driven by Claude.
site_url: https://nullthrone.github.io/kenny/
repo_url: https://github.com/nullthrone/kenny
repo_name: nullthrone/kenny
edit_uri: edit/main/docs/
docs_dir: docs
# The ADR template carries placeholder links (xxxx-…); keep it in the repo but out of the site.
exclude_docs: |
  adr/0000-template.md
# The individual ADR records are reached from the "Architecture decisions" index
# page, not listed one-by-one in the sidebar — this keeps the nav to a single
# Developer entry instead of dumping ~30 records into it. The files are still
# built and linked from the index; not_in_nav just silences the strict warning.
not_in_nav: |
  adr/0*.md
copyright: Copyright &copy; 2026 t11z and the kenny contributors · AGPL-3.0-only

theme:
  name: material
  logo: assets/kenny-mark-64.png
  favicon: assets/kenny-favicon.png
  icon:
    repo: fontawesome/brands/github
  font:
    # Public Sans is Nullthrone's body face. Material's theme.font only takes
    # one text family (used for body + fallback headings); Jost — the display
    # face for headings and structural nav/caps labels — is layered on top in
    # docs/css/kenny-theme.css since Material has no second `text` slot.
    text: Public Sans
    code: JetBrains Mono
  palette:
    # Light first — Nullthrone is light-by-default (ink on warm paper); the
    # ink scheme is the alternate, reached via the toggle or a dark system
    # preference. `primary`/`accent: custom` opt out of Material's built-in
    # named swatches so the exact Nullthrone brass token drives both (see
    # kenny-theme.css) — https://squidfunk.github.io/mkdocs-material/setup/changing-the-colors/#custom-colors
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight

extra_css:
  - css/kenny-theme.css

plugins:
  - search
  - awesome-pages

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  # The `:material-…:` shortcodes in the homepage's card grid are Material's
  # icon syntax, not emoji — without this they render as literal text.
  # https://squidfunk.github.io/mkdocs-material/reference/icons-emojis/
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nullthrone/kenny
