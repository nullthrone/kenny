[project]
name = "kenny-server"
version = "0.1.0"
description = "kenny server: MCP endpoint for Claude, agent tunnel, telemetry store, and operator dashboard"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [{ name = "t11z and the kenny contributors" }]
keywords = ["remote-admin", "telemetry", "windows", "linux", "mcp", "fastmcp", "fleet-monitoring"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Framework :: AsyncIO",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastmcp>=2.0",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "pydantic>=2.6",
    "websockets>=12.0",
    "aiosqlite>=0.20",
    "anthropic>=0.40",
    "httpx>=0.27",
    "cryptography>=42",
    "asyncssh>=2.14",
]

[project.optional-dependencies]
# The Discord bot surface. Optional on purpose: a self-hoster who does not use
# Discord must not pull it in, and the server starts and runs normally without
# it (discord.py is imported lazily, in discord_adapter.DiscordPyGateway.start()
# alone). Install with `pip install -e ".[discord]"`.
discord = [
    "discord.py>=2.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-awesome-pages-plugin>=2.9",
]
# Tooling to regenerate the dashboard screenshots in docs/assets/screenshots/
# (scripts/screenshots/). Not needed for the server itself, tests, or CI —
# install with `pip install -e ".[screenshots]"`. Chromium is provided by the
# environment; do not run `playwright install`.
screenshots = [
    "playwright>=1.44",
]

[project.urls]
Homepage = "https://github.com/nullthrone/kenny"
Repository = "https://github.com/nullthrone/kenny"
Documentation = "https://nullthrone.github.io/kenny/"
Issues = "https://github.com/nullthrone/kenny/issues"

[project.scripts]
kenny-server = "kenny_server.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kenny_server*"]

[tool.setuptools.package-data]
"kenny_server" = ["data/*.json"]
# The legacy hand-written dashboard (kept alive during the transition) plus
# the compiled SPA's output tree (ADR-0052). setuptools only globs files that
# already exist at build time -- it cannot invoke npm -- so `dist/` must be
# built (`npm --prefix kenny-web install && npm --prefix kenny-web run
# build`) *before* `python -m build`/`pip install`; CI and the Dockerfile do
# this. `dist/**` covers Vite's nested `assets/` output plus any `public/`
# files it copies to the tree root (favicon, manifest, etc.) at any depth.
"kenny_server.webui" = [
    "*.html",
    "*.css",
    "*.js",
    "assets/*.png",
    "assets/*.ico",
    "assets/*.svg",
    "assets/*.js",
    "dist/**/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A hung test previously sat in CI as "in_progress" for the runner's full
# multi-hour job limit with no output -- indistinguishable from a healthy
# slow job until someone cancelled it by hand. This bound catches that fast
# and "thread" dumps every thread's stack into the log instead of leaving CI
# silent. It fits the *fast* suite, where the slowest workloads finish in low
# single-digit seconds -- it does NOT fit tests/test_integration_e2e.py, which
# legitimately runs minutes against a cold Windows runner's real PowerShell/CIM
# collectors. That test overrides this value with its own
# `@pytest.mark.timeout(...)`, sized from named budget constants at the top of
# the file; tests/test_e2e_timeout_budget.py asserts the two stay in
# agreement. (A prior version of this comment claimed no test needed anywhere
# near 90s -- that was false for the Windows e2e test and briefly broke the
# dev-channel release by cutting its e2e gate off ~10s before it would have
# finished.)
timeout = 90
timeout_method = "thread"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set explicitly. Without this, `ruff check` falls back to
# whatever the installed ruff version's *default* selection happens to be —
# and that default has changed between releases (a ruff upgrade alone took
# CI from 0 to 210 findings after PR #167, across code the PR never
# touched). Pyflakes + the pycodestyle error subset matches ruff's
# long-standing default and is what this codebase is actually clean under.
select = ["E4", "E7", "E9", "F"]
