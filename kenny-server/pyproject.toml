[project]
name = "kenny-server"
version = "0.1.0"
description = "kenny server: MCP endpoint for Claude, agent tunnel, telemetry store, and operator dashboard"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [{ name = "t11z and the kenny contributors" }]
keywords = ["remote-admin", "telemetry", "windows", "mcp", "fastmcp", "fleet-monitoring"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Framework :: AsyncIO",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastmcp>=2.0",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "pydantic>=2.6",
    "websockets>=12.0",
    "aiosqlite>=0.20",
    "anthropic>=0.40",
    "httpx>=0.27",
    "cryptography>=42",
    "asyncssh>=2.14",
]

[project.optional-dependencies]
# The Discord bot surface. Optional on purpose: a self-hoster who does not use
# Discord must not pull it in, and the server starts and runs normally without
# it (discord.py is imported lazily, in discord_adapter.DiscordPyGateway.start()
# alone). Install with `pip install -e ".[discord]"`.
discord = [
    "discord.py>=2.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-awesome-pages-plugin>=2.9",
]
# Tooling to regenerate the dashboard screenshots in docs/assets/screenshots/
# (scripts/screenshots/). Not needed for the server itself, tests, or CI —
# install with `pip install -e ".[screenshots]"`. Chromium is provided by the
# environment; do not run `playwright install`.
screenshots = [
    "playwright>=1.44",
]

[project.urls]
Homepage = "https://github.com/t11z/kenny"
Repository = "https://github.com/t11z/kenny"
Documentation = "https://t11z.github.io/kenny/"
Issues = "https://github.com/t11z/kenny/issues"

[project.scripts]
kenny-server = "kenny_server.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kenny_server*"]

[tool.setuptools.package-data]
"kenny_server" = ["data/*.json"]
"kenny_server.webui" = ["*.html", "*.css", "*.js", "assets/*.png", "assets/*.ico", "assets/*.svg", "assets/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set explicitly. Without this, `ruff check` falls back to
# whatever the installed ruff version's *default* selection happens to be —
# and that default has changed between releases (a ruff upgrade alone took
# CI from 0 to 210 findings after PR #167, across code the PR never
# touched). Pyflakes + the pycodestyle error subset matches ruff's
# long-standing default and is what this codebase is actually clean under.
select = ["E4", "E7", "E9", "F"]
