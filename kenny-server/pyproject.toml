[project]
name = "kenny-server"
version = "0.1.0"
description = "kenny server: MCP endpoint for Claude, agent tunnel, telemetry store, and operator dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "pydantic>=2.6",
    "websockets>=12.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
kenny-server = "kenny_server.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kenny_server*"]

[tool.setuptools.package-data]
"kenny_server.webui" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
