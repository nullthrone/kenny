<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>kenny · fleet console</title>
  <link rel="icon" href="/assets/kenny-favicon.png" />
  <!-- Set the theme before first paint so there is no dark→light flash or
       stale-transition freeze (see VISUAL FOUNDATIONS / handoff note). -->
  <script>try { document.documentElement.setAttribute('data-theme', localStorage.getItem('kenny-theme') || 'dark'); } catch (e) {}</script>
  <style>
    /* Hanken Grotesk (UI) + JetBrains Mono (telemetry). Loaded from Google
       Fonts; if offline, the system stacks below take over gracefully. */
    @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap');

    /* ====================================================================
       1. TOKENS — primitives (warm border-collie palette; amber = the eyes)
       ==================================================================== */
    :root {
      --warm-950: #141311; --warm-900: #1A1917; --warm-850: #201E1B;
      --warm-800: #23211E; --warm-750: #2B2924; --warm-700: #34312C;
      --warm-600: #4A463F; --warm-500: #756B5C; --warm-400: #A89F8E;
      --warm-300: #C9C1B2; --warm-200: #D9D2C4; --warm-100: #ECE6DA;
      --warm-50:  #F3EEE3; --warm-0:   #FBF7EF; --pure-white: #FFFFFF;

      --amber-bright: #F0B65C; --amber: #E8A33D; --amber-deep: #C9852A;
      --amber-text: #92610F;
      --amber-wash-d: rgba(232,163,61,0.12); --amber-wash-l: rgba(232,163,61,0.16);

      --ok: #5FA88A; --ok-text-d: #79BFA1; --ok-fill: #36715B; --ok-text-l: #2E7355;
      --ok-wash-d: rgba(95,168,138,0.12); --ok-wash-l: rgba(46,115,85,0.10);

      --crit: #C65B43; --crit-text-d: #DD7A62; --crit-fill: #B0432E; --crit-text-l: #A23A24;
      --crit-wash-d: rgba(198,91,67,0.14); --crit-wash-l: rgba(162,58,36,0.10);

      --unknown: #756B5C; --unknown-text-d: #A89F8E;

      --font-sans: 'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
      --weight-normal: 400; --weight-bold: 600;

      --text-xs: 13px; --text-sm: 14px; --text-base: 16px; --text-md: 19px;
      --text-lg: 23px; --text-xl: 29px; --text-2xl: 37px; --text-3xl: 48px;
      --leading-tight: 1.2; --leading-snug: 1.35; --leading-normal: 1.55;
      --tracking-tight: -0.01em; --tracking-label: 0.04em;

      --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
      --space-5: 24px; --space-6: 32px; --space-7: 48px; --space-8: 64px;

      --radius-xs: 3px; --radius-sm: 5px; --radius-md: 7px; --radius-lg: 10px; --radius-pill: 999px;
      --border-width: 1px; --border-width-emphasis: 2px;
      --focus-ring: 0 0 0 2px var(--amber);

      --ease: cubic-bezier(0.2, 0, 0, 1);
      --dur-fast: 90ms; --dur: 160ms; --dur-slow: 240ms;
    }

    /* 2. SEMANTIC TOKENS — DARK (primary) */
    :root, [data-theme="dark"] {
      --bg: var(--warm-900); --bg-sunken: var(--warm-950); --surface: var(--warm-800);
      --surface-raised: var(--warm-750); --border: var(--warm-700); --border-strong: var(--warm-600);
      --fg: var(--warm-100); --fg-muted: var(--warm-400); --fg-faint: var(--warm-500); --fg-inverse: var(--warm-900);
      --accent: var(--amber); --accent-hover: var(--amber-bright); --accent-press: var(--amber-deep);
      --accent-fg: var(--warm-900); --accent-wash: var(--amber-wash-d); --link: var(--amber);
      --ok-dot: var(--ok);      --ok-fg: var(--ok-text-d);     --ok-solid: var(--ok-fill);     --ok-on: var(--warm-100); --ok-bg: var(--ok-wash-d);
      --warn-dot: var(--amber); --warn-fg: var(--amber);       --warn-solid: var(--amber);     --warn-on: var(--warm-900); --warn-bg: var(--amber-wash-d);
      --crit-dot: var(--crit);  --crit-fg: var(--crit-text-d); --crit-solid: var(--crit-fill); --crit-on: var(--warm-100); --crit-bg: var(--crit-wash-d);
      --unk-dot: var(--unknown);--unk-fg: var(--unknown-text-d);
    }

    /* 3. SEMANTIC TOKENS — LIGHT (clean inversion) */
    [data-theme="light"] {
      --bg: var(--warm-50); --bg-sunken: var(--warm-100); --surface: var(--warm-0);
      --surface-raised: var(--pure-white); --border: #E2DACB; --border-strong: #CFC6B4;
      --fg: #211F1B; --fg-muted: #6B6354; --fg-faint: #938A79; --fg-inverse: var(--warm-50);
      --accent: var(--amber); --accent-hover: var(--amber-deep); --accent-press: var(--amber-deep);
      --accent-fg: var(--warm-900); --accent-wash: var(--amber-wash-l); --link: var(--amber-text);
      --ok-dot: var(--ok-text-l);  --ok-fg: var(--ok-text-l);     --ok-solid: var(--ok-fill);     --ok-on: var(--warm-50);  --ok-bg: var(--ok-wash-l);
      --warn-dot: var(--amber-deep);--warn-fg: var(--amber-text); --warn-solid: var(--amber);     --warn-on: var(--warm-900); --warn-bg: var(--amber-wash-l);
      --crit-dot: var(--crit-fill);--crit-fg: var(--crit-text-l); --crit-solid: var(--crit-fill); --crit-on: var(--warm-50);  --crit-bg: var(--crit-wash-l);
      --unk-dot: var(--unknown);   --unk-fg: var(--fg-muted);
    }

    /* 4. BASE TYPOGRAPHY */
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: var(--font-sans); font-size: var(--text-base);
      line-height: var(--leading-normal); font-weight: var(--weight-normal);
      color: var(--fg); background: var(--bg);
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    a, .link { color: var(--link); text-decoration: none; }
    a:hover, .link:hover { text-decoration: underline; text-underline-offset: 2px; }
    :focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius-sm); }
    .k-mono { font-family: var(--font-mono); }
    .k-muted { color: var(--fg-muted); }
    .k-row { display: flex; align-items: center; gap: var(--space-2); }
    svg { stroke-width: 1.75; }

    /* ====================================================================
       COMPONENT LAYER (.k-*) — flat surfaces, hairline borders, no shadows.
       Status never relies on colour alone: shape + icon + label.
       ==================================================================== */
    .k-panel { background: var(--surface); border: var(--border-width) solid var(--border);
      border-radius: var(--radius-lg); padding: var(--space-4); }
    .k-card { background: var(--surface); border: var(--border-width) solid var(--border);
      border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); }
    .k-card--sunken { background: var(--bg-sunken); }

    /* status dots — distinct silhouettes */
    .k-dot { width: 10px; height: 10px; flex: none; display: inline-block; }
    .k-dot--ok { background: var(--ok-dot); border-radius: 50%; }
    .k-dot--warn { background: var(--warn-dot); border-radius: 50%;
      box-shadow: inset 0 0 0 2px var(--surface), 0 0 0 1.5px var(--warn-dot); }
    .k-dot--crit { background: var(--crit-dot); border-radius: 2px; }
    .k-dot--unknown { background: var(--unk-dot); border-radius: 50%; opacity: .8;
      -webkit-mask: repeating-linear-gradient(45deg,#000 0 2px,transparent 2px 4px);
              mask: repeating-linear-gradient(45deg,#000 0 2px,transparent 2px 4px); }

    /* status pills */
    .k-pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 8px;
      border-radius: var(--radius-pill); font-size: var(--text-xs); font-weight: var(--weight-bold);
      line-height: 1.4; letter-spacing: .01em; white-space: nowrap;
      border: var(--border-width) solid transparent; }
    .k-pill svg { width: 13px; height: 13px; }
    .k-pill--ok { background: var(--ok-bg); color: var(--ok-fg); border-color: color-mix(in oklab, var(--ok-dot) 35%, transparent); }
    .k-pill--warn { background: var(--warn-bg); color: var(--warn-fg); border-color: color-mix(in oklab, var(--warn-dot) 40%, transparent); }
    .k-pill--crit { background: var(--crit-solid); color: var(--crit-on); border-color: var(--crit-solid); }
    .k-pill--unknown { background: transparent; color: var(--unk-fg); border-color: var(--border-strong); }

    /* rule-reason chip */
    .k-reason { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono);
      font-size: var(--text-xs); padding: 4px 9px; border-radius: var(--radius-sm);
      background: var(--bg-sunken); border: var(--border-width) solid var(--border); color: var(--fg-muted);
      flex-wrap: wrap; max-width: 100%; min-width: 0; }
    .k-reason > span { min-width: 0; overflow-wrap: anywhere; }
    .k-reason b { color: var(--fg); font-weight: var(--weight-bold); }
    .k-reason__arrow { color: var(--fg-faint); }
    .k-reason__out { font-weight: var(--weight-bold); }
    .k-reason--ok .k-reason__out { color: var(--ok-fg); }
    .k-reason--warn .k-reason__out { color: var(--warn-fg); }
    .k-reason--crit .k-reason__out { color: var(--crit-fg); }

    /* telemetry tile — clickable, opens a structured detail popup */
    .k-tile { background: var(--surface); border: var(--border-width) solid var(--border);
      border-radius: var(--radius-md); padding: var(--space-3); border-left: 3px solid var(--border);
      display: flex; flex-direction: column; gap: 7px; width: 100%; text-align: left;
      font-family: var(--font-sans); color: var(--fg); cursor: pointer;
      transition: transform var(--dur) var(--ease), border-color var(--dur) var(--ease),
        box-shadow var(--dur) var(--ease), background var(--dur) var(--ease); }
    .k-tile--ok { border-left-color: var(--ok-dot); }
    .k-tile--warn { border-left-color: var(--warn-dot); }
    .k-tile--crit { border-left-color: var(--crit-solid); border-left-width: 4px;
      background: linear-gradient(90deg, var(--crit-bg), transparent 60%); }
    /* hover: a wash gradient blooming from the left status edge + a slight zoom */
    .k-tile:hover { transform: scale(1.02); border-color: var(--border-strong);
      box-shadow: 0 6px 20px -12px rgba(0,0,0,.55); }
    .k-tile--ok:hover { background: linear-gradient(90deg,
      color-mix(in oklab, var(--ok-dot) 22%, var(--surface)), var(--surface) 65%); }
    .k-tile--warn:hover { background: linear-gradient(90deg,
      color-mix(in oklab, var(--warn-dot) 22%, var(--surface)), var(--surface) 65%); }
    .k-tile--crit:hover { background: linear-gradient(90deg,
      color-mix(in oklab, var(--crit-solid) 26%, var(--surface)), var(--surface) 68%); }
    .k-tile--unknown:hover { background: linear-gradient(90deg,
      color-mix(in oklab, var(--unk-dot) 20%, var(--surface)), var(--surface) 65%); }
    @media (prefers-reduced-motion: reduce) { .k-tile:hover { transform: none; } }
    .k-tile__head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .k-tile__name { display: inline-flex; align-items: center; gap: 7px; min-width: 0;
      font-size: var(--text-sm); font-weight: var(--weight-bold); color: var(--fg); }
    .k-tile__name svg { width: 16px; height: 16px; color: var(--fg-muted); flex: none; }
    .k-tile__name span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* Clamp to two lines and break long unbroken tokens (e.g. a mount path)
       so a summary can never overflow the fixed-width tile. */
    .k-tile__sum { font-size: var(--text-sm); color: var(--fg-muted);
      min-width: 0; overflow-wrap: anywhere; overflow: hidden;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .k-tile__more { font-size: 11px; color: var(--fg-faint); letter-spacing: var(--tracking-label);
      text-transform: uppercase; display: inline-flex; align-items: center; gap: 5px; }
    .k-tile__more svg { width: 13px; height: 13px; }

    /* buttons */
    .k-btn { display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
      font-family: var(--font-sans); font-size: var(--text-sm); font-weight: var(--weight-bold);
      padding: 8px 14px; border-radius: var(--radius-sm); border: var(--border-width) solid transparent;
      white-space: nowrap; flex-shrink: 0;
      transition: background var(--dur) var(--ease), transform var(--dur-fast) var(--ease),
        border-color var(--dur) var(--ease), color var(--dur) var(--ease); }
    .k-btn svg { width: 15px; height: 15px; }
    .k-btn:active { transform: scale(.985); }
    .k-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .k-btn--primary { background: var(--accent); color: var(--accent-fg); }
    .k-btn--primary:hover { background: var(--accent-hover); }
    .k-btn--primary:active { background: var(--accent-press); }
    .k-btn--ghost { background: transparent; color: var(--fg); border-color: var(--border-strong); }
    .k-btn--ghost:hover { background: var(--surface-raised); border-color: var(--border-strong); }
    .k-btn--quiet { background: transparent; color: var(--fg-muted); }
    .k-btn--quiet:hover { background: var(--surface-raised); color: var(--fg); }
    .k-btn--danger { background: transparent; color: var(--crit-fg);
      border-color: color-mix(in oklab, var(--crit-solid) 60%, transparent); }
    .k-btn--danger:hover { background: var(--crit-bg); border-color: var(--crit-solid); }
    .k-btn--sm { padding: 5px 10px; font-size: var(--text-xs); }
    .k-btn--sm svg { width: 13px; height: 13px; }

    /* inputs */
    .k-input { font-family: var(--font-sans); font-size: var(--text-sm); color: var(--fg);
      background: var(--bg-sunken); border: var(--border-width) solid var(--border);
      border-radius: var(--radius-sm); padding: 8px 11px; width: 100%;
      transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
    .k-input::placeholder { color: var(--fg-faint); }
    .k-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-wash); }

    /* chat bubbles */
    .k-bubble { max-width: 80%; padding: 9px 12px; border-radius: var(--radius-md);
      font-size: var(--text-sm); line-height: var(--leading-snug); white-space: pre-wrap;
      overflow-wrap: anywhere; }
    .k-bubble--user { align-self: flex-end; background: var(--surface-raised);
      border: var(--border-width) solid var(--border); color: var(--fg); border-bottom-right-radius: var(--radius-xs); }
    .k-bubble--assistant { align-self: flex-start; background: var(--surface);
      border: var(--border-width) solid var(--border); color: var(--fg); border-bottom-left-radius: var(--radius-xs); }
    /* rendered markdown inside an assistant bubble (see renderMarkdown()) */
    .k-bubble p { margin: 0 0 8px; }
    .k-bubble p:last-child { margin-bottom: 0; }
    .k-bubble ul, .k-bubble ol { margin: 0 0 8px; padding-left: 1.3em; }
    .k-bubble ul:last-child, .k-bubble ol:last-child { margin-bottom: 0; }
    .k-bubble li { margin: 2px 0; }
    .k-bubble h1, .k-bubble h2, .k-bubble h3, .k-bubble h4, .k-bubble h5, .k-bubble h6 {
      margin: 10px 0 6px; font-size: var(--text-sm); font-weight: var(--weight-bold); }
    .k-bubble h1:first-child, .k-bubble h2:first-child, .k-bubble h3:first-child,
    .k-bubble h4:first-child, .k-bubble h5:first-child, .k-bubble h6:first-child { margin-top: 0; }
    .k-bubble code { font-family: var(--font-mono); font-size: 0.9em;
      background: var(--bg-sunken); border-radius: var(--radius-xs); padding: 1px 4px; }
    /* fenced code blocks scroll horizontally instead of breaking mid-token,
       same convention as .k-gate__call — breaking code garbles it, prose is fine to wrap */
    .k-bubble pre { font-family: var(--font-mono); font-size: var(--text-xs);
      background: var(--bg-sunken); border: var(--border-width) solid var(--border);
      border-radius: var(--radius-sm); padding: 8px 10px; margin: 6px 0;
      white-space: pre; overflow-x: auto; }
    .k-bubble pre:last-child { margin-bottom: 0; }
    .k-bubble pre code { background: none; padding: 0; }
    .k-bubble blockquote { margin: 6px 0; padding-left: 10px;
      border-left: var(--border-width-emphasis) solid var(--border); color: var(--fg-muted); }
    .k-bubble a { color: var(--accent); }
    .k-toolrun { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--font-mono); font-size: var(--text-xs); color: var(--fg-muted);
      background: var(--bg-sunken); border: var(--border-width) solid var(--border);
      border-radius: var(--radius-sm); padding: 5px 10px; }
    .k-toolrun svg { width: 13px; height: 13px; }
    .k-toolrun__tick { color: var(--ok-fg); display: inline-flex; }
    .k-toolrun--err .k-toolrun__tick { color: var(--crit-fg); }
    .k-toolrun--auto::after { content: 'auto-run'; margin-left: 2px; color: var(--fg-faint);
      font-size: 10px; letter-spacing: var(--tracking-label); text-transform: uppercase; }

    /* confirm-gate — deliberate, amber-framed safety moment */
    .k-gate { align-self: flex-start; max-width: 92%; background: var(--surface);
      border: var(--border-width-emphasis) solid var(--accent); border-radius: var(--radius-md);
      padding: 0; overflow: hidden;
      /* The transcript is a flex column with a capped height; without this the
         gate gets shrunk below its content and `overflow: hidden` clips the
         footer buttons. Keep its natural height and let the transcript scroll. */
      flex-shrink: 0; }
    .k-gate__head { display: flex; align-items: center; gap: 8px; padding: 9px 12px;
      background: var(--accent-wash); border-bottom: var(--border-width) solid color-mix(in oklab, var(--accent) 30%, transparent); }
    .k-gate__head svg { width: 15px; height: 15px; color: var(--accent); }
    .k-gate__title { font-size: var(--text-xs); font-weight: var(--weight-bold); color: var(--accent);
      letter-spacing: var(--tracking-label); text-transform: uppercase; white-space: nowrap; }
    .k-gate__body { padding: 11px 12px 12px; max-height: 40vh; overflow-y: auto; }
    .k-gate__desc { font-size: var(--text-sm); color: var(--fg-muted); margin-bottom: 8px; }
    .k-gate__desc b { color: var(--fg); font-weight: var(--weight-bold); }
    .k-gate__call { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--fg);
      background: var(--bg-sunken); border: var(--border-width) solid var(--border);
      border-radius: var(--radius-sm); padding: 8px 10px;
      white-space: pre-wrap; overflow-x: auto; }
    .k-gate__call .tok-key { color: var(--fg-faint); }
    .k-gate__call .tok-tool { color: var(--accent); font-weight: var(--weight-bold); }
    /* Actions live in a footer bar pinned inside the frame (mirrors the head),
       so the buttons stay visible while a long script body scrolls above. */
    .k-gate__foot { display: flex; gap: 8px; padding: 9px 12px;
      background: var(--accent-wash); border-top: var(--border-width) solid color-mix(in oklab, var(--accent) 30%, transparent); }

    /* audit log */
    .k-audit { display: flex; flex-direction: column; }
    .k-audit__bar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .k-audit__search { position: relative; flex: 1; min-width: 200px; display: flex; align-items: center; }
    .k-audit__search svg { position: absolute; left: 10px; width: 15px; height: 15px; color: var(--fg-faint); pointer-events: none; }
    .k-audit__search .k-input { padding-left: 32px; }
    .k-audit__count { font-size: var(--text-xs); color: var(--fg-muted); white-space: nowrap; }
    .k-audit__row { display: grid; grid-template-columns: 72px 64px 1fr auto auto;
      align-items: center; gap: 12px; padding: 8px 4px;
      border-bottom: var(--border-width) solid var(--border); font-size: var(--text-sm); }
    .k-audit__row:last-child { border-bottom: 0; }
    .k-audit__time { font-family: var(--font-mono); color: var(--fg-faint); }
    .k-audit__tool { font-family: var(--font-mono); color: var(--fg); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; }
    .k-audit__kind { font-size: 12px; letter-spacing: var(--tracking-label); text-transform: uppercase; white-space: nowrap; }
    .k-audit__kind--ro { color: var(--fg-faint); }
    .k-audit__kind--sc { color: var(--accent); }
    .k-audit__agent { font-family: var(--font-mono); color: var(--fg-muted); white-space: nowrap; }
    .k-audit__res { font-size: 12px; font-weight: var(--weight-bold); letter-spacing: var(--tracking-label); text-transform: uppercase; }
    .k-audit__res--ok { color: var(--ok-fg); }
    .k-audit__res--err { color: var(--crit-fg); }
    .k-audit__pager { display: flex; align-items: center; justify-content: flex-end; gap: 10px;
      margin-top: 10px; font-size: var(--text-xs); color: var(--fg-muted); }

    /* events / logs — fleet-wide log + audit stream */
    .k-events__row { display: grid; grid-template-columns: 72px 56px 60px 110px 1fr;
      align-items: baseline; gap: 12px; padding: 8px 4px;
      border-bottom: var(--border-width) solid var(--border); font-size: var(--text-sm); }
    .k-events__row:last-child { border-bottom: 0; }
    .k-events__lvl { font-size: 12px; font-weight: var(--weight-bold); letter-spacing: var(--tracking-label);
      text-transform: uppercase; white-space: nowrap; }
    .k-events__lvl--error, .k-events__lvl--crit { color: var(--crit-fg); }
    .k-events__lvl--warn { color: var(--warn-fg); }
    .k-events__lvl--info { color: var(--ok-fg); }
    .k-events__lvl--debug, .k-events__lvl--trace { color: var(--fg-faint); }
    .k-events__src { font-size: 12px; letter-spacing: var(--tracking-label); text-transform: uppercase;
      color: var(--fg-faint); white-space: nowrap; }
    .k-events__who { font-family: var(--font-mono); color: var(--fg-muted); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; }
    .k-events__msg { color: var(--fg); overflow: hidden; text-overflow: ellipsis; }
    .k-events__msg .k-events__target { font-family: var(--font-mono); color: var(--fg-faint); margin-right: 8px; }

    /* modal / popup — reused by section-detail and recommendations */
    .k-modal__overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-start;
      justify-content: center; padding: 7vh 18px 18px; background: rgba(0,0,0,.5);
      -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); overflow-y: auto; }
    .k-modal { background: var(--surface); border: var(--border-width) solid var(--border-strong);
      border-radius: var(--radius-lg); width: 100%; max-width: 860px; max-height: 84vh;
      display: flex; flex-direction: column; box-shadow: 0 24px 60px -20px rgba(0,0,0,.6);
      animation: kModalIn var(--dur) var(--ease); }
    @keyframes kModalIn { from { opacity: 0; transform: translateY(-8px) scale(.99); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .k-modal { animation: none; } }
    /* media variant: a near-fullscreen popup so screenshots show far larger than the thumbnail */
    .k-modal--media { max-width: 90vw; max-height: 90vh; }
    .k-modal--media .k-modal__body { display: flex; }
    .k-modal--media .kc-shot { width: 100%; max-height: calc(90vh - 70px); object-fit: contain; cursor: default; }
    .k-modal__head { display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 16px 18px; border-bottom: var(--border-width) solid var(--border); }
    .k-modal__title { display: inline-flex; align-items: center; gap: 10px; font-size: var(--text-md);
      font-weight: var(--weight-bold); min-width: 0; }
    .k-modal__title svg { width: 20px; height: 20px; color: var(--fg-muted); flex: none; }
    .k-modal__close { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px;
      border-radius: var(--radius-sm); border: 1px solid var(--border); background: transparent; color: var(--fg-muted);
      cursor: pointer; flex: none; transition: background var(--dur) var(--ease), color var(--dur) var(--ease); }
    .k-modal__close:hover { background: var(--surface-raised); color: var(--fg); }
    .k-modal__close svg { width: 18px; height: 18px; }
    .k-modal__body { padding: 16px 18px 18px; overflow-y: auto; overflow-x: hidden; }

    /* structured section detail */
    .k-detail-grp { margin-top: 16px; }
    .k-detail-grp:first-child { margin-top: 0; }
    .k-detail-grp__lbl { font-size: var(--text-xs); color: var(--fg-muted); letter-spacing: var(--tracking-label);
      text-transform: uppercase; margin-bottom: 8px; }
    .k-relcat { border: 1px solid var(--border); border-radius: 6px; margin-bottom: 6px; overflow: hidden; }
    .k-relcat > summary { display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer;
      list-style: none; background: var(--surface-raised); }
    .k-relcat > summary::-webkit-details-marker { display: none; }
    .k-relcat > summary::before { content: "▸"; color: var(--fg-muted); font-size: 11px; }
    .k-relcat[open] > summary::before { content: "▾"; }
    .k-relcat__name { font-weight: 600; }
    .k-relcat__count { margin-left: auto; color: var(--fg-muted); font-size: var(--text-sm); }
    .k-relcat table { margin: 0; }
    .k-relcat th { white-space: nowrap; }
    /* A suppressed pattern reads as de-emphasised without being hidden — its
       count and severity stay fully legible (ADR-0041 / issue #166). */
    .k-relrow--sup > td { opacity: .65; }
    .k-deflist { display: grid; grid-template-columns: minmax(120px, max-content) 1fr; gap: 6px 16px; align-items: baseline; }
    .k-deflist__k { color: var(--fg-muted); font-size: var(--text-sm); }
    .k-deflist__v { color: var(--fg); font-size: var(--text-sm); overflow-wrap: anywhere; }
    .k-deflist__v.k-mono { font-family: var(--font-mono); }
    .k-dtable { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
    .k-dtable th, .k-dtable td { text-align: left; padding: 7px 10px; border-bottom: var(--border-width) solid var(--border);
      overflow-wrap: anywhere; }
    .k-dtable th { color: var(--fg-muted); font-weight: var(--weight-bold); font-size: var(--text-xs);
      letter-spacing: var(--tracking-label); text-transform: uppercase; }
    .k-dtable tr:last-child td { border-bottom: 0; }
    .k-dtable td.k-mono { font-family: var(--font-mono); }
    .k-modal__sum { font-size: var(--text-base); color: var(--fg); margin-bottom: 10px; }
    .k-modal__foot { margin-top: 12px; font-size: var(--text-sm); }
    .k-modal__foot a { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); text-decoration: none; }
    .k-modal__foot a:hover { text-decoration: underline; }

    /* About modal: server/agent identity + a live, filterable GitHub changelog */
    .k-deflist__v a { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); text-decoration: none; }
    .k-deflist__v a:hover { text-decoration: underline; }
    .k-about__changelog-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .k-about__changelog-bar select.k-input { flex: none; width: auto; }
    .k-about__changelog { max-height: 320px; overflow-y: auto; border: var(--border-width) solid var(--border);
      border-radius: var(--radius-md); background: var(--bg-sunken); }
    .k-about__entry { padding: 10px 13px; border-bottom: var(--border-width) solid var(--border); }
    .k-about__entry:last-child { border-bottom: 0; }
    .k-about__entry-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
    .k-about__entry-version { font-weight: var(--weight-bold); font-size: var(--text-sm); }
    .k-about__entry-date { font-size: 12px; color: var(--fg-muted); white-space: nowrap; }
    .k-about__entry-body { font-size: var(--text-sm); color: var(--fg); white-space: pre-wrap;
      overflow-wrap: anywhere; line-height: var(--leading-normal); }
    .k-about__empty { padding: 12px 13px; color: var(--fg-muted); font-size: var(--text-sm); }

    /* AI Recommendation block: sits at the top of the section-detail body,
       between the heading and the metrics. Only rendered for warn/crit when an
       Anthropic API key is configured. */
    .k-airec { border: 1px solid var(--border); border-radius: var(--radius-md);
      background: var(--bg-sunken); padding: 11px 13px; margin-bottom: 14px; }
    /* The heading + sparkle read as the bright label of the block (the old
       --accent-fg resolved to near-black on the dark surface). */
    .k-airec__head { display: flex; align-items: center; gap: 7px; font-size: var(--text-sm);
      font-weight: var(--weight-bold); color: var(--fg); margin-bottom: 7px; }
    .k-airec__head svg { color: var(--accent); }
    /* Reserve roughly the height of a full Diagnosis/Action/Urgency reply so the
       block is sized from the start and doesn't visibly grow as it streams in. */
    .k-airec__body { font-size: var(--text-sm); color: var(--fg); white-space: pre-wrap;
      overflow-wrap: anywhere; line-height: 1.5; min-height: 8.5em; }
    .k-airec__wait { color: var(--fg-muted); }
    .k-airec__err { color: var(--crit-fg); margin-top: 6px; }
    .k-airec__foot { margin-top: 9px; }
    .k-airec__foot:empty { display: none; }
    /* Forecast card: same spark/prose treatment as the AI Recommendation, but
       pinned at the top of the drill-down. A shorter reserved body —
       the forecast is a few sentences, not a Diagnosis/Action/Urgency reply. */
    .kc-forecast { margin-bottom: 16px; }
    .kc-forecast .k-airec__body { min-height: 3.4em; }
    /* Parental-controls list editor (web_activity section detail). */
    .kwf-togs { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 8px 0 12px; }
    .kwf-tog { display: inline-flex; align-items: center; gap: 7px; font-size: var(--text-sm);
      color: var(--fg); cursor: pointer; }
    .kwf-tog input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
    .kwf-add { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .kwf-add .k-input { flex: 1 1 auto; min-width: 0; }
    .kwf-add select.k-input { flex: none; width: auto; max-width: max-content; }
    .kwf-add .k-btn { flex: none; }
    .kwf-list { display: flex; flex-direction: column; gap: 4px; }
    .kwf-row { display: flex; align-items: center; gap: 8px; font-size: var(--text-sm);
      padding: 5px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg-sunken); }
    .kwf-apply { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }

    /* ====================================================================
       CONSOLE LAYOUT (.kc-*)
       ==================================================================== */
    .kc-app { max-width: 1728px; margin: 0 auto; padding: 0 26px 56px; }
    .kc-header { display: flex; align-items: center; justify-content: space-between;
      padding: 18px 26px; max-width: 1728px; margin: 0 auto; border-bottom: 1px solid var(--border);
      flex-wrap: wrap; gap: 12px; }
    .kc-brand { display: flex; align-items: center; gap: 12px; }
    .kc-logo { width: 38px; height: 38px; border-radius: 50%; display: block; }
    .kc-brand__name { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; line-height: 1; }
    .kc-brand__sub { font-size: 12px; color: var(--fg-muted); letter-spacing: .04em; text-transform: uppercase; margin-top: 3px; }
    .kc-header__right { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .kc-operator { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-sm); color: var(--fg-muted); }
    .kc-operator svg { width: 15px; height: 15px; }
    .kc-icon-btn { position: relative; display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: var(--radius-sm); border: 1px solid var(--border);
      background: transparent; color: var(--fg-muted);
      cursor: pointer; transition: background var(--dur) var(--ease), color var(--dur) var(--ease); }
    .kc-icon-btn:hover { background: var(--surface-raised); color: var(--fg); }
    .kc-icon-btn.is-active { background: var(--surface-raised); color: var(--accent); border-color: var(--border-strong); }
    .kc-icon-btn svg { width: 16px; height: 16px; }
    /* small numeric badge (e.g. pending-approvals count) anchored to an icon button */
    .k-badge { position: absolute; top: -5px; right: -5px; min-width: 16px; height: 16px; padding: 0 4px;
      border-radius: 999px; background: var(--crit-solid); color: var(--crit-on); font-size: 10px; font-weight: 700;
      line-height: 16px; text-align: center; }

    /* ticket detail: chronological trail of state changes, tool calls, approvals, notes */
    .kc-timeline__row { display: flex; align-items: baseline; gap: 10px; padding: 7px 4px;
      border-bottom: 1px solid var(--border); font-size: var(--text-sm); flex-wrap: wrap; }
    .kc-timeline__row:last-child { border-bottom: none; }
    .kc-timeline__actor { min-width: 90px; color: var(--fg-muted); flex: none; }

    /* top-level tab navigation (Fleet / Activity) */
    .kc-tabs { display: flex; align-items: center; gap: 6px; }
    .kc-tab { position: relative; display: inline-flex; align-items: center; gap: 7px; padding: 7px 20px 7px 14px;
      border-radius: var(--radius-sm);
      font-size: var(--text-sm); font-weight: 500; color: var(--fg-muted); text-decoration: none;
      border: 1px solid transparent; transition: background var(--dur) var(--ease), color var(--dur) var(--ease); }
    .kc-tab:hover { background: var(--surface-raised); color: var(--fg); }
    .kc-tab.is-active { background: var(--surface-raised); color: var(--fg); border-color: var(--border-strong); }
    .kc-tab svg { width: 16px; height: 16px; }
    /* the ticket chat composer's mode toggle (Send to kenny / Add a note)
       reuses .kc-tab's look, but as <button>s rather than nav <a>s — reset the
       browser's own button chrome so it doesn't peek through */
    .tk-mode-btn { font: inherit; background: none; cursor: pointer; }

    .kc-main { display: flex; flex-direction: column; gap: 14px; padding-top: 16px; }

    /* fleet summary metrics — compact segmented cluster in the header
       (replaces the old full-width row of stat cards). */
    .kc-metrics { display: inline-flex; align-items: stretch; border: 1px solid var(--border);
      border-radius: var(--radius-pill); background: var(--surface); overflow: hidden; }
    .kc-metric { display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px;
      font-size: var(--text-xs); color: var(--fg-muted); white-space: nowrap; }
    .kc-metric + .kc-metric { border-left: 1px solid var(--border); }
    .kc-metric b { color: var(--fg); font-weight: var(--weight-bold); }
    .kc-metric svg { width: 14px; height: 14px; color: var(--fg-faint); }
    .kc-metric__sub { color: var(--fg-faint); }
    .kc-metric--warn b { color: var(--warn-fg); }
    .kc-metric--crit b { color: var(--crit-fg); }
    /* warn/crit metrics become links into the flagged view when there is something to see */
    a.kc-metric { text-decoration: none; cursor: pointer; transition: background var(--dur) var(--ease); }
    a.kc-metric:hover { background: var(--surface-raised); }
    @media (max-width: 760px) { .kc-metric__lbl { display: none; } }

    /* three-column console: fleet · agent detail · docked copilot rail.
       align-items:start lets the sticky rail scroll independently of the cards. */
    .kc-console { display: grid; grid-template-columns: 300px minmax(0, 1fr) 380px;
      gap: 16px; align-items: start; }
    /* The docked-rail "off" state only reshapes the layout on desktop: it drops
       the 3rd column and hides the rail. This stays desktop-scoped on purpose —
       below the rail breakpoint the copilot is an out-of-flow overlay drawer, so
       the grid must be driven purely by width. If these .no-copilot rules leaked
       to narrow widths their higher specificity (0,2,0) would override the
       width-based media rules (0,1,0) and force a 300px two-column grid onto a
       phone, overflowing the viewport. */
    @media (min-width: 1181px) {
      .kc-console.no-copilot { grid-template-columns: 300px minmax(0, 1fr); }
      .kc-console.no-copilot .kc-copilot { display: none; }
    }
    @media (max-width: 1180px) { .kc-console { grid-template-columns: 280px minmax(0, 1fr); } }
    @media (max-width: 820px) { .kc-console { grid-template-columns: 1fr; } }
    .kc-section-lbl { font-size: 12px; color: var(--fg-muted); letter-spacing: .04em; text-transform: uppercase; }

    .kc-fleet { display: flex; flex-direction: column; gap: 10px; }
    .kc-fleet__list { display: flex; flex-direction: column; gap: 8px; }
    .kc-agent { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; cursor: pointer;
      background: var(--bg-sunken); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px 12px;
      transition: border-color var(--dur) var(--ease); font-family: var(--font-sans); color: var(--fg); }
    .kc-agent:hover { border-color: var(--border-strong); }
    .kc-agent.is-selected { background: var(--surface-raised); border-color: var(--border-strong); }
    .kc-agent.is-crit { border: 2px solid var(--crit-solid); background: var(--crit-bg); padding: 9px 11px; }
    .kc-agent__body { display: flex; flex-direction: column; min-width: 0; flex: 1; }
    .kc-agent__name { font-size: var(--text-sm); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kc-agent__sum { font-size: var(--text-xs); color: var(--fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kc-agent__off { font-size: 11px; color: var(--fg-faint); letter-spacing: .04em; text-transform: uppercase; flex: none; }

    /* activity sub-nav: anchors styled like the fleet list, distinct class so
       renderConsoleListSelection()'s .kc-agent query never touches them */
    .kc-navitem { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; cursor: pointer;
      background: var(--bg-sunken); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px 12px;
      transition: border-color var(--dur) var(--ease); font-family: var(--font-sans); color: var(--fg); text-decoration: none; }
    .kc-navitem:hover { border-color: var(--border-strong); }
    .kc-navitem.is-active { background: var(--surface-raised); border-color: var(--border-strong); }
    .kc-navitem svg { flex: none; color: var(--fg-muted); }
    .kc-navitem__name { font-size: var(--text-sm); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kc-navitem__sub { font-size: var(--text-xs); color: var(--fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .kc-addpc { margin-top: 4px; padding: 12px; background: var(--bg-sunken);
      border: 1px dashed var(--border-strong); border-radius: var(--radius-md); }
    .kc-addpc__head { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; margin-bottom: 8px; }
    .kc-addpc__head svg { width: 14px; height: 14px; }
    /* The OS picker and the installer button read as one joined split-control so
       the row fits inside the dashed box instead of the button overflowing it;
       the row also wraps as a safety net on very narrow sidebars. */
    .kc-addpc__row { flex-wrap: wrap; }
    .kc-addpc__split { display: inline-flex; align-items: stretch; flex: none; }
    .kc-addpc__split .kc-addpc__os {
      width: auto; border-top-right-radius: 0; border-bottom-right-radius: 0; }
    .kc-addpc__split .kc-addpc__go {
      border-top-left-radius: 0; border-bottom-left-radius: 0; }

    .kc-detail { display: flex; flex-direction: column; gap: 12px; }
    .kc-detail__head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    .kc-detail__name { font-size: var(--text-md); font-weight: 600; overflow-wrap: anywhere; }
    .kc-detail__meta { font-size: var(--text-xs); color: var(--fg-muted); }
    .kc-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .kc-trend { display: flex; flex-direction: column; gap: 8px; }
    .kc-spark { width: 100%; height: 44px; display: block; }
    .kc-shotcard { display: flex; flex-direction: column; gap: 8px; }
    .kc-shot { max-width: 100%; border-radius: 8px; cursor: zoom-in; display: block; }

    /* flagged view: warnings/critical grouped by agent (reached via header pills) */
    .kc-flagged { display: flex; flex-direction: column; gap: 14px; padding-top: 16px; }
    .kc-flagged__bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .kc-flagged__title { display: inline-flex; align-items: center; gap: 10px; font-size: var(--text-md);
      font-weight: var(--weight-bold); }
    .kc-flagged__title svg { width: 20px; height: 20px; color: var(--fg-muted); }
    .kc-flagged__group { display: flex; flex-direction: column; gap: 12px; }
    .kc-flagged__head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .kc-chat { display: flex; flex-direction: column; gap: 10px; }
    .kc-chat__head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .kc-chat__title { font-size: var(--text-sm); font-weight: 600; }
    .kc-chat__title svg { width: 16px; height: 16px; }
    .kc-ctx { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted);
      background: var(--bg-sunken); border: 1px solid var(--border); border-radius: var(--radius-pill); padding: 3px 10px; }
    .kc-history-list { display: flex; flex-direction: column; gap: 2px; max-height: 60vh; overflow-y: auto; }
    .kc-history-row { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: var(--radius-sm);
      cursor: pointer; transition: background var(--dur) var(--ease); }
    .kc-history-row:hover { background: var(--bg-sunken); }
    .kc-history-row__main { flex: 1; min-width: 0; }
    .kc-history-row__title { font-size: var(--text-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .kc-history-row__meta { font-size: 11px; color: var(--fg-muted); margin-top: 2px; }
    .kc-transcript { display: flex; flex-direction: column; gap: 9px; max-height: 46vh; overflow-y: auto;
      padding: 4px; min-height: 96px; }
    /* ticket detail's own chat/trail scroll container — same bounded-scroll
       shape as .kc-transcript above, sized for the timeline panel rather than
       the docked rail. Without this the timeline had no max-height/overflow at
       all, so it grew the whole page instead of scrolling in place. */
    .kc-timeline { display: flex; flex-direction: column; max-height: 52vh; overflow-y: auto;
      min-height: 96px; }
    .kc-composer { display: flex; gap: 8px; }
    .kc-composer .k-input { flex: 1; }
    .kc-suggest { display: flex; gap: 8px; flex-wrap: wrap; }
    .kc-chip { font-family: var(--font-sans); font-size: 12px; color: var(--fg-muted); cursor: pointer;
      background: transparent; border: 1px solid var(--border); border-radius: var(--radius-pill); padding: 4px 11px;
      transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease); }
    .kc-chip:hover { border-color: var(--accent); color: var(--fg); }

    /* docked "Ask kenny" rail: full-height sticky column whose transcript fills
       and scrolls inside the rail, so the agent cards never move as the chat
       grows. Below 1180px (see the tablet media query) it becomes an overlay
       drawer. The .kc-copilot* class names stay as-is on purpose: they name a
       layout rail, not the persona, so renaming them is not part of this. */
    .kc-copilot { position: sticky; top: 16px; align-self: start; height: calc(100vh - 32px); }
    .kc-copilot .kc-transcript { flex: 1 1 auto; max-height: none; min-height: 0; }
    /* Tablet/narrow: the rail is a right-anchored overlay drawer that slides in
       over a dimming backdrop, instead of stacking far below the agent cards
       (where toggling it had no visible effect). It is fixed (out of flow), so it
       no longer reserves a bottom row. Hidden off-screen until .copilot-drawer-open
       is set on the console (see toggleAskRail / openAskDrawer). */
    @media (max-width: 1180px) {
      .kc-copilot { position: fixed; top: 0; right: 0; z-index: 70; height: 100vh;
        width: min(380px, 92vw); margin: 0; border-radius: 0; overflow-y: auto;
        transform: translateX(100%); transition: transform var(--dur) var(--ease);
        box-shadow: -18px 0 40px -22px rgba(0,0,0,.7); }
      .kc-copilot .kc-transcript { flex: none; max-height: 46vh; }
      .kc-console.copilot-drawer-open .kc-copilot { transform: none; }
      /* keep the ticket timeline readable rather than letterboxed on a phone */
      .kc-timeline { max-height: 60vh; }
    }
    /* dimming backdrop behind the tablet drawer; click to dismiss */
    .kc-backdrop { position: fixed; inset: 0; z-index: 65; background: rgba(0,0,0,.45);
      opacity: 0; pointer-events: none; transition: opacity var(--dur) var(--ease); }
    .kc-backdrop.is-visible { opacity: 1; pointer-events: auto; }
    /* one-shot slide+fade when the docked rail is toggled (see toggleAskRail):
       it slides in from the right on open, and back out to the right on close. */
    @keyframes kCopilotIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
    @keyframes kCopilotOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(14px); } }
    .kc-copilot--enter { animation: kCopilotIn var(--dur) var(--ease); }
    .kc-copilot--exit { animation: kCopilotOut var(--dur) var(--ease); }
    @media (prefers-reduced-motion: reduce) {
      .kc-copilot--enter, .kc-copilot--exit { animation: none; }
      .kc-copilot, .kc-backdrop { transition: none; }

    .kc-banner { border-color: color-mix(in oklab, var(--warn-dot) 45%, var(--border)); }
    .kc-banner__msg { white-space: pre-wrap; margin: 6px 0 8px; }

    /* toasts — in-app, non-blocking notifications (replace native alert()) */
    .k-toasts { position: fixed; right: 18px; bottom: 18px; z-index: 60;
      display: flex; flex-direction: column; gap: 8px; max-width: 380px; }
    .k-toast { display: flex; align-items: flex-start; gap: 9px; padding: 10px 13px;
      background: var(--surface-raised); border: 1px solid var(--border-strong);
      border-radius: var(--radius-md); font-size: var(--text-sm); color: var(--fg);
      box-shadow: 0 14px 34px -16px rgba(0,0,0,.6); animation: kToastIn var(--dur) var(--ease); }
    .k-toast svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }
    .k-toast--ok svg { color: var(--ok-fg); }
    .k-toast--err { border-color: color-mix(in oklab, var(--crit-solid) 55%, var(--border-strong)); }
    .k-toast--err svg { color: var(--crit-fg); }
    .k-toast.is-leaving { opacity: 0; transition: opacity var(--dur-slow) var(--ease); }
    @keyframes kToastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .k-toast { animation: none; } }

    /* modal action footer — buttons for the in-app confirm / share dialogs */
    .k-modal__actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }

    /* ====================================================================
       OVERVIEW — high-level fleet dashboard (ECharts widgets + KPI tiles)
       ==================================================================== */
    .kc-ov { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-4); margin-top: var(--space-5); }
    .kc-ov__wide { grid-column: 1 / -1; }
    @media (max-width: 900px) { .kc-ov { grid-template-columns: minmax(0, 1fr); }
      .kc-ov__wide { grid-column: auto; } }
    .kc-ov__card { display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; }
    .kc-ov__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .kc-ov__title { display: flex; align-items: center; gap: 8px; font-size: var(--text-md);
      font-weight: var(--weight-bold); letter-spacing: var(--tracking-tight); }
    .kc-ov__title svg { width: 18px; height: 18px; color: var(--accent); }
    .kc-ov__hint { font-size: var(--text-xs); color: var(--fg-faint); }
    .kc-chart { width: 100%; min-height: 240px; }

    /* KPI tiles — actionable totals; clickable for drill-down */
    .kc-kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--space-3); }
    @media (max-width: 1100px) { .kc-kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 560px) { .kc-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .kc-kpi { text-align: left; background: var(--bg-sunken); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); cursor: pointer;
      transition: border-color var(--dur) var(--ease), transform var(--dur-fast) var(--ease); font: inherit; }
    .kc-kpi:hover { border-color: var(--border-strong); transform: translateY(-1px); }
    .kc-kpi[data-empty="1"] { cursor: default; }
    .kc-kpi[data-empty="1"]:hover { border-color: var(--border); transform: none; }
    .kc-kpi__val { font-size: var(--text-2xl); font-weight: var(--weight-bold); line-height: 1;
      letter-spacing: var(--tracking-tight); }
    .kc-kpi__val.is-alert { color: var(--crit-fg); }
    .kc-kpi__suffix { font-size: var(--text-md); color: var(--fg-faint); font-weight: var(--weight-normal); }
    .kc-kpi__lbl { margin-top: 6px; font-size: var(--text-sm); color: var(--fg-muted); }

    /* drill-down table (inside the reused modal) */
    .kc-dtable { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
    .kc-dtable th { text-align: left; color: var(--fg-faint); font-weight: var(--weight-bold);
      font-size: var(--text-xs); letter-spacing: var(--tracking-label); text-transform: uppercase;
      padding: 4px 10px; border-bottom: 1px solid var(--border); }
    .kc-dtable td { padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .kc-dtable tr:last-child td { border-bottom: none; }
    .kc-linkbtn { font: inherit; color: var(--link); background: none; border: none; padding: 0;
      cursor: pointer; text-align: left; }
    .kc-linkbtn:hover { text-decoration: underline; text-underline-offset: 2px; }
    .kc-seg { display: inline-flex; align-items: center; gap: 6px; }

    /* compact select used by the dynamic widgets (Top-N metric, Sankey/Trend) */
    .kc-ovsel { font: inherit; font-size: var(--text-sm); color: var(--fg); background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px 8px; cursor: pointer; }
    .kc-ov__empty { color: var(--fg-muted); font-size: var(--text-sm); padding: var(--space-5);
      text-align: center; }

    /* Settings tab: a single column of grouped panels. */
    .kset { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--space-4); }
    /* Tickets stack like the settings pages but must not be capped: this is a
       working list with a title, requester, agent and age column, so it gets the
       full console width the fleet view uses rather than a centred form column. */
    .ktk { display: flex; flex-direction: column; gap: var(--space-4); }
    .kset__intro { font-size: var(--text-sm); padding: 2px 2px 0; }
    .kset__grp { padding: var(--space-4) var(--space-5); }
    .kset__row { display: flex; align-items: flex-start; gap: var(--space-4);
      padding: var(--space-4) 0; border-top: 1px solid var(--border); }
    .kset__grp .kset__row:first-of-type { border-top: none; }
    .kset__meta { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .kset__label { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 600; }
    .kset__help { font-size: var(--text-sm); }
    .kset__key { font-size: 11px; opacity: 0.7; }
    .kset__ctl { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      justify-content: flex-end; max-width: 46%; }
    .kset__input { width: 15ch; max-width: 100%; }
    .kset__ro { font-size: var(--text-sm); color: var(--fg-muted); word-break: break-all; text-align: right; }
    .k-pill--muted { background: transparent; color: var(--unk-fg); border-color: var(--border-strong); }
    @media (max-width: 720px) {
      .kset__row { flex-direction: column; }
      .kset__ctl { max-width: 100%; justify-content: flex-start; }
    }
    /* Settings sidebar + pane (superuser catalog groups, plus the Backup and
       Updates sections, all living under #/settings/{slug}). Same
       flex-column-of-panels shape as .kset, but it is the right-hand column
       of the .kc-console sidebar grid rather than a page centred on its own
       — the sidebar (nav + search) is the left column, built from the same
       .kc-fleet/.kc-navitem primitives the Activity tab uses. */
    .ksetpane { display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; max-width: 820px; }

    /* ====================================================================
       IDENTITY — header control, dropdown menu, avatars, account modals
       ==================================================================== */
    .kc-identity { position: relative; display: inline-flex; }
    .kc-identity__btn { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px;
      border-radius: var(--radius-pill); border: 1px solid var(--border); background: var(--surface);
      color: var(--fg); font-family: var(--font-sans); font-size: var(--text-sm); cursor: pointer;
      transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease); }
    .kc-identity__btn:hover { background: var(--surface-raised); border-color: var(--border-strong); }
    .kc-identity__btn svg.kc-chev { width: 14px; height: 14px; color: var(--fg-faint); }
    .kc-identity__name { font-weight: var(--weight-bold); white-space: nowrap; }

    .kc-avatar--lg { width: 52px; height: 52px; }

      text-decoration: none; }
    .kc-usermenu__item:hover { background: var(--surface-raised); text-decoration: none; }
    .kc-usermenu__item svg { width: 16px; height: 16px; color: var(--fg-muted); flex: none; }
    .kc-usermenu__sep { height: 1px; background: var(--border); margin: 4px 2px; }

    .kacc-head { display: flex; align-items: center; gap: 14px; }

    .kfield { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
    .kfield__lbl { font-size: var(--text-sm); color: var(--fg-muted); }
    .kfield__row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .kfield__row .k-input { flex: 1 1 180px; min-width: 0; }
    .kfield__row .k-btn { flex: none; }
    .kacc-avgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 10px; }
    .kacc-av { display: flex; align-items: center; justify-content: center; padding: 6px; cursor: pointer;

    .kacc-tbl { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
    .kacc-tbl th { text-align: left; color: var(--fg-muted); font-weight: var(--weight-normal);
      font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-label);
      padding: 6px 10px; border-bottom: 1px solid var(--border); }
    .kacc-tbl td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }

    .k-pill--role { background: var(--accent-wash); color: var(--accent); border-color: color-mix(in oklab, var(--accent) 35%, transparent); }
