      const rw = canOperate() && (((state.detail || {}).governance || {}).supported !== false);
      const rightLabel = acctLabels(ACCT_RIGHT_LABEL);
      const accounts = Array.isArray(raw.accounts) ? raw.accounts : [];
      const enabledAdmins = accounts.filter(a => a.enabled && a.is_admin).length;

      const rows = accounts.map(a => {
        const name = a.name || "?";
        const nm = jsArg(name);
        const unsup = a.unsupported || {};
        const deny = Array.isArray(a.deny_logon) ? a.deny_logon : [];
        // The self-protection rule the agent enforces, mirrored here so the button
        // is visibly unavailable instead of failing on click. The agent stays
        // authoritative — this is UX, not the boundary.
        const lastAdmin = a.enabled && a.is_admin && enabledAdmins <= 1;
        const builtin = a.builtin_admin || a.builtin_guest;
        const guardTitle = lastAdmin
          ? "blocked: this is the last enabled administrator — changing it would lock everyone out of this machine"
          : "";
        const btn = (label, ico, handler, disabled, title, danger) => `
          <button class="k-btn ${danger ? "k-btn--danger" : "k-btn--ghost"} k-btn--sm"
            ${disabled ? "disabled" : ""} title="${esc(title || "")}"
            ${disabled ? "" : `onclick="${handler}"`}>${icon(ico, 12)}${esc(label)}</button>`;
        // The capability map decides; the lockout guard is the second reason.
        const why = verb => acctWhyNot(a, verb);
        const off = (verb, guardApplies) => why(verb) || (guardApplies ? guardTitle : "");

        const offEnable = off("set_enabled", a.enabled && lastAdmin);
        const offAdmin = off("set_admin", a.is_admin && lastAdmin);
        const offLock = off("session_lock", false);
        const offLogoff = off("session_logoff", false);
        const offDelete = why("delete")
          || (builtin ? "blocked: built-in accounts cannot be deleted" : "")
          || (lastAdmin ? guardTitle : "");

        const actions = rw ? `
          ${btn(a.enabled ? "suspend" : "restore", a.enabled ? "x" : "check",
                `acctSetEnabled(${aid}, ${nm}, ${a.enabled ? "false" : "true"})`,
                !!offEnable, offEnable)}
          ${btn(a.is_admin ? "make standard" : "make admin", "shield-check",
                `acctSetAdmin(${aid}, ${nm}, ${a.is_admin ? "false" : "true"})`,
                !!offAdmin, offAdmin)}
          ${btn("lock", "lock", `acctSession(${aid}, ${nm}, 'lock')`, !!offLock,
                offLock || "lock this account's screen; open apps keep running")}
          ${btn("sign out", "log-out", `acctSession(${aid}, ${nm}, 'logoff')`, !!offLogoff,
                offLogoff || "end this account's session")}
          ${btn("delete", "trash-2", `acctDelete(${aid}, ${nm})`, !!offDelete, offDelete, true)}
        ` : "";

        const flags = [
          a.enabled ? "" : `<span class="k-pill k-pill--warn">suspended</span>`,
          a.is_admin ? `<span class="k-pill k-pill--crit">administrator</span>` : "",
          a.builtin_admin ? `<span class="k-pill k-pill--warn">built-in</span>` : "",
          a.builtin_guest ? `<span class="k-pill k-pill--warn">guest</span>` : "",
        ].filter(Boolean).join(" ");

        // Both switches render on every host. Where one is not possible, it is
        // greyed with its reason rather than removed — the shape of the panel
        // stays the same, only the data differs.
        const denyTog = (right, verb) => {
          const blocked = why(verb);
          return `
          <label class="kwf-tog" title="${esc(blocked || ("deny " + rightLabel[right]))}">
            <input type="checkbox" ${deny.includes(right) ? "checked" : ""}
              ${(rw && !blocked) ? "" : "disabled"}
              onchange="acctSetDeny(${aid}, ${nm}, '${right}', this.checked)"/><span>${esc(rightLabel[right])}</span></label>`;
        };
        const denyLine = denyTog("network", "deny_network")
          + denyTog("remote_interactive", "deny_remote_interactive");

        // Only the asymmetries, and always with their reason.
        const unsupLine = Object.keys(unsup).length ? `
          <div class="k-muted" style="margin-top:4px">not available for this account:
            ${Object.entries(unsup).map(([verb, reason]) =>
              `<span title="${esc(ACCT_UNSUPPORTED_REASON[reason] || reason)}">${esc(ACCT_VERB_LABEL[verb] || prettyKey(verb))}</span>`
            ).join(", ")}</div>` : "";

        const family = a.kind === "microsoft" ? `
          <div class="k-muted" style="margin-top:4px">If this account is in a Microsoft
            family group, Windows enforces that group's screen time itself — kenny can
            neither read nor change it.</div>` : "";

        return `<div class="kwf-row" style="flex-wrap:wrap;gap:6px">
          <span class="k-mono">${esc(name)}</span>
          ${a.display && a.display !== name ? `<span class="k-muted">${esc(a.display)}</span>` : ""}
          ${acctKindBadge(a.kind)} ${flags}
          <span style="flex-basis:100%"></span>
          <div class="kwf-togs">${denyLine}</div>
          <span style="flex-basis:100%"></span>
          ${actions}
          ${unsupLine}${family}
        </div>`;
      }).join("");

      body += `<div class="k-detail-grp">
        <div class="k-detail-grp__lbl">accounts on this machine</div>
        ${rows || `<div class="k-muted">no accounts reported</div>`}
      </div>`;

      const pol = raw.password_policy || {};
      const polGaps = pol.unsupported || {};
      // A `null` value and an `unsupported` entry are different claims: "kenny
      // could not read this" versus "this machine has no such setting". Showing
      // "—" for both would collapse a distinction the contract works to keep.
      const polRow = (label, key, value) => {
        const gap = polGaps[key];
        const shown = gap
          ? `<span class="k-muted">not available here</span>`
          : esc((value === null || value === undefined) ? "—" : String(value));
        const why = gap ? ` title="${esc(ACCT_UNSUPPORTED_REASON[gap] || gap)}"` : "";
        return `<div class="k-deflist__k"${why}>${esc(label)}</div><div class="k-deflist__v"${why}>${shown}</div>`;
      };
      body += `<div class="k-detail-grp">
        <div class="k-detail-grp__lbl">password policy</div>
        <div class="k-deflist">
          ${polRow("Minimum length", "min_length", pol.min_length)}
          ${polRow("Maximum age (days)", "max_age_days", pol.max_age_days)}
          ${polRow("Lockout threshold", "lockout_threshold", pol.lockout_threshold)}
        </div>
        <div class="k-muted" style="margin-top:6px">Applies to accounts stored on this
          machine only. An account backed by an online or directory service — a Microsoft
          account, a work or school account, an LDAP identity — follows that service's own
          password policy and ignores this entirely.</div>
      </div>`;

      body += `<div class="k-muted" style="margin-top:8px">Changes are refused while the
        person at the machine has remote control switched off, and an administrator on the
        machine can undo them. Already-applied changes persist; new ones do not go through.</div>`;
      body += `<div id="kacct-msg"></div>`;
      return body;
    }

    function acctMsg(text, isErr) {
      const el = document.getElementById("kacct-msg");
      if (el) el.innerHTML = `<div class="${isErr ? "k-airec__err" : "k-muted"}" style="margin-top:8px">${esc(text)}</div>`;
    }

    // Run one governance tool, then re-collect telemetry so the panel reflects the
    // machine rather than what we hoped would happen.
    async function acctCall(agentId, tool, args, okText) {
      try {
        const r = await getJSON("/api/agent/" + encodeURIComponent(agentId) + "/accounts/" + tool,
          { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(args) });
        if (r && r.ok === false) {
          acctMsg(r.error === "disabled"
            ? "refused: remote control is switched off at that machine"
            : (r.message || r.error || "refused"), true);
          return false;
        }
        notify(okText);
        await refreshNow(agentId);
        return true;
      } catch (e) { acctMsg("failed: " + e.message, true); return false; }
    }
    function acctSetEnabled(agentId, name, enabled) {
      return acctCall(agentId, "account_set_enabled", { principal: name, enabled },
        enabled ? "account restored" : "account suspended");
    }
    async function acctSetAdmin(agentId, name, admin) {
      if (!admin) {
        const ok = await confirmModal({
          title: "Remove administrator rights",
          ico: "shield-check",
          body: "Make '" + name + "' a standard user? This is what makes kenny's other "
            + "controls hold — an account with administrator rights can undo them.",
          confirmLabel: "Make standard",
        });
        if (!ok) return;
      }
      return acctCall(agentId, "account_set_admin", { principal: name, admin },
        admin ? "administrator rights granted" : "administrator rights removed");
    }
    function acctSetDeny(agentId, name, right, on) {
      // The tool takes the full desired set, so rebuild it from what is rendered.
      const acct = (((state.detail || {}).snapshot || {}).local_accounts || {}).accounts || [];
      const cur = (acct.find(a => a.name === name) || {}).deny_logon || [];
      const next = on ? Array.from(new Set(cur.concat([right]))) : cur.filter(r => r !== right);
      return acctCall(agentId, "account_set_logon_rights", { principal: name, deny: next },
        "sign-in restrictions updated");
    }
    async function acctSession(agentId, name, action) {
      // Whether the person can be warned first is a property of the host, not a
      // promise the dashboard gets to make: Linux has no reliable channel to a
      // signed-in user's screen, and saying "they will be warned" there would be
      // a lie the operator acts on.
      const acct = (((state.detail || {}).snapshot || {}).local_accounts || {}).accounts || [];
      const canWarn = !acctWhyNot(acct.find(a => a.name === name) || {}, "session_warn");
      const warnSeconds = canWarn ? 30 : 0;
      const ok = await confirmModal({
        title: action === "lock" ? "Lock the session" : "Sign the account out",
        ico: action === "lock" ? "lock" : "log-out",
        body: (action === "lock"
          ? "Lock '" + name + "'s screen? Open apps keep running."
          : "Sign '" + name + "' out? Unsaved work in open apps may be lost.")
          + (canWarn ? " They will be warned 30 seconds beforehand."
                     : " This machine has no way to warn them first, so it happens immediately."),
        confirmLabel: action === "lock" ? "Lock" : "Sign out",
      });
      if (!ok) return;
      if (canWarn) notify("warning the person at the machine, then acting in 30 seconds…");
      return acctCall(agentId, "account_session_action",
        { principal: name, action, warn_seconds: warnSeconds },
        action === "lock" ? "session locked" : "signed out");
    }
    async function acctDelete(agentId, name) {
      const acct = (((state.detail || {}).snapshot || {}).local_accounts || {}).accounts || [];
      const kind = (acct.find(a => a.name === name) || {}).kind;
      const noun = acctLabels(ACCT_PROFILE_NOUN);
      const ok = await confirmModal({
        title: "Delete account",
        ico: "trash-2",
        body: "Delete '" + name + "' and its " + noun + " from this machine? "
          + (kind === "microsoft"
              ? "For a Microsoft account this only unlinks it from this machine — the "
                + "Microsoft account itself is untouched. "
              : "")
          + "Local files in it are deleted and cannot be recovered.",
        confirmLabel: "Delete",
        confirmClass: "k-btn--danger",
      });
      if (!ok) return;
      return acctCall(agentId, "account_delete", { principal: name, remove_profile: true },
        "account deleted");
    }

    function wfCatBadge(cat) {
      const label = { custom: "custom", seed: "seed", external_adult: "adult list", bypass: "bypass" }[cat] || cat || "—";
      return `<span class="k-pill k-pill--${cat === "bypass" ? "warn" : "crit"}">${esc(label)}</span>`;
    }
    function wfActionBadge(action) {
      const cls = action === "allow" ? "ok" : action === "watch" ? "warn" : "crit";
      return `<span class="k-pill k-pill--${cls}">${esc(action)}</span>`;
    }

    // The dashboard's first editable list: fetch and render the per-host
    // parental-controls config into #kwf-panel. Re-runs after every mutation so
    // counts, drift, and applied-state stay current; a closed modal is a no-op.
    async function mountWebfilterPanel(agentId) {
      const panel = document.getElementById("kwf-panel");
      if (!panel) return;
      let d;
      try { d = await getJSON("/api/agent/" + encodeURIComponent(agentId) + "/webfilter"); }
      catch (e) {
        const p = document.getElementById("kwf-panel");
        if (p) p.innerHTML = `<div class="k-airec__err">list unavailable: ${esc(e.message)}</div>`;
        return;
      }
      renderWebfilterPanel(agentId, d);
    }
    function renderWebfilterPanel(agentId, d) {
      const panel = document.getElementById("kwf-panel");
      if (!panel) return;
      const c = d.config || {}, ext = d.external || {}, applied = d.applied || {};
      const on = v => v === true || v === 1;
      const aid = jsArg(agentId);
      // Web-filter mutations are operator/superuser only; a scoped `user` sees the
      // list and status read-only (the mutating endpoints would 403 them anyway).
      const rw = canOperate();
      const tog = (key, label, val, hint) => `
        <label class="kwf-tog" title="${esc(hint || "")}">
          <input type="checkbox" ${on(val) ? "checked" : ""} ${rw ? "" : "disabled"}
            onchange="wfSetConfig(${aid}, ${jsArg(key)}, this.checked)"/><span>${esc(label)}</span></label>`;
      const dohOn = (c.doh_policy || "disable") === "disable";
      const custom = d.custom || [];
      const customRows = custom.length ? custom.map(r => `
        <div class="kwf-row"><span class="k-mono">${esc(r.domain)}</span>${wfActionBadge(r.action)}
          ${r.note ? `<span class="k-muted">${esc(r.note)}</span>` : ""}
          ${rw ? `<button class="k-btn k-btn--danger k-btn--sm" style="margin-left:auto"
            title="remove" onclick="wfRemoveDomain(${aid}, ${jsArg(r.domain)})">${icon('x', 12)}</button>` : ""}</div>`
        ).join("") : `<div class="k-muted">no custom entries yet</div>`;
      const adultN = (ext.adult || {}).count || 0, bypassN = (ext.bypass || {}).count || 0;
      const appliedLine = applied.at
        ? `applied ${esc(fmtValue("at", applied.at))}${applied.ok === false ? " — agent reported failure" : ""}`
        : "not yet applied";
      const drift = d.drift ? `<span class="k-pill k-pill--warn">list changed since last apply</span>` : "";
      const addRow = rw ? `
        <div class="kwf-add">
          <input class="k-input" id="kwf-domain" autocomplete="off" placeholder="domain e.g. example.com"
            onkeydown="if(event.key==='Enter')wfAddDomain(${aid})"/>
          <select class="k-input" id="kwf-action">
            <option value="block">block</option>
            <option value="watch">watch (alarm only)</option>
            <option value="allow">allow (exception)</option>
          </select>
          <button class="k-btn k-btn--primary k-btn--sm" onclick="wfAddDomain(${aid})">${icon('plus', 13)}add</button>
        </div>` : "";
      const applyRow = rw ? `
        <div class="kwf-apply">
          <button class="k-btn k-btn--primary k-btn--sm" onclick="wfApply(${aid})">${icon('refresh-cw', 13)}apply now</button>
          <span class="k-muted">${esc(appliedLine)}</span> ${drift}
        </div>` : `<div class="kwf-apply"><span class="k-muted">${esc(appliedLine)}</span> ${drift}</div>`;
      panel.innerHTML = `
        <div class="k-detail-grp__lbl">parental-controls list</div>
        <div class="kwf-togs">
          ${tog("enabled", "monitor this PC", c.enabled, "observe web activity and match it against this list")}
          ${tog("block_mode", "block listed sites", c.block_mode, "push the block list to the agent (hosts file + DoH off)")}
          ${tog("use_external_adult", "use adult blocklist", c.use_external_adult, "reference the StevenBlack porn-only list (" + adultN + " domains)")}
          ${tog("use_bypass_protection", "block VPN/proxy bypass", c.use_bypass_protection, "also block DoH/VPN/proxy domains (" + bypassN + " domains)")}
          <label class="kwf-tog" title="turn DNS-over-HTTPS off in browsers so the hosts block can't be bypassed">
            <input type="checkbox" ${dohOn ? "checked" : ""} ${rw ? "" : "disabled"}
              onchange="wfSetConfig(${aid}, 'doh_policy', this.checked ? 'disable' : 'leave')"/><span>disable browser DoH</span></label>
        </div>
        ${addRow}
        <div class="kwf-list">${customRows}</div>
        <div class="k-muted" style="margin-top:6px">seed: ${d.seed_count || 0} known adult domains · adult list: ${adultN} · bypass: ${bypassN}</div>
        ${applyRow}
        <div id="kwf-msg"></div>`;
    }
    async function wfSetConfig(agentId, key, value) {
      try {
        const body = {}; body[key] = value;
        await getJSON("/api/agent/" + encodeURIComponent(agentId) + "/webfilter/config",
          { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        mountWebfilterPanel(agentId);
      } catch (e) { wfMsg("could not update: " + e.message, true); }
    }
    async function wfAddDomain(agentId) {
      const inp = document.getElementById("kwf-domain"), sel = document.getElementById("kwf-action");
      const domain = ((inp && inp.value) || "").trim();
      if (!domain) return;
      try {
        await getJSON("/api/agent/" + encodeURIComponent(agentId) + "/webfilter/domains",
          { method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ domain, action: sel ? sel.value : "block" }) });
        mountWebfilterPanel(agentId);
      } catch (e) { wfMsg("could not add: " + e.message, true); }
    }
    async function wfRemoveDomain(agentId, domain) {
      try {
        await getJSON("/api/agent/" + encodeURIComponent(agentId) + "/webfilter/domains/" + encodeURIComponent(domain),
          { method: "DELETE" });
        mountWebfilterPanel(agentId);
      } catch (e) { wfMsg("could not remove: " + e.message, true); }
    }
    async function wfApply(agentId) {
      wfMsg("applying…", false);
      try {
        const r = await getJSON("/api/agent/" + encodeURIComponent(agentId) + "/webfilter/apply", { method: "POST" });
        if (r && r.ok === false && r.error === "disabled")
          wfMsg("remote control is switched off at the PC — new rules were not applied; monitoring continues.", true);
        else wfMsg("applied.", false);
        mountWebfilterPanel(agentId);
      } catch (e) { wfMsg("apply failed: " + e.message, true); }
    }
    function wfMsg(text, isErr) {
      const m = document.getElementById("kwf-msg");
      if (m) m.innerHTML = `<div class="${isErr ? "k-airec__err" : "k-muted"}" style="margin-top:6px">${esc(text)}</div>`;
    }

    // Stream the Haiku recommendation into the popup. Re-queries the target on
    // every event so a closed modal simply ends the loop (the node is gone).
    async function streamRecommendation(agentId, section) {
      let started = false, raw = "";
      try {
        for await (const ev of streamSSE("/api/recommendation/stream", { agent_id: agentId, section })) {
          const body = document.getElementById("airec-body");
          if (!body) return; // modal closed mid-stream
          if (ev.type === "text_delta") {
            if (!started) { body.textContent = ""; started = true; }
            // Re-render the whole accumulated reply each delta so the inline
            // Action steps land on their own lines (see formatRecommendation).
            raw += ev.text;
            body.textContent = formatRecommendation(raw);
          } else if (ev.type === "remediation") {
            if (ev.available && ev.prompt) renderRemediate(agentId, ev.prompt);
          } else if (ev.type === "error") {
            if (!started) { body.textContent = ""; started = true; }
            const e = document.createElement("div");
            e.className = "k-airec__err";
            e.textContent = "recommendation unavailable: " + ev.error;
            body.appendChild(e);
          }
        }
      } catch (e) {
        const body = document.getElementById("airec-body");
        if (body && !started) body.textContent = "recommendation unavailable";
      }
    }

    // The advisor returns "Diagnosis: … / Action: 1) … 2) … / Urgency: …" with the
    // Action steps run together on one line. Break each numbered step (1) or 1.)
    // onto its own line so the list reads as a list. Only single-digit paren/dot
    // markers count as bullets — they don't occur in the Diagnosis/Urgency prose.
    function formatRecommendation(text) {
      return text.replace(/[ \t]+([1-9][.)])\s+/g, (_, mark) => "\n" + mark + " ");
    }

    // Auto-Remediate: Haiku judged the warning fixable with kenny's tools, so
    // offer a button that hands the suggested prompt to the copilot.
    function renderRemediate(agentId, prompt) {
      const foot = document.getElementById("airec-foot");
      if (!foot || foot.querySelector(".k-airec__fix")) return;
      const btn = document.createElement("button");
      btn.className = "k-btn k-btn--primary k-airec__fix";
      btn.innerHTML = `${icon('sparkles', 14)}Auto-Remediate`;
      btn.onclick = () => autoRemediate(agentId, prompt);
      foot.appendChild(btn);
    }

    // Inject the remediation prompt into the copilot: reveal the rail, scope the
    // chat to this PC, close the popup, and start the turn. State-changing steps
    // still hit the confirm-gate — Auto-Remediate does not bypass confirmation.
    function autoRemediate(agentId, prompt) {
      if (!askRailOn()) {
        // "kenny-copilot" stays the storage key on purpose (see askRailOn).
        try { localStorage.setItem("kenny-copilot", "on"); } catch (e) {}
        applyCopilot();
      }
      closeModal();
      setChatContext(agentId);
      startChatTurn(prompt);
    }

    function renderSectionDetail(raw, s) {
      let body = "";
      if (s && s.summary) body += `<div class="k-modal__sum">${esc(s.summary)}</div>`;
      if (s) body += reasonHtml(s.reason, s.status);
      // Partition the raw object: scalars (incl. scalar arrays) → a def-list;
      // arrays-of-objects → tables; nested objects → sub def-lists.
      const scalars = [], tables = [], groups = [];
      for (const [k, v] of Object.entries(raw)) {
        if (k === "status" || k === "summary") continue; // already in the header
        if (Array.isArray(v)) {
          if (v.length && v.every(x => x && typeof x === "object" && !Array.isArray(x))) tables.push([k, v]);
          else scalars.push([k, v.map(x => fmtValue(k, x)).join(", ") || "—"]);
        } else if (v && typeof v === "object") {
          groups.push([k, v]);
        } else {
          scalars.push([k, fmtValue(k, v)]);
        }
      }
      if (scalars.length) body += defListGrp(null, scalars);
      for (const [k, v] of tables) body += tableGrp(k, v);
      for (const [k, v] of groups) body += defListGrp(prettyKey(k), Object.entries(v).map(([kk, vv]) => [kk, fmtValue(kk, vv)]));
      if (!scalars.length && !tables.length && !groups.length) body += `<div class="k-muted">no further detail</div>`;
      return body;
    }
    function defListGrp(label, pairs) {
      const rows = pairs.map(([k, v]) =>
        `<div class="k-deflist__k">${esc(prettyKey(k))}</div><div class="k-deflist__v ${isMono(v) ? "k-mono" : ""}">${esc(v)}</div>`
      ).join("");
      return `<div class="k-detail-grp">${label ? `<div class="k-detail-grp__lbl">${esc(label)}</div>` : ""}<div class="k-deflist">${rows}</div></div>`;
    }
    // Long lists (services, peripherals, processes…) get a client-side filter
    // bar above the table; below this row count the table stays bare.
    const TABLE_FILTER_MIN = 8;
    let tableSeq = 0;
    function tableGrp(label, rows) {
      const cols = [];
      for (const r of rows) for (const k of Object.keys(r)) if (!cols.includes(k)) cols.push(k);
      const head = cols.map(c => `<th>${esc(prettyKey(c))}</th>`).join("");
      const body = rows.map(r => `<tr>${cols.map(c => {
        const val = fmtValue(c, r[c]);
        return `<td class="${isMono(r[c]) ? "k-mono" : ""}">${esc(val)}</td>`;
      }).join("")}</tr>`).join("");
      const tid = "dtbl-" + (++tableSeq);
      const bar = rows.length >= TABLE_FILTER_MIN
        ? `<div class="k-audit__bar">
             <span class="k-audit__search">${icon('search', 15)}
               <input class="k-input" autocomplete="off" placeholder="filter ${esc(prettyKey(label))}…"
                 oninput="filterTable('${tid}', this.value)" /></span>
             <span class="k-audit__count" id="${tid}-count">${rows.length} of ${rows.length}</span>
           </div>`
        : "";
      return `<div class="k-detail-grp"><div class="k-detail-grp__lbl">${esc(prettyKey(label))}</div>
        ${bar}
        <table class="k-dtable" id="${tid}"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
    }

    // Filter a long detail table in place by matching any cell against the query.
    function filterTable(id, q) {
      const tbl = document.getElementById(id);
      if (!tbl || !tbl.tBodies.length) return;
      const needle = q.trim().toLowerCase();
      const rows = tbl.tBodies[0].rows;
      let shown = 0;
      for (const r of rows) {
        const match = !needle || r.textContent.toLowerCase().includes(needle);
        r.hidden = !match;
        if (match) shown++;
      }
      const cnt = document.getElementById(id + "-count");
      if (cnt) cnt.textContent = shown + " of " + rows.length;
    }

    // -- flagged view: warnings/critical grouped by agent (from the pills) --
    async function renderFlagged() {
      const nav = navToken;
      // Reachable from any tab via the header pills; ensure fleet data is loaded.
      if (!state.fleet) {
        state.fleet = await getJSON("/api/fleet").catch(() => ({ agents: [] }));
      }
      if (nav !== navToken) return;  // navigated away while this was loading
      const agents = state.fleet.agents || [];
      renderHeaderRight(state.fleet, agents);
      const sevName = state.flaggedSev === "crit" ? "crit" : "warn";
      const key = sevName === "crit" ? "crit_sections" : "warn_sections";
      const title = sevName === "crit" ? "Critical" : "Warnings";
      const titleIcon = sevName === "crit" ? "octagon-alert" : "triangle-alert";

      // One group per agent that has sections of this severity, busiest first.
      const groups = agents
        .map(a => ({ a, secs: a[key] || [] }))
        .filter(g => g.secs.length)
        .sort((x, y) => y.secs.length - x.secs.length);

      let body;
      if (!groups.length) {
        body = `<div class="k-panel"><div class="k-muted">Nothing needs attention right now — no ${esc(title.toLowerCase())} across the fleet.</div></div>`;
      } else {
        body = groups.map(({ a, secs }) => {
          const hostname = (a.meta && a.meta.hostname) || a.agent_id;
          const tiles = secs.map(s =>
            tileHtml(s.name, sevName, s.summary, s.reason,
              `gotoAgentSection('${esc(a.agent_id)}', '${esc(s.name)}')`)
          ).join("");
          return `<div class="k-panel kc-flagged__group">
            <div class="kc-flagged__head">
              <span class="k-dot k-dot--${sev(a.overall)}"></span>
              <span class="kc-detail__name">${esc(hostname)}</span>
              <span class="kc-detail__meta">${secs.length} ${secs.length === 1 ? "issue" : "issues"}</span>
            </div>
            <div class="kc-tiles">${tiles}</div>
          </div>`;
        }).join("");
      }

      app.innerHTML =
        `<div class="kc-flagged">
           <div class="kc-flagged__bar">
             <a class="k-btn k-btn--ghost k-btn--sm" href="#/fleet">${icon('chevron-left', 13)}back to fleet</a>
             <span class="kc-flagged__title">${icon(titleIcon, 18)}<span>${esc(title)}</span></span>
           </div>
           ${body}
         </div>`;
    }

    // Open one section's detail popup from the flagged view *in place* — without
    // navigating back to the Fleet tab. We only need the agent's snapshot/health
    // (what openSectionDetail reads from state.detail), so load that and open the

    async function gotoAgentSection(id, name) {
      let data;
      try { data = await getJSON("/api/agent/" + encodeURIComponent(id)); }
      catch (e) { notify("failed to load " + id + ": " + e.message, "err"); return; }
      state.selected = id;
      state.detail = data;
      openSectionDetail(name);
    }

        if (r && r.stored === false) notify(r.warning || "refresh collected, but was not stored", "err");
      }

    // -- agent distribution (installer / share / update) ------------------

    function downloadInstaller(id, arch) {

      const id = (document.getElementById("new-agent-id").value || "").trim();

    async function updateAgent(id) {

    // Remove a host from inventory (operator/superuser). A 409 means the host is
    // pinned via the environment — surface the server's `detail` and keep it.
    async function removeAgent(id, name) {
      const ok = await confirmModal({
        title: "Remove from inventory",
        ico: "trash-2",

    // -- binary banner -----------------------------------------------------
    function bannerHtml(bin) {
      // Only warn when no OS has a binary; a Windows-only or Linux-only gap is fine.
      const anyAvail = bin && (bin.available || (bin.by_os && (bin.by_os.windows || bin.by_os.linux)));
      if (!bin || anyAvail) return "";
      const retry = bin.github_configured
        ? `<button class="k-btn k-btn--ghost k-btn--sm" onclick="retryFetch(this)">retry GitHub fetch</button>` : "";
      return `<div class="k-panel kc-banner">
        <div class="k-row" style="gap:8px">${icon('triangle-alert', 16)}<span style="font-size:13px;font-weight:600">No agent installer available</span></div>
        <div class="kc-banner__msg k-muted">${esc(bin.message)}</div>${retry}

    async function retryFetch(btn) {
      btn.disabled = true; btn.textContent = "fetching…";
      try {
        const r = await getJSON("/api/agent-binary/fetch", { method: "POST" });

    // -- chat (server-hosted Claude; read-only auto-run vs confirm-gate) ---
    let chatSessionId = null;
    let chatContext = null; // selected agent id, or null for fleet-wide
    let chatAbort = null;   // AbortController while a turn streams (drives Stop)

    function chatHtml() {
      return `<div class="k-panel kc-chat kc-copilot">
        <div class="kc-chat__head">
          <span class="k-row kc-chat__title" style="gap:8px">${icon('message-square', 16)}Ask kenny · server-hosted</span>
          <span class="k-row" style="gap:6px">
            <button class="k-btn k-btn--ghost k-btn--sm" onclick="newChat()" title="start a new chat">${icon('plus', 13)}new</button>
            <button class="k-btn k-btn--ghost k-btn--sm" onclick="openHistoryPanel()" title="browse past conversations">${icon('clock', 13)}history</button>
            <span class="kc-ctx" id="chat-ctx">context: fleet</span>
          </span>
        </div>
        <div class="kc-transcript" id="transcript"></div>
        <div class="kc-composer">
          <input class="k-input" id="chat-input" placeholder="Ask kenny to inspect or fix a PC…" autocomplete="off" />
          <button class="k-btn k-btn--primary" id="chat-send" onclick="sendChat()">${icon('send-horizontal', 15)}send</button>
        </div>
        <div class="kc-suggest">
          <button class="kc-chip" onclick="suggest(this)">Why is this PC flagged?</button>
          <button class="kc-chip" onclick="suggest(this)">Free up disk space</button>
          <button class="kc-chip" onclick="suggest(this)">Update all packages</button>
        </div>
      </div>`;
    }
    function mountChat() {
      const input = document.getElementById("chat-input");
      // Plain Enter always sends here, regardless of the "Enter to send"
      // preference — that preference is about the ticket view's multi-line
      // textarea, and this is a single-line <input> with no newline concept
      // of its own. Shift+Enter is still not swallowed, though, matching the
      // ticket composer's own convention (tkComposerKeydown) rather than
      // silently eating a modifier combo the operator may be using for
      // something else (an IME, a browser/extension shortcut, ...).
      if (input) input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) sendChat(); });
      setChatContext(state.selected);
    }
    function suggest(btn) {
      const input = document.getElementById("chat-input");
      if (input) { input.value = btn.textContent; input.focus(); }
    }
    function setChatContext(id) {
      chatContext = id || null;
      const chip = document.getElementById("chat-ctx");
      if (chip) chip.textContent = "context: " + (id || "fleet");
    }
    function setComposerEnabled(on) {
      const input = document.getElementById("chat-input");
      const send = document.getElementById("chat-send");
      if (input) input.disabled = !on;
      if (send) send.disabled = !on;
    }
    // Swap the send button to a Stop button while a turn streams (like the
    // desktop apps). Only touches the button's label/handler — the disabled
    // state is owned by setComposerEnabled (e.g. the confirm-gate lock).
    function setComposerStreaming(on) {
      const send = document.getElementById("chat-send");
      if (!send) return;
      if (on) {
        send.innerHTML = `${icon('square', 15)}stop`;
        send.onclick = stopChat;
        send.disabled = false;
      } else {
        send.innerHTML = `${icon('send-horizontal', 15)}send`;
        send.onclick = sendChat;
      }
    }
    // Stop the in-flight turn: aborting the fetch disconnects the SSE stream;
    // the server cancels its generator and the next turn heals the session.
    function stopChat() {
      if (chatAbort) chatAbort.abort();
    }

    // Minimal, escape-first markdown renderer for assistant chat replies.
    // Hand-rolled instead of a vendored library so the escaping guarantee is
    // easy to audit: every code path HTML-escapes raw text (via esc()) before
    // any tag is layered on, and link hrefs are allow-listed to http(s)/mailto.
    // That matters here specifically because assistant text isn't fully
    // trusted either (ADR-0023) — a compromised agent's tool output can end
    // up quoted back by the model, so nothing in this text should be treated
    // as real HTML. User messages are never run through this; they keep using
    // textContent, unchanged.
    function renderMarkdown(text) {
      text = String(text == null ? "" : text).replace(/\r\n/g, "\n");

      // Pull fenced code blocks out first so no inline rule below ever sees
      // (or reformats) their contents.
      const codeBlocks = [];
      text = text.replace(/```[^\n]*\n([\s\S]*?)```/g, (_, code) => {
        codeBlocks.push(`<pre><code>${esc(code.replace(/\n$/, ""))}</code></pre>`);
        return " B" + (codeBlocks.length - 1) + " ";
      });

      // Inline formatting on one already-escaped line. Each rule stashes its
      // own HTML behind an opaque token before the next rule runs, so e.g. a
      // bold marker inside inline code, or code inside link text, can never
      // be misread by a later rule; restorePass() unwraps every token after.
      function inline(raw) {
        let s = esc(raw);
        const spans = [];
        const stash = html => { spans.push(html); return " C" + (spans.length - 1) + " "; };
        s = s.replace(/`([^`\n]+)`/g, (_, c) => stash(`<code>${c}</code>`));
        s = s.replace(/\*\*([^\n]+?)\*\*|__([^\n]+?)__/g, (_, a, b) => stash(`<strong>${a ?? b}</strong>`));
        s = s.replace(/(?<![\w*])\*([^*\n]+?)\*(?![\w*])/g, (_, a) => stash(`<em>${a}</em>`));
        s = s.replace(/(?<![\w_])_([^_\n]+?)_(?![\w_])/g, (_, a) => stash(`<em>${a}</em>`));
        s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|mailto:[^\s)]+)\)/gi,
          (_, t, u) => stash(`<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`));
        for (let n = 0; n < 3 && / C\d+ /.test(s); n++) {
          s = s.replace(/ C(\d+) /g, (_, i) => spans[+i]);
        }
        return s;
      }

      // Block-level: group lines into headers/lists/blockquotes/paragraphs.
      function blocksOf(src) {
        const lines = src.split("\n");
        let html = "";
        let i = 0;
        while (i < lines.length) {
          const line = lines[i];
          const codeToken = /^B(\d+)$/.exec(line.trim());
          if (codeToken) { html += codeBlocks[+codeToken[1]]; i++; continue; }
          if (/^\s*$/.test(line)) { i++; continue; }

          const heading = /^(#{1,6})\s+(.*)$/.exec(line);
          if (heading) {
            const level = heading[1].length;
            html += `<h${level}>${inline(heading[2])}</h${level}>`;
            i++; continue;
          }

          if (/^>\s?/.test(line)) {
            const quoted = [];
            while (i < lines.length && /^>\s?/.test(lines[i])) { quoted.push(lines[i].replace(/^>\s?/, "")); i++; }
            html += `<blockquote>${blocksOf(quoted.join("\n"))}</blockquote>`;
            continue;
          }

          const ordered = /^\s*\d+[.)]\s+/.test(line);
          const unordered = /^\s*[-*]\s+/.test(line);
          if (ordered || unordered) {
            const itemRe = ordered ? /^\s*\d+[.)]\s+(.*)$/ : /^\s*[-*]\s+(.*)$/;
            const items = [];
            while (i < lines.length && itemRe.test(lines[i])) { items.push(itemRe.exec(lines[i])[1]); i++; }
            const tag = ordered ? "ol" : "ul";
            html += `<${tag}>${items.map(it => `<li>${inline(it)}</li>`).join("")}</${tag}>`;
            continue;
          }

          const para = [];
          while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,6})\s+/.test(lines[i]) &&
                 !/^>\s?/.test(lines[i]) && !/^\s*[-*]\s+/.test(lines[i]) && !/^\s*\d+[.)]\s+/.test(lines[i]) &&
                 !/^B\d+$/.test(lines[i].trim())) {
            para.push(lines[i]); i++;
          }
          html += `<p>${para.map(inline).join("<br>")}</p>`;
        }
        return html;
      }

      return blocksOf(text);
    }

    function bubble(cls, text) {
      const t = document.getElementById("transcript");
      const div = document.createElement("div");
      div.className = "k-bubble k-bubble--" + cls;
      if (cls === "assistant") div.innerHTML = renderMarkdown(text);
      else div.textContent = text;
      t.appendChild(div);
      t.scrollTop = t.scrollHeight;
      return div;
    }
    function toolRun(tool, ok) {
      const t = document.getElementById("transcript");
      const div = document.createElement("div");
      div.className = "k-toolrun" + (ok ? " k-toolrun--auto" : " k-toolrun--err");
      div.innerHTML = `<span class="k-toolrun__tick">${icon(ok ? 'check' : 'octagon-alert', 13)}</span>${esc(tool)}`;
      t.appendChild(div);
      t.scrollTop = t.scrollHeight;
    }
    function chatShot(imageB64, format) {
      const t = document.getElementById("transcript");
      const card = document.createElement("div");
      card.className = "k-card k-card--sunken kc-shotcard";
      const src = `data:image/${format};base64,${imageB64}`;
      const img = document.createElement("img");
      img.className = "kc-shot";
      img.src = src;
      img.onclick = () => openModal(`${icon('camera', 18)}<span>Screenshot</span>`,
        `<img class="kc-shot" src="${src}">`, "k-modal--media");
      card.appendChild(img);
      t.appendChild(card);
      t.scrollTop = t.scrollHeight;
    }
    // Per-stream state for handleChatEvent. ctx.bubble() lazily creates the
    // single assistant bubble the first time a text token arrives, so empty
    // turns (tool-only or a confirm-gate) don't leave a blank bubble behind.
    function newChatCtx() {
      return { _div: null, _raw: "", bubble() { return (this._div ||= bubble("assistant", "")); }, brokeSinceText: false };
    }
    // Apply one streamed chat event. ctx.brokeSinceText tracks whether a tool
    // ran since the last text token, so a new text segment is separated from
    // the prior one with a blank line instead of running straight into it
    // ("...check.Good, we have...").
    function handleChatEvent(ev, ctx) {
      const t = document.getElementById("transcript");
      if (ev.type === "user_text") {
        // Only emitted during history replay (a live turn draws its own user
        // bubble immediately in startChatTurn). Starts a fresh assistant
        // bubble for whatever follows, so replayed turns don't run together.
        bubble("user", ev.text);
        ctx._div = null;
        ctx._raw = "";
        ctx.brokeSinceText = false;
      } else if (ev.type === "text_delta") {
        const div = ctx.bubble();
        if (ctx.brokeSinceText && ctx._raw) ctx._raw += "\n\n";
        ctx.brokeSinceText = false;
        ctx._raw += ev.text;
        // Re-render the whole buffered reply each token rather than appending
        // HTML incrementally — a delta can land mid-token (e.g. split a
        // "**bold" marker), which incremental innerHTML append can't recover
        // from. The buffer is short enough per turn for this to be cheap.
        div.innerHTML = renderMarkdown(ctx._raw);
        t.scrollTop = t.scrollHeight;
      } else if (ev.type === "tool_result") {
        ctx.brokeSinceText = true;
        toolRun(ev.tool, ev.ok !== false);
        if (ev.image_b64) chatShot(ev.image_b64, ev.format || "png");
      } else if (ev.type === "denied") {
        ctx.brokeSinceText = true;
        toolRun("denied " + ev.tool, false);
      } else if (ev.type === "pending") {
        renderPending(ev);
      } else if (ev.type === "done") {
        if (ev.session_id) chatSessionId = ev.session_id;
      } else if (ev.type === "error") {
        if (ev.session_id) chatSessionId = ev.session_id;
        toolRun("error: " + ev.error, false);
      }
    }
    function gateCall(tool, args) {
      const entries = Object.entries(args || {});
      if (!entries.length) return `<span class="tok-tool">${esc(tool)}</span> {}`;
      const lines = entries.map(([k, v], i) =>
        `  <span class="tok-key">${esc(k)}</span>: ${esc(JSON.stringify(v))}${i < entries.length - 1 ? "," : ""}`
      ).join("\n");
      return `<span class="tok-tool">${esc(tool)}</span> {\n${lines}\n}`;
    }
    function renderPending(p) {
      const t = document.getElementById("transcript");
      const div = document.createElement("div");
      div.className = "k-gate";
      div.innerHTML = `
        <div class="k-gate__head">${icon('shield-alert', 15)}<span class="k-gate__title">confirm-gate · awaiting operator</span></div>
        <div class="k-gate__body">
          <div class="k-gate__desc">This will <b>change state</b> on <b>${esc(p.agent_id || "the active PC")}</b>. Review before it runs.</div>
          <div class="k-gate__call">${gateCall(p.tool, p.args)}</div>
        </div>
        <div class="k-gate__foot">
          <button class="k-btn k-btn--primary" onclick="confirmChat(true, this)">${icon('check', 15)}confirm &amp; run</button>
          <button class="k-btn k-btn--ghost" onclick="confirmChat(false, this)">cancel</button>
        </div>`;
      t.appendChild(div);
      t.scrollTop = t.scrollHeight;
      setComposerEnabled(false); // lock the composer until the gate is resolved
      openGateModal(p);
    }

    // The card above stays as the anchor — it marks where in the conversation
    // the gate happened and survives the decision as history — but the rail is
    // ~380px and a PowerShell script is unreadable in it. The decision itself
    // moves to a dialog wide enough to actually read the call, which is what
    // the assistant's own instructions already promise the operator.
    //
    // Shared with the ticket view's own gate (see openTicketGateModal in the
    // ticket-detail section): just the tool+args body, reusing gateCall()
    // verbatim. `tool_class` is accepted for shape-parity with the pending
    // event/approval row callers pass around, even though this body doesn't
    // render it (same as before this was split out).
    function gateModalHtml({ tool, args, agent_id, tool_class }) {
      return `<div class="k-gate__desc" style="margin-bottom:12px">This will <b>change state</b> on
           <b>${esc(agent_id || "the active PC")}</b>. Review the exact call below.</div>
         <div class="k-gate__call">${gateCall(tool, args)}</div>`;
    }
    // The gate modal's decision callback for whichever dialog is currently
    // open. A module-level slot rather than a closure baked into the button's
    // onclick markup, because an inline HTML attribute can only call a named
    // function — mirrors how modalOnClose already works for openModal/closeModal.
    let gateModalOnDecide = null;
    function gateModalDecide(approve, btn) {
      if (btn) btn.disabled = true;
      const cb = gateModalOnDecide;
      gateModalOnDecide = null;
      closeModal();
      if (cb) cb(approve);
    }
    // opts.onDecide(approve) lets a second surface (the ticket view) reuse this
    // exact dialog with its own decision path; opts.dismissible lets it opt
    // into being closable without deciding (see the "Decide later" button
    // below). With no opts this is the fleet rail's original behavior:
    // non-dismissible, decides via confirmChat.
    function openGateModal(p, opts) {
      const o = opts || {};
      gateModalOnDecide = o.onDecide || (approve => confirmChat(approve, null));
      // The fleet rail's gate is non-dismissible on purpose: that session's
      // composer is locked and nothing else can proceed until this dialog is
      // answered, so there is no "close without deciding" to offer. A ticket's
      // gate legitimately waits hours and may be decided by a different
      // operator than the one looking at it now, so its caller opts into
      // `dismissible: true` and gets a "Decide later" button that only closes
      // the dialog instead of a cancel that would deny the call.
      const dismissible = o.dismissible === true;
      const secondaryBtn = dismissible
        ? `<button class="k-btn k-btn--ghost" onclick="closeModal()">Decide later</button>`
        : `<button class="k-btn k-btn--ghost" onclick="gateModalDecide(false, this)">cancel</button>`;
      openModal(
        `${icon('shield-alert', 20)}<span>Confirm before this runs</span>`,
        `${gateModalHtml(p)}
         <div class="k-row" style="gap:8px;justify-content:flex-end;margin-top:16px">
           ${secondaryBtn}
           <button class="k-btn k-btn--primary" onclick="gateModalDecide(true, this)">${icon('check', 15)}confirm &amp; run</button>
         </div>`,
        "k-modal--wide", null, { dismissible });
    }
    async function sendChat() {
      if (chatAbort) return; // a turn is already streaming (Enter while busy)
      const input = document.getElementById("chat-input");
      const message = (input.value || "").trim();
      if (!message) return;
      input.value = "";
      startChatTurn(message);
    }
    // Drive one chat turn for a given message — from the composer or an injected
    // Auto-Remediate prompt. Streams under an AbortController so Stop can cut it.
    async function startChatTurn(message) {
      if (chatAbort) return; // never overlap turns
      bubble("user", message);
      // Always send agent_id (possibly "") so the session mirrors the current
      // dashboard selection exactly, including switching back to fleet-wide —
      // omitting the key entirely would leave the server-side session pointing
      // at whatever agent was last selected.
      const body = { session_id: chatSessionId, message, agent_id: chatContext || "" };
      const ctx = newChatCtx();
      chatAbort = new AbortController();
      setComposerStreaming(true);
      try {
        for await (const ev of streamSSE("/api/chat/stream", body, { signal: chatAbort.signal })) {
          handleChatEvent(ev, ctx);
        }
      } catch (e) {
        if (e.name !== "AbortError") toolRun("error: " + e.message, false);
      } finally {
        chatAbort = null;
        setComposerStreaming(false);
      }
    }
    async function confirmChat(approve, btn) {
      // Either entry point may call this: the inline card's own buttons, or the
      // dialog's, which has no card ancestor. At most one gate is ever open —
      // the composer stays locked until it resolves — so falling back to the
      // one in the transcript is unambiguous.
      const card = (btn && btn.closest) ? btn.closest(".k-gate") : null;
      const open = card || document.querySelector("#transcript .k-gate");
      if (open) open.remove();
      setComposerEnabled(true);
      const ctx = newChatCtx();
      chatAbort = new AbortController();
      setComposerStreaming(true);
      try {
        for await (const ev of streamSSE("/api/chat/confirm/stream", { session_id: chatSessionId, approve }, { signal: chatAbort.signal })) {
          handleChatEvent(ev, ctx);
        }
      } catch (e) {
        if (e.name !== "AbortError") toolRun("error: " + e.message, false);
      } finally {
        chatAbort = null;
        setComposerStreaming(false);
      }
    }

    // -- chat history: browse / resume / delete past conversations ---------
    function newChat() {
      if (chatAbort) return; // don't swap out from under a streaming turn
      chatSessionId = null;
      const t = document.getElementById("transcript");
      if (t) t.innerHTML = "";
      setChatContext(state.selected);
      setComposerEnabled(true);
    }
    async function openHistoryPanel() {
      if (chatAbort) return;
      let r;
      try { r = await getJSON("/api/chat/history"); }
      catch (e) { notify("could not load history: " + e.message, "err"); return; }
      openModal(`${icon('clock', 18)}<span>Chat history</span>`, historyListHtml(r.conversations || []));
    }
    function historyListHtml(rows) {
      if (!rows.length) return `<div class="k-muted">No saved conversations yet.</div>`;
      return `<div class="kc-history-list">` + rows.map(row => `
        <div class="kc-history-row" onclick="loadConversation(${jsArg(row.id)})">
          <div class="kc-history-row__main">
            <div class="kc-history-row__title">${esc(row.title)}</div>
            <div class="kc-history-row__meta">${esc(new Date(row.updated_at).toLocaleString())}${row.agent_id ? " · " + esc(row.agent_id) : ""}</div>
          </div>
          <button class="k-btn k-btn--ghost k-btn--sm" onclick="deleteConversation(${jsArg(row.id)}, event)" title="delete this conversation">${icon('x', 13)}</button>
        </div>`).join("") + `</div>`;
    }
    async function loadConversation(id) {
      if (chatAbort) return; // never swap the transcript mid-stream
      let r;
      try { r = await getJSON(`/api/chat/history/${id}`); }
      catch (e) { notify("could not load conversation: " + e.message, "err"); return; }
      closeModal();
      chatSessionId = r.id;
      const t = document.getElementById("transcript");
      if (t) t.innerHTML = "";
      setChatContext(r.agent_id || null);
      const ctx = newChatCtx();
      for (const ev of r.transcript) handleChatEvent(ev, ctx);
      // A persisted transcript never carries a pending confirm-gate (it's
      // process-local and never saved), so the composer stays enabled.
    }
    async function deleteConversation(id, evt) {
      if (evt) evt.stopPropagation(); // don't also trigger the row's loadConversation
      try { await fetch(`/api/chat/history/${id}`, { method: "DELETE" }); }
      catch (e) { notify("could not delete conversation: " + e.message, "err"); return; }
      if (id === chatSessionId) newChat();
      openHistoryPanel(); // refresh the list in place
    }

    // -- global audit log: searchable + paged ------------------------------
    function auditPanelHtml() {
      return `<div class="k-panel">
        <div class="kc-section-lbl" style="margin-bottom:10px">tool-call audit log</div>
        <div class="k-audit__bar">
          <span class="k-audit__search">${icon('search', 15)}
            <input class="k-input" id="audit-search" list="audit-suggest" placeholder="search by time, PC, or tool…"
              autocomplete="off" oninput="onAuditSearch(this.value)" value="${esc(state.auditQuery)}" />
            <datalist id="audit-suggest"></datalist>
          </span>
          <span class="k-audit__count" id="audit-count"></span>
        </div>
        <div class="k-audit" id="audit-rows"></div>
        <div class="k-audit__pager" id="audit-pager"></div>
      </div>`;
    }
    function auditTime(e) { return (e.at || "").slice(11, 19); }
    function filterAudit() {
      const q = state.auditQuery.trim().toLowerCase();
      if (!q) return state.audit;
      return state.audit.filter(e =>
        String(e.tool || "").toLowerCase().includes(q) ||
        String(e.agent_id || "").toLowerCase().includes(q) ||
        auditTime(e).toLowerCase().includes(q));
    }
    function onAuditSearch(v) { state.auditQuery = v; state.auditPage = 1; renderAudit(); }
    function auditGo(delta) { state.auditPage += delta; renderAudit(); }
    function auditRow(e) {
      const res = e.ok
        ? `<span class="k-audit__res k-audit__res--ok">ok</span>`
        : `<span class="k-audit__res k-audit__res--err">err</span>`;
      const sc = e.state_changing;
      return `<div class="k-audit__row">
        <span class="k-audit__time">${esc(auditTime(e))}</span>
        ${res}
        <span class="k-audit__tool">${esc(e.tool)}</span>
        <span class="k-audit__kind k-audit__kind--${sc ? "sc" : "ro"}">${sc ? "state-changing" : "read-only"}</span>
        <span class="k-audit__agent">${esc(e.agent_id)}</span>
      </div>`;
    }
    function renderAudit() {
      const rowsEl = document.getElementById("audit-rows");
      if (!rowsEl) return;
      // autocomplete suggestions: distinct tools, PCs, and HH:MM times (built once)
      const dl = document.getElementById("audit-suggest");
      if (dl && !dl.children.length && state.audit.length) {
        const set = new Set();
        state.audit.forEach(e => {
          if (e.tool) set.add(e.tool);
          if (e.agent_id) set.add(e.agent_id);
          const hm = auditTime(e).slice(0, 5);
          if (hm) set.add(hm);
        });
        dl.innerHTML = [...set].map(v => `<option value="${esc(v)}"></option>`).join("");
      }
      const all = filterAudit();
      const total = all.length;
      const pages = Math.max(1, Math.ceil(total / AUDIT_PAGE_SIZE));
      state.auditPage = Math.min(Math.max(1, state.auditPage), pages);
      const start = (state.auditPage - 1) * AUDIT_PAGE_SIZE;
      const slice = all.slice(start, start + AUDIT_PAGE_SIZE);
      rowsEl.innerHTML = slice.map(auditRow).join("")
        || `<div class="k-muted" style="font-size:var(--text-sm);padding:8px 4px">${state.audit.length ? "no matching calls" : "no calls yet"}</div>`;
      const countEl = document.getElementById("audit-count");
      if (countEl) countEl.textContent = total
        ? `${total} call${total === 1 ? "" : "s"} · showing ${start + 1}–${start + slice.length}`
        : "0 calls";
      const pager = document.getElementById("audit-pager");
      if (pager) pager.innerHTML = pages > 1
        ? `<button class="k-btn k-btn--quiet k-btn--sm" onclick="auditGo(-1)" ${state.auditPage <= 1 ? "disabled" : ""}>${icon('chevron-left', 13)}prev</button>
           <span>page ${state.auditPage} / ${pages}</span>
           <button class="k-btn k-btn--quiet k-btn--sm" onclick="auditGo(1)" ${state.auditPage >= pages ? "disabled" : ""}>next${icon('chevron-right', 13)}</button>`
        : "";
    }

    // -- fleet-wide events / logs: searchable + paged ----------------------
    function eventsPanelHtml() {
      return `<div class="k-panel">
        <div class="kc-section-lbl" style="margin-bottom:10px">events &amp; logs</div>
        <div class="k-audit__bar">
          <span class="k-audit__search">${icon('search', 15)}
            <input class="k-input" id="events-search" placeholder="search by level, source, PC, or message…"
              autocomplete="off" oninput="onEventsSearch(this.value)" value="${esc(state.eventsQuery)}" />
          </span>
          <span class="k-audit__count" id="events-count"></span>
        </div>
        <div class="k-audit" id="events-rows"></div>
        <div class="k-audit__pager" id="events-pager"></div>
      </div>`;
    }
    function eventsTime(e) { return (e.at || "").slice(11, 19); }
    function filterEvents() {
      const q = state.eventsQuery.trim().toLowerCase();
      if (!q) return state.events;
      return state.events.filter(e =>
        String(e.level || "").toLowerCase().includes(q) ||
        String(e.source || "").toLowerCase().includes(q) ||
        String(e.agent_id || "").toLowerCase().includes(q) ||
        String(e.target || "").toLowerCase().includes(q) ||
        String(e.message || e.tool || "").toLowerCase().includes(q) ||
        eventsTime(e).toLowerCase().includes(q));
    }
    function onEventsSearch(v) { state.eventsQuery = v; state.eventsPage = 1; renderEvents(); }
    function eventsGo(delta) { state.eventsPage += delta; renderEvents(); }
    function eventRow(e) {
      // Audit rows carry no level/message; synthesize a readable line from the call.
      const lvl = e.level || (e.ok === false ? "error" : "info");
      const who = e.agent_id || "";
      let body;
      if (e.kind === "audit") {
        body = `<span class="k-events__target">${esc(e.tool || "")}</span>${e.ok === false ? "failed: " + esc(e.error || "") : "ok"}`;
      } else {
        body = `${e.target ? `<span class="k-events__target">${esc(e.target)}</span>` : ""}${esc(e.message || "")}`;
      }
      return `<div class="k-events__row">
        <span class="k-audit__time">${esc(eventsTime(e))}</span>
        <span class="k-events__lvl k-events__lvl--${esc(lvl)}">${esc(lvl)}</span>
        <span class="k-events__src">${esc(e.source || "")}</span>
        <span class="k-events__who">${esc(who)}</span>
        <span class="k-events__msg">${body}</span>
      </div>`;
    }
    function renderEvents() {
      const rowsEl = document.getElementById("events-rows");
      if (!rowsEl) return;
      const all = filterEvents();
      const total = all.length;
      const pages = Math.max(1, Math.ceil(total / EVENTS_PAGE_SIZE));
      state.eventsPage = Math.min(Math.max(1, state.eventsPage), pages);
      const start = (state.eventsPage - 1) * EVENTS_PAGE_SIZE;
      const slice = all.slice(start, start + EVENTS_PAGE_SIZE);
      rowsEl.innerHTML = slice.map(eventRow).join("")
        || `<div class="k-muted" style="font-size:var(--text-sm);padding:8px 4px">${state.events.length ? "no matching events" : "no events yet"}</div>`;
      const countEl = document.getElementById("events-count");
      if (countEl) countEl.textContent = total
        ? `${total} event${total === 1 ? "" : "s"} · showing ${start + 1}–${start + slice.length}`
        : "0 events";
      const pager = document.getElementById("events-pager");
      if (pager) pager.innerHTML = pages > 1
        ? `<button class="k-btn k-btn--quiet k-btn--sm" onclick="eventsGo(-1)" ${state.eventsPage <= 1 ? "disabled" : ""}>${icon('chevron-left', 13)}prev</button>
           <span>page ${state.eventsPage} / ${pages}</span>
           <button class="k-btn k-btn--quiet k-btn--sm" onclick="eventsGo(1)" ${state.eventsPage >= pages ? "disabled" : ""}>next${icon('chevron-right', 13)}</button>`
        : "";
    }

    window.addEventListener("hashchange", () => {
      router().catch(e => app.textContent = "error: " + e.message);
    });
    // Normalize a bare URL to the default tab (replaceState does not fire
    // hashchange, so router() runs exactly once below). Load the current user
    // first so role gating and the identity control are correct on first paint.
    if (!location.hash) history.replaceState(null, "", "#/overview");
    loadMe().then(() => router()).catch(e => app.textContent = "error: " + e.message);
    // Prime the docs link's target from the configured repo (non-blocking; the
    // default is already correct for the stock deployment).
    getJSON("/api/about").then(a => { if (a && a.repo) serverRepo = a.repo; }).catch(() => {});
  </script>
</body>
</html>
