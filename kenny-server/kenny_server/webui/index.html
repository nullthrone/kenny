<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>kenny fleet</title>
  <style>
    :root {
      --ok: #2e9e44; --warn: #d99100; --crit: #c0392b; --unknown: #888;
      --bg: #0f1419; --panel: #1b2330; --fg: #e6edf3; --muted: #8b98a5;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    header { padding: 14px 20px; border-bottom: 1px solid #2a3441; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 18px; margin: 0; }
    header .crumb { color: var(--muted); cursor: pointer; }
    main { padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
    .tile { background: var(--panel); border-radius: 10px; padding: 14px; cursor: pointer; border: 1px solid #2a3441; }
    .tile:hover { border-color: #3d4d5e; }
    .tile h3 { margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .ok { background: var(--ok); } .warn { background: var(--warn); }
    .crit { background: var(--crit); } .unknown { background: var(--unknown); }
    .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; color: #fff; }
    .pill.ok { background: var(--ok); } .pill.warn { background: var(--warn); }
    .pill.crit { background: var(--crit); } .pill.unknown { background: var(--unknown); }
    .muted { color: var(--muted); font-size: 12px; }
    .flags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .flags .tag { background: #2a3441; padding: 1px 8px; border-radius: 6px; font-size: 12px; }
    .section { background: var(--panel); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; border: 1px solid #2a3441; }
    .section h4 { margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
    pre { background: #0b0f14; padding: 10px; border-radius: 8px; overflow: auto; max-height: 240px; font-size: 12px; }
    button { background: #2563eb; color: #fff; border: 0; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }
    button:hover { background: #1d4ed8; }
    .row { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
    .col { flex: 1; min-width: 320px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    td, th { text-align: left; padding: 4px 6px; border-bottom: 1px solid #2a3441; }
    .trend { display: flex; gap: 3px; align-items: flex-end; height: 40px; }
    .trend span { width: 10px; border-radius: 2px; }
    .tabs { margin-left: auto; display: flex; gap: 6px; }
    .tab { padding: 5px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); border: 1px solid transparent; }
    .tab.active { color: var(--fg); background: var(--panel); border-color: #2a3441; }
    .chat { display: flex; flex-direction: column; height: calc(100vh - 130px); }
    .transcript { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 10px; }
    .msg { max-width: 80%; padding: 9px 12px; border-radius: 10px; white-space: pre-wrap; }
    .msg.user { align-self: flex-end; background: #2563eb; color: #fff; }
    .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid #2a3441; }
    .msg.tool { align-self: flex-start; background: #11202e; border: 1px solid #2a3441; color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; }
    .confirm { align-self: flex-start; background: #2a1f12; border: 1px solid #d99100; border-radius: 10px; padding: 12px; }
    .confirm .acts { margin-top: 8px; display: flex; gap: 8px; }
    .confirm button.deny { background: #5b2630; }
    .composer { display: flex; gap: 8px; margin-top: 10px; }
    .composer input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #2a3441; background: #0b0f14; color: var(--fg); font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>kenny</h1>
    <span class="crumb" id="crumb" onclick="showFleet()">fleet</span>
    <div class="tabs">
      <span class="tab active" id="tab-fleet" onclick="selectTab('fleet')">fleet</span>
      <span class="tab" id="tab-chat" onclick="selectTab('chat')">chat</span>
    </div>
  </header>
  <main id="app">loading…</main>

  <script>
    const app = document.getElementById("app");
    const crumb = document.getElementById("crumb");

    async function getJSON(url, opts) {
      const r = await fetch(url, opts);
      if (r.status === 401) { location = "/login"; throw new Error("unauthorized"); }
      if (!r.ok) throw new Error(url + " -> " + r.status);
      return r.json();
    }
    const sev = s => ["ok", "warn", "crit"].includes(s) ? s : "unknown";

    async function showFleet() {
      crumb.textContent = "fleet";
      crumb.onclick = showFleet;
      const data = await getJSON("/api/fleet");
      const tiles = (data.agents || []).map(a => `
        <div class="tile" onclick="showAgent('${a.agent_id}')">
          <h3><span class="dot ${sev(a.overall)}"></span>${a.agent_id}</h3>
          <div class="muted">${a.online ? "online" : "offline"} · ${a.meta.hostname || ""}</div>
          <div class="flags">
            ${(a.flagged_sections || []).map(f => `<span class="tag">${f}</span>`).join("") || '<span class="muted">no flags</span>'}
          </div>
          <div class="muted" style="margin-top:6px">${a.collected_at || "no telemetry"}</div>
        </div>`).join("");
      app.innerHTML = `<div class="muted" style="margin-bottom:10px">fleet health:
        <span class="pill ${sev(data.overall)}">${data.overall}</span></div>
        <div class="grid">${tiles || '<div class="muted">no agents</div>'}</div>`;
    }

    async function showAgent(id) {
      crumb.innerHTML = `<span onclick="showFleet()">fleet</span> / ${id}`;
      const data = await getJSON("/api/agent/" + encodeURIComponent(id));
      const h = data.health || { overall: "unknown", sections: {} };
      const sections = Object.entries(h.sections || {}).map(([name, s]) => `
        <div class="section">
          <h4><span class="dot ${sev(s.status)}"></span>${name}
            <span class="pill ${sev(s.status)}">${s.status}</span></h4>
          <div>${(data.snapshot && data.snapshot[name] && data.snapshot[name].summary) || ""}</div>
          ${s.reason ? `<div class="muted">rule: ${s.reason}</div>` : ""}
          <pre>${JSON.stringify((data.snapshot || {})[name] || {}, null, 2)}</pre>
        </div>`).join("");

      const hist = (data.history || []).slice().reverse();
      const trend = hist.map(p => {
        const ov = sev(p.overall);
        const col = getComputedStyle(document.documentElement).getPropertyValue("--" + ov);
        const ht = ov === "crit" ? 40 : ov === "warn" ? 26 : ov === "unknown" ? 8 : 14;
        return `<span title="${p.collected_at}: ${p.overall}" style="height:${ht}px;background:${col.trim()}"></span>`;
      }).join("");

      const log = (data.call_log || []).map(c => `
        <tr><td>${c.at}</td><td>${c.tool}</td><td>${c.ok ? "ok" : "ERR: " + (c.error || "")}</td></tr>`).join("");

      app.innerHTML = `
        <div class="row" style="margin-bottom:14px">
          <div><h2 style="margin:0">${id}
            <span class="pill ${sev(h.overall)}">${h.overall}</span></h2>
            <div class="muted">${data.online ? "online" : "offline"} ·
              ${(data.meta || {}).hostname || ""} · ${data.collected_at || "no telemetry"}</div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button onclick="refreshNow('${id}')">refresh now</button>
            <button onclick="downloadInstaller('${id}')">download installer</button>
            <button onclick="shareInstaller('${id}')">share link</button>
            <button onclick="updateAgent('${id}')">update agent</button>
          </div>
        </div>
        <div class="row">
          <div class="col">
            <h3>sections</h3>
            ${sections || '<div class="muted">no telemetry yet</div>'}
          </div>
          <div class="col">
            <h3>health trend</h3>
            <div class="trend">${trend || '<span class="muted">no history</span>'}</div>
            <h3 style="margin-top:18px">tool-call log</h3>
            <table><thead><tr><th>at</th><th>tool</th><th>result</th></tr></thead>
              <tbody>${log || '<tr><td colspan=3 class="muted">no calls</td></tr>'}</tbody></table>
          </div>
        </div>`;
    }

    async function refreshNow(id) {
      try {
        await getJSON("/api/agent/" + encodeURIComponent(id) + "/refresh", { method: "POST" });
      } catch (e) { alert("refresh failed: " + e.message); }
      showAgent(id);
    }

    // -- agent distribution (installer download / share link / update) ----
    function downloadInstaller(id) {
      // operator cookie authorizes this GET; the browser downloads the ZIP.
      window.location = "/api/agents/" + encodeURIComponent(id) + "/installer";
    }
    async function shareInstaller(id) {
      try {
        const r = await getJSON("/api/agents/" + encodeURIComponent(id) + "/share-link", { method: "POST" });
        prompt("One-time installer link (expires in " + r.expires_in + "s):", r.url);
      } catch (e) { alert("share failed: " + e.message); }
    }
    async function updateAgent(id) {
      if (!confirm("Push a self-update to '" + id + "' now?")) return;
      try {
        const r = await getJSON("/api/agents/" + encodeURIComponent(id) + "/update", { method: "POST" });
        alert("update triggered: v" + r.version);
      } catch (e) { alert("update failed: " + e.message); }
    }

    // -- tabs -----------------------------------------------------------
    function selectTab(name) {
      document.getElementById("tab-fleet").classList.toggle("active", name === "fleet");
      document.getElementById("tab-chat").classList.toggle("active", name === "chat");
      crumb.style.display = name === "fleet" ? "" : "none";
      if (name === "fleet") showFleet();
      else showChat();
    }

    // -- chat -----------------------------------------------------------
    let chatSessionId = null;

    function showChat() {
      app.innerHTML = `
        <div class="chat">
          <div class="transcript" id="transcript"></div>
          <div class="composer">
            <input id="chat-input" placeholder="Ask kenny to inspect or fix an agent…" autofocus />
            <button id="chat-send" onclick="sendChat()">send</button>
          </div>
        </div>`;
      const input = document.getElementById("chat-input");
      input.addEventListener("keydown", e => { if (e.key === "Enter") sendChat(); });
      input.focus();
    }

    function bubble(cls, text) {
      const t = document.getElementById("transcript");
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      t.appendChild(div);
      t.scrollTop = t.scrollHeight;
      return div;
    }

    function renderTurn(result) {
      (result.tool_events || []).forEach(ev => {
        if (ev.type === "tool_result")
          bubble("tool", (ev.ok ? "✓ " : "✗ ") + ev.tool);
        else if (ev.type === "denied")
          bubble("tool", "✗ denied " + ev.tool);
      });
      if (result.assistant_text) bubble("assistant", result.assistant_text);
      if (result.pending) renderPending(result.pending);
    }

    function renderPending(p) {
      const t = document.getElementById("transcript");
      const div = document.createElement("div");
      div.className = "confirm";
      div.innerHTML = `
        <div><strong>Confirm action</strong></div>
        <div class="muted">${p.tool} on ${p.agent_id || "(no agent)"}</div>
        <pre>${JSON.stringify(p.args, null, 2)}</pre>
        <div class="acts">
          <button onclick="confirmChat(true, this)">approve</button>
          <button class="deny" onclick="confirmChat(false, this)">deny</button>
        </div>`;
      t.appendChild(div);
      t.scrollTop = t.scrollHeight;
    }

    async function sendChat() {
      const input = document.getElementById("chat-input");
      const message = input.value.trim();
      if (!message) return;
      input.value = "";
      bubble("user", message);
      try {
        const result = await getJSON("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: chatSessionId, message }),
        });
        chatSessionId = result.session_id;
        renderTurn(result);
      } catch (e) { bubble("tool", "error: " + e.message); }
    }

    async function confirmChat(approve, btn) {
      btn.closest(".confirm").remove();
      try {
        const result = await getJSON("/api/chat/confirm", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: chatSessionId, approve }),
        });
        renderTurn(result);
      } catch (e) { bubble("tool", "error: " + e.message); }
    }

    showFleet().catch(e => app.textContent = "error: " + e.message);
  </script>
</body>
</html>
