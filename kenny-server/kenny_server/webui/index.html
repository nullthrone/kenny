        avatars = ((await api("/api/avatars").catch(() => ({ avatars: [] }))) || {}).avatars || [];
        pats = ((await api("/api/me/pats").catch(() => ({ pats: [] }))) || {}).pats || [];
      }
      const b = modalBody(); if (b) b.innerHTML = profileBodyHtml(me, avatars, pats);
    }
    function profileBodyHtml(me, avatars, pats) {
      const head = `<div class="kacc-head">
        ${avatarHtml(me, "kc-avatar--lg")}
        <div><div class="kacc-head__name">${esc(me.username || "account")}</div>
          <div class="k-row" style="gap:8px;margin-top:4px">${rolePill(me.role || "user")}
            ${me.email ? `<span class="k-muted">${esc(me.email)}</span>` : ""}</div></div>
      </div>`;
      if (me.is_shared_token) {
        return head + `<div class="kacc-sec"><div class="k-muted">You are signed in with a legacy shared
          token, which has no editable account. Create a per-user account to manage a profile,
          two-factor, and personal access tokens.</div></div>`;
      }
      const profileSec = `<div class="kacc-sec">
        <div class="kacc-sec__lbl">Profile</div>
        <div class="kfield"><span class="kfield__lbl">Email</span>
          <input class="k-input" id="prof-email" type="email" autocomplete="off" value="${esc(me.email || "")}" placeholder="name@example.com"></div>
        <div class="kfield"><span class="kfield__lbl">Avatar</span>
          ${avatarPickerHtml("prof-av", avatars, me.avatar || null)}</div>
        <button class="k-btn k-btn--primary" onclick="profileSaveProfile()">${icon('check', 14)}Save profile</button>
      </div>`;
      const pwSec = `<div class="kacc-sec">
        <div class="kacc-sec__lbl">Password</div>
        <div class="kfield"><span class="kfield__lbl">Current password</span>
          <input class="k-input" id="prof-cur" type="password" autocomplete="current-password"></div>
        <div class="kfield"><span class="kfield__lbl">New password</span>
          <input class="k-input" id="prof-new" type="password" autocomplete="new-password"></div>
        <button class="k-btn k-btn--ghost" onclick="profileChangePassword()">${icon('key', 14)}Change password</button>
      </div>`;
      const totpSec = `<div class="kacc-sec">
        <div class="kacc-sec__lbl">Two-factor authentication</div>
        ${profileTotpHtml(me)}
      </div>`;
      const patSec = `<div class="kacc-sec">
        <div class="kacc-sec__lbl">Personal access tokens</div>
        ${patsTableHtml(pats, "profileRevokePat")}
        <div class="kfield__row" style="margin-top:10px">
          <input class="k-input" id="prof-pat-label" placeholder="label (optional), e.g. laptop-cli" autocomplete="off">
          <button class="k-btn k-btn--primary" onclick="profileCreatePat()">${icon('plus', 14)}New token</button>
        </div>
      </div>`;
      return head + profileSec + pwSec + totpSec + patSec;
    }
    function profileTotpHtml(me) {
      if (pendingTotp) {
        return `<div class="k-muted">Scan or paste this secret into your authenticator app, then enter the 6-digit code to finish.</div>
          <div class="kacc-totp">
            <div><span class="k-muted">secret</span> <span class="k-mono">${esc(pendingTotp.secret)}</span></div>
            <div><span class="k-muted">uri</span> <span class="k-mono">${esc(pendingTotp.uri)}</span></div>
          </div>
          <div class="kfield__row">
            <input class="k-input" id="prof-totp-code" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" style="max-width:140px">
            <button class="k-btn k-btn--primary" onclick="profileVerifyTotp()">${icon('check', 14)}Verify &amp; enable</button>
            <button class="k-btn k-btn--quiet" onclick="profileCancelTotp()">Cancel</button>
          </div>`;
      }
      if (me.totp_enabled) {
        return `<div class="k-row" style="gap:8px;margin-bottom:8px">${icon('shield-check', 16)}<span>Two-factor is <b>on</b>.</span></div>
          <div class="kfield__row">
            <input class="k-input" id="prof-totp-pw" type="password" autocomplete="current-password" placeholder="confirm with your password" style="max-width:260px">
            <button class="k-btn k-btn--danger" onclick="profileDisableTotp()">Disable</button>
          </div>`;
      }
      return `<div class="k-muted" style="margin-bottom:8px">Add a time-based one-time code from an authenticator app.</div>
        <button class="k-btn k-btn--primary" onclick="profileEnableTotp()">${icon('shield-check', 14)}Enable two-factor</button>`;
    }
    function patsTableHtml(pats, revokeFn) {
      const rows = (pats || []).filter(p => !p.revoked);
      if (!rows.length) return `<div class="kacc-empty">no active tokens</div>`;
      return `<table class="kacc-tbl"><thead><tr>
          <th>Label</th><th>Created</th><th>Last used</th><th></th></tr></thead><tbody>` +
        rows.map(p => `<tr>
          <td>${esc(p.label || "—")}</td>
          <td class="k-muted">${p.created_at ? esc(fmtValue("at", p.created_at)) : "—"}</td>
          <td class="k-muted">${p.last_used ? esc(fmtValue("at", p.last_used)) : "never"}</td>
          <td class="kacc-tbl__actions"><button class="k-btn k-btn--danger k-btn--sm" onclick="${revokeFn}(${jsArg(p.id)})">${icon('trash-2', 13)}revoke</button></td>
        </tr>`).join("") + `</tbody></table>`;
    }
    async function profileSaveProfile() {
      const email = document.getElementById("prof-email").value.trim();
      const avatar = avatarPick["prof-av"] || null;
      try { await api("/api/me", "PATCH", { email, avatar }); notify("profile saved"); await refreshProfileModal(); }
      catch (e) { notify(e.message, "err"); }
    }
    async function profileChangePassword() {
      const current_password = document.getElementById("prof-cur").value;
      const new_password = document.getElementById("prof-new").value;
      if (!new_password) { notify("enter a new password", "err"); return; }
      try { await api("/api/me/password", "POST", { current_password, new_password }); notify("password changed"); await refreshProfileModal(); }
      catch (e) { notify(e.message, "err"); }
    }
    async function profileEnableTotp() {
      try { pendingTotp = await api("/api/me/totp", "POST"); await refreshProfileModal(); }
      catch (e) { notify(e.message, "err"); }
    }
    async function profileVerifyTotp() {
      const code = document.getElementById("prof-totp-code").value.trim();
      try {
        await api("/api/me/totp", "PUT", { secret: pendingTotp.secret, code });
        pendingTotp = null; notify("two-factor enabled"); await refreshProfileModal();
      } catch (e) { notify(e.message, "err"); }
    }
    function profileCancelTotp() { pendingTotp = null; refreshProfileModal(); }
    async function profileDisableTotp() {
      const password = document.getElementById("prof-totp-pw").value;
      try { await api("/api/me/totp", "DELETE", { password }); notify("two-factor disabled"); await refreshProfileModal(); }
      catch (e) { notify(e.message, "err"); }
    }
    async function profileCreatePat() {
      const label = document.getElementById("prof-pat-label").value.trim();
      try {
        const r = await api("/api/me/pats", "POST", label ? { label } : {});
        tokenOnceModal("Personal access token", r.token, openProfileModal);
      } catch (e) { notify(e.message, "err"); }
    }
    async function profileRevokePat(pid) {
      const ok = await confirmModal({ title: "Revoke token", ico: "key",
        body: "This token will stop working immediately.", confirmLabel: "Revoke", confirmClass: "k-btn--danger" });
      if (ok) { try { await api("/api/me/pats/" + encodeURIComponent(pid), "DELETE"); notify("token revoked"); } catch (e) { notify(e.message, "err"); } }
      await openProfileModal();
    }

    // ------------------------------------------------------------ USERS (admin)
    async function openUsersModal() {
      if (!isSuperuser()) return;
      openModal(`${icon('users', 20)}<span>Users</span>`, `<div class="k-muted">loading…</div>`, "k-modal--wide");
      await refreshUsersModal();
    }
    async function refreshUsersModal() {
      let users = [];
      try { users = ((await api("/api/users")) || {}).users || []; }
      catch (e) { const b = modalBody(); if (b) b.innerHTML = `<div class="k-airec__err">${esc(e.message)}</div>`; return; }
      const b = modalBody(); if (b) b.innerHTML = usersBodyHtml(users);
    }
    function usersBodyHtml(users) {
      const rows = users.map(u => `<tr>
        <td><span class="kacc-cell">${avatarHtml(u)}<b>${esc(u.username)}</b></span></td>
        <td>${rolePill(u.role)}</td>
        <td>${u.email ? esc(u.email) : '<span class="k-muted">—</span>'}</td>
        <td>${u.totp_enabled ? `<span class="k-row" style="gap:5px">${icon('shield-check', 15)}on</span>` : '<span class="k-muted">off</span>'}</td>
        <td>${u.disabled ? '<span class="k-pill k-pill--crit">disabled</span>' : '<span class="k-pill k-pill--ok">active</span>'}</td>
        <td class="kacc-tbl__actions">
          <button class="k-btn k-btn--ghost k-btn--sm" onclick="openUserDetail(${jsArg(u.id)})">${icon('sliders', 13)}manage</button>
          <button class="k-btn k-btn--danger k-btn--sm" title="delete" onclick="deleteUser(${jsArg(u.id)}, ${jsArg(u.username)})">${icon('trash-2', 13)}</button>
        </td></tr>`).join("");
      return `<div class="k-row" style="justify-content:space-between;margin-bottom:12px">
          <span class="k-muted">${users.length} user${users.length === 1 ? "" : "s"}</span>
          <button class="k-btn k-btn--primary" onclick="openCreateUserModal()">${icon('plus', 14)}Create user</button>
        </div>
        <table class="kacc-tbl"><thead><tr>
          <th>User</th><th>Role</th><th>Email</th><th>2FA</th><th>Status</th><th></th></tr></thead>
          <tbody>${rows || `<tr><td colspan="6" class="kacc-empty">no users</td></tr>`}</tbody></table>`;
    }
    function roleSelectHtml(id, selected) {
      return `<select class="k-input" id="${id}">` +
        ["superuser", "operator", "user"].map(r =>
          `<option value="${r}" ${r === selected ? "selected" : ""}>${r}</option>`).join("") + `</select>`;
    }
    async function openCreateUserModal() {
      const avatars = ((await api("/api/avatars").catch(() => ({ avatars: [] }))) || {}).avatars || [];
      const fleet = (await api("/api/fleet").catch(() => ({ agents: [] }))) || { agents: [] };
      const hosts = (fleet.agents || []).map(a => a.agent_id);
      const body = `
        <div class="kfield"><span class="kfield__lbl">Username</span>
          <input class="k-input" id="nu-username" autocomplete="off"></div>
        <div class="kfield"><span class="kfield__lbl">Password</span>
          <input class="k-input" id="nu-password" type="password" autocomplete="new-password"></div>
        <div class="kfield"><span class="kfield__lbl">Role</span>
          ${roleSelectHtml("nu-role", "user")}</div>
        <div class="kfield"><span class="kfield__lbl">Email (optional)</span>
          <input class="k-input" id="nu-email" type="email" autocomplete="off"></div>
        <div class="kfield"><span class="kfield__lbl">Avatar (optional)</span>
          ${avatarPickerHtml("newuser-av", avatars, null)}</div>
        <div class="kfield" id="nu-hostsec"><span class="kfield__lbl">Host scope</span>
          ${hostGridHtml("newuser-hosts", hosts, [])}</div>
        <div class="k-modal__actions">
          <button class="k-btn k-btn--ghost" onclick="openUsersModal()">Back</button>
          <button class="k-btn k-btn--primary" onclick="createUser()">${icon('check', 14)}Create</button>
        </div>`;
      openModal(`${icon('plus', 20)}<span>Create user</span>`, body, "k-modal--wide");
      const roleSel = document.getElementById("nu-role");
      const toggle = () => { document.getElementById("nu-hostsec").style.display = roleSel.value === "user" ? "block" : "none"; };
      roleSel.addEventListener("change", toggle); toggle();
    }
    async function createUser() {
      const username = document.getElementById("nu-username").value.trim();
      const password = document.getElementById("nu-password").value;
      const role = document.getElementById("nu-role").value;
      const email = document.getElementById("nu-email").value.trim();
      const avatar = avatarPick["newuser-av"] || null;
      if (!username || !password) { notify("username and password are required", "err"); return; }
      const body = { username, password, role };
      if (email) body.email = email;
      if (avatar) body.avatar = avatar;
      if (role === "user") body.hosts = checkedHosts("newuser-hosts");
      try { await api("/api/users", "POST", body); notify("user created"); await openUsersModal(); }
      catch (e) { notify(e.message, "err"); }
    }
    async function openUserDetail(uid) {
      openModal(`${icon('user-round', 20)}<span>User</span>`, `<div class="k-muted">loading…</div>`, "k-modal--wide");
      let user, avatars = [], hosts = [], profiles = {};
      try {
        user = await api("/api/users/" + encodeURIComponent(uid));
        avatars = ((await api("/api/avatars").catch(() => ({ avatars: [] }))) || {}).avatars || [];
        const fleet = (await api("/api/fleet").catch(() => ({ agents: [] }))) || { agents: [] };
        hosts = (fleet.agents || []).map(a => a.agent_id);
        profiles = ((await api("/api/tool-classes").catch(() => ({ profiles: {} }))) || {}).profiles || {};
      } catch (e) {
        const b = modalBody(); if (b) b.innerHTML = `<div class="k-airec__err">${esc(e.message)}</div>`;
        return;
      }
      const b = modalBody(); if (b) b.innerHTML = userDetailHtml(user, avatars, hosts, profiles);
    }
    function userDetailHtml(u, avatars, hosts, profiles) {
      const uid = u.id;
      const head = `<div class="k-row" style="justify-content:space-between;margin-bottom:14px">
        <span class="kacc-cell">${avatarHtml(u, "kc-avatar--lg")}<b style="font-size:var(--text-md)">${esc(u.username)}</b>${rolePill(u.role)}</span>
        <button class="k-btn k-btn--ghost k-btn--sm" onclick="openUsersModal()">${icon('chevron-left', 13)}All users</button>
      </div>`;
      const accountSec = `<div class="kacc-sec">
        <div class="kacc-sec__lbl">Account</div>
        <div class="kfield"><span class="kfield__lbl">Username</span>
          <input class="k-input" id="eu-username" value="${esc(u.username)}" autocomplete="off"></div>
        <div class="kfield"><span class="kfield__lbl">Email</span>
          <input class="k-input" id="eu-email" type="email" value="${esc(u.email || "")}" autocomplete="off"></div>
        <div class="kfield"><span class="kfield__lbl">Role</span>${roleSelectHtml("eu-role", u.role)}</div>
        <div class="kfield"><span class="kfield__lbl">Avatar</span>${avatarPickerHtml("edituser-av", avatars, u.avatar || null)}</div>
        <label class="kwf-tog" style="margin:4px 0 12px"><input type="checkbox" id="eu-disabled" ${u.disabled ? "checked" : ""}><span>account disabled</span></label>
        <button class="k-btn k-btn--primary" onclick="saveUser(${jsArg(uid)})">${icon('check', 14)}Save changes</button>
      </div>`;
      const profileNames = Object.keys(profiles || {});
      const profileSec = `<div class="kacc-sec">
        <div class="kacc-sec__lbl">Capability profile</div>
        <div class="k-muted" style="margin-bottom:8px">Narrows which tools this account may
          invoke, on top of what its role already allows.</div>
        <div class="kfield__row">
          <select class="k-input" id="eu-profile">
            <option value="">(none — role default)</option>
            ${profileNames.map(p =>
              `<option value="${esc(p)}" ${p === u.capability_profile ? "selected" : ""}>${esc(p)}</option>`
            ).join("")}
          </select>
          <button class="k-btn k-btn--ghost" onclick="saveUserProfile(${jsArg(uid)})">${icon('check', 14)}Save</button>
        </div>
      </div>`;
      const pwSec = `<div class="kacc-sec">
        <div class="kacc-sec__lbl">Reset password</div>
        <div class="kfield__row">
          <input class="k-input" id="eu-newpw" type="password" autocomplete="new-password" placeholder="new password">
          <button class="k-btn k-btn--ghost" onclick="resetUserPassword(${jsArg(uid)})">${icon('key', 14)}Set password</button>
        </div>
      </div>`;
      const totpSec = `<div class="kacc-sec">
        <div class="kacc-sec__lbl">Two-factor authentication</div>
        ${u.totp_enabled
          ? `<div class="k-row" style="gap:8px;margin-bottom:8px">${icon('shield-check', 16)}<span>enabled</span></div>
             <button class="k-btn k-btn--danger" onclick="resetUserTotp(${jsArg(uid)})">Reset two-factor</button>`
          : `<div class="k-muted">not enabled</div>`}
      </div>`;
      const hostsSec = `<div class="kacc-sec">
        <div class="kacc-sec__lbl">Host scope</div>
        <div class="k-muted" style="margin-bottom:8px">For a <b>user</b> account this is a limit — the only hosts it can see. For an <b>operator</b> or <b>superuser</b> it limits nothing, and instead says which PCs are their own: what an unqualified Discord request like &ldquo;my PC is slow&rdquo; is taken to be about. Leave it empty and every such request has to be answered with a question first.</div>
        ${hostGridHtml("edituser-hosts", hosts, u.hosts || [])}
        <button class="k-btn k-btn--ghost" style="margin-top:10px" onclick="saveUserHosts(${jsArg(uid)})">${icon('check', 14)}Save host scope</button>
      </div>`;
      const patSec = `<div class="kacc-sec">
        <div class="kacc-sec__lbl">Personal access tokens</div>
        ${patsTableHtml(u.pats, "revokeUserPat_" + cssId(uid))}
        <div class="kfield__row" style="margin-top:10px">
          <input class="k-input" id="eu-pat-label" placeholder="label (optional)" autocomplete="off">
          <button class="k-btn k-btn--primary" onclick="createUserPat(${jsArg(uid)})">${icon('plus', 14)}New token</button>
        </div>
      </div>`;
      // Bind the row-scoped revoke handler for this user's PAT table.
      window["revokeUserPat_" + cssId(uid)] = pid => revokeUserPat(uid, pid);
      return head + accountSec + profileSec + pwSec + totpSec + hostsSec + patSec;
    }
    async function saveUserProfile(uid) {
      const el = document.getElementById("eu-profile");
      const capability_profile = el && el.value ? el.value : null;
      try {
        await api("/api/users/" + encodeURIComponent(uid) + "/profile", "PUT", { capability_profile });
        notify("capability profile saved");
        await openUserDetail(uid);
      } catch (e) { notify(e.message, "err"); }
    }
    // A stable identifier fragment for building a per-user handler name.
    function cssId(uid) { return String(uid).replace(/[^A-Za-z0-9]/g, "_"); }
    async function saveUser(uid) {
      const body = {
        username: document.getElementById("eu-username").value.trim(),
        email: document.getElementById("eu-email").value.trim(),
        role: document.getElementById("eu-role").value,
        avatar: avatarPick["edituser-av"] || null,
        disabled: document.getElementById("eu-disabled").checked,
      };
      try { await api("/api/users/" + encodeURIComponent(uid), "PATCH", body); notify("user updated"); await openUserDetail(uid); }
      catch (e) { notify(e.message, "err"); }
    }
    async function resetUserPassword(uid) {
      const new_password = document.getElementById("eu-newpw").value;
      if (!new_password) { notify("enter a new password", "err"); return; }
      try { await api("/api/users/" + encodeURIComponent(uid) + "/password", "POST", { new_password }); notify("password reset"); await openUserDetail(uid); }
      catch (e) { notify(e.message, "err"); }
    }
    async function saveUserHosts(uid) {
      const hosts = checkedHosts("edituser-hosts");
      try { await api("/api/users/" + encodeURIComponent(uid) + "/hosts", "PUT", { hosts }); notify("host scope saved"); await openUserDetail(uid); }
      catch (e) { notify(e.message, "err"); }
    }
    async function resetUserTotp(uid) {
      const ok = await confirmModal({ title: "Reset two-factor", ico: "shield-alert",
        body: "This removes the user's two-factor enrolment. They will sign in with just their password until they re-enable it.",
        confirmLabel: "Reset", confirmClass: "k-btn--danger" });
      if (ok) { try { await api("/api/users/" + encodeURIComponent(uid) + "/totp", "DELETE"); notify("two-factor reset"); } catch (e) { notify(e.message, "err"); } }
      await openUserDetail(uid);
    }
    async function createUserPat(uid) {
      const label = document.getElementById("eu-pat-label").value.trim();
      try {
        const r = await api("/api/users/" + encodeURIComponent(uid) + "/pats", "POST", label ? { label } : {});
        tokenOnceModal("Personal access token", r.token, () => openUserDetail(uid));
      } catch (e) { notify(e.message, "err"); }
    }
    async function revokeUserPat(uid, pid) {
      const ok = await confirmModal({ title: "Revoke token", ico: "key",
        body: "This token will stop working immediately.", confirmLabel: "Revoke", confirmClass: "k-btn--danger" });
      if (ok) { try { await api("/api/users/" + encodeURIComponent(uid) + "/pats/" + encodeURIComponent(pid), "DELETE"); notify("token revoked"); } catch (e) { notify(e.message, "err"); } }
      await openUserDetail(uid);
    }
    async function deleteUser(uid, name) {
      const ok = await confirmModal({ title: "Delete user", ico: "trash-2",
        body: `Permanently delete "${name}"? Their sessions and tokens are revoked.`,
        confirmLabel: "Delete", confirmClass: "k-btn--danger" });
      if (ok) { try { await api("/api/users/" + encodeURIComponent(uid), "DELETE"); notify("user deleted"); } catch (e) { notify(e.message, "err"); } }
      await openUsersModal();
    }

    // Total number of flagged sections of a given severity across the fleet
    // (a single agent can contribute several warnings/criticals at once).
    function flaggedCount(agents, sevName) {
      const key = sevName === "crit" ? "crit_sections" : "warn_sections";
      return agents.reduce((n, a) => n + ((a[key] || []).length), 0);
    }

    // Compact fleet summary shown in the header (replaces the old stat-card row).
    // A single segmented pill: online · warnings · critical · last push. Word
    // labels collapse on narrow screens, leaving icon + number. The warnings and
    // critical counts are section totals, and link into the flagged view.
    function fleetMetricsHtml(agents) {
      const online = agents.filter(a => a.online).length;
      const warn = flaggedCount(agents, "warn");
      const crit = flaggedCount(agents, "crit");
      const metric = (mod, ico, value, label) =>
        `<span class="kc-metric${mod ? ` kc-metric--${mod}` : ""}">${icon(ico, 14)}` +
        `<span>${value}${label ? `<span class="kc-metric__lbl"> ${label}</span>` : ""}</span></span>`;
      // Same markup as metric() but as a link into the flagged view (used when count > 0).
      const metricLink = (mod, ico, value, label, href) =>
        `<a class="kc-metric${mod ? ` kc-metric--${mod}` : ""}" href="${href}">${icon(ico, 14)}` +
        `<span>${value}${label ? `<span class="kc-metric__lbl"> ${label}</span>` : ""}</span></a>`;
      const flagMetric = (count, mod, ico, label, sevName) =>
        count
          ? metricLink(mod, ico, `<b>${count}</b>`, label, `#/flagged/${sevName}`)
          : metric("", ico, `<b>${count}</b>`, label);
      return `<div class="kc-metrics">` +
        metric("", "monitor", `<b>${online}</b><span class="kc-metric__sub">/${agents.length}</span>`, "online") +
        flagMetric(warn, "warn", "triangle-alert", "warnings", "warn") +
        flagMetric(crit, "crit", "octagon-alert", "critical", "crit") +
        metric("", "clock", lastPush(agents), "") +
        `</div>`;
    }

    function lastPush(agents) {
      const times = agents.map(a => a.collected_at).filter(Boolean).map(t => Date.parse(t)).filter(n => !isNaN(n));
      if (!times.length) return "—";
      const mins = Math.max(0, Math.round((Date.now() - Math.max(...times)) / 60000));
      return mins < 1 ? "just now" : `${mins}m ago`;
    }

    // -- copilot rail visibility (Fleet tab only) -------------------------
    // Two modes, split at the 1180px rail breakpoint:
    //  · desktop (>1180px): a docked column whose on/off is persisted in
    //    localStorage["kenny-copilot"] (default on);
    //  · tablet/narrow (<=1180px): a right-anchored overlay drawer that is
    //    transient and defaults closed, so it never obscures the dashboard on
    //    load. The ✨ button drives whichever mode the current width is in.
    const copilotNarrowMq = window.matchMedia("(max-width: 1180px)");
    let copilotDrawerOpen = false; // transient tablet-drawer state (not persisted)

    function askRailOn() {
      // "kenny-copilot" stays the storage key on purpose: renaming it would
      // silently discard every operator's saved rail-open/closed preference.
      try { return localStorage.getItem("kenny-copilot") !== "off"; } catch (e) { return true; }
    }
    function applyCopilot() {
      const c = document.querySelector(".kc-console");
      if (c) c.classList.toggle("no-copilot", !askRailOn());
      // On tablet the drawer is closed unless explicitly opened; reconcile both
      // the drawer class and backdrop so a stale state can't linger after render.
      if (!copilotNarrowMq.matches) copilotDrawerOpen = false;
      if (c) c.classList.toggle("copilot-drawer-open", copilotDrawerOpen);
      const bd = document.getElementById("copilot-backdrop");
      if (bd) bd.classList.toggle("is-visible", copilotNarrowMq.matches && copilotDrawerOpen);
      const btn = document.getElementById("copilot-btn");
      // The button's active state reflects whichever mode is in effect.
      if (btn) btn.classList.toggle("is-active", copilotNarrowMq.matches ? copilotDrawerOpen : askRailOn());
    }
    function openAskDrawer() { copilotDrawerOpen = true; applyCopilot(); }
    function closeCopilotDrawer() { copilotDrawerOpen = false; applyCopilot(); }
    function toggleAskRail() {
      // Tablet: just flip the overlay drawer; CSS transitions the slide.
      if (copilotNarrowMq.matches) {
        copilotDrawerOpen ? closeCopilotDrawer() : openAskDrawer();
        return;
      }
      // Desktop: toggle the persisted docked column with the slide+fade animation.
      const on = !askRailOn();
      try { localStorage.setItem("kenny-copilot", on ? "on" : "off"); } catch (e) {}
      const rail = document.querySelector(".kc-copilot");
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (on) {
        // Reveal the column first, then play the slide+fade in. The class is
        // removed on animationend so periodic re-renders don't replay it.
        applyCopilot();
        if (rail && !reduce) {
          rail.classList.add("kc-copilot--enter");
          rail.addEventListener("animationend", () => rail.classList.remove("kc-copilot--enter"), { once: true });
        }
      } else if (rail && !reduce) {
        // Play the reverse slide+fade out *before* collapsing the column, so the
        // rail animates away instead of vanishing. The button reflects the new
        // (off) state immediately; applyCopilot hides the column when it ends.
        const btn = document.getElementById("copilot-btn");
        if (btn) btn.classList.remove("is-active");
        rail.classList.add("kc-copilot--exit");
        rail.addEventListener("animationend", () => {
          rail.classList.remove("kc-copilot--exit");
          applyCopilot();
        }, { once: true });
      } else {
        applyCopilot();
      }
    }
    // Crossing the rail breakpoint (e.g. tablet rotation) reconciles the two
    // modes: leaving narrow closes the drawer + backdrop; applyCopilot restores
    // the docked state from the persisted preference.
    copilotNarrowMq.addEventListener("change", () => { copilotDrawerOpen = false; applyCopilot(); });
    // Escape closes the tablet drawer.
    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && copilotNarrowMq.matches && copilotDrawerOpen) closeCopilotDrawer();
    });

    // -- fleet list (master) ----------------------------------------------
    function fleetListHtml(agents) {
      const sorted = agents.slice().sort((a, b) => {
        const rank = { crit: 3, warn: 2, unknown: 1, ok: 0 };
        return (rank[sev(b.overall)] || 0) - (rank[sev(a.overall)] || 0);
      });
      const items = sorted.map(a => {
        const name = (a.meta && a.meta.hostname) || a.agent_id;
        const selected = a.agent_id === state.selected;
        const crit = sev(a.overall) === "crit";
        const cls = (selected ? " is-selected" : "") + (selected && crit ? " is-crit" : "");
        const off = a.online ? "" : `<span class="kc-agent__off">offline</span>`;
        return `<button class="kc-agent${cls}" onclick="selectAgent(${jsArg(a.agent_id)})">
          <span class="k-dot k-dot--${sev(a.overall)}"></span>
          <span class="kc-agent__body">
            <span class="kc-agent__name">${esc(name)}</span>
            <span class="kc-agent__sum">${esc(a.summary || "")}</span>
          </span>${off}</button>`;
      }).join("");
      return `<div class="kc-section-lbl">fleet</div>
        <div class="kc-fleet__list">${items || '<div class="k-muted">No agents yet.</div>'}</div>`;
    }

    // Human label for an (os,arch) target. Only Linux distinguishes arch today
    // (Windows has ever only shipped one target) — see ADR-0036.
    function targetLabel(os, arch) {
      if (os === "windows") return "Windows";
      return arch === "aarch64" ? "Linux (ARM64)" : "Linux (x86_64)";
    }
    // Options for the "Add a PC" target picker, built from the server's actual
    // binary availability (`bin.targets`, ADR-0036) so the dropdown can never
    // offer a combination we don't ship. Falls back to a static Windows/Linux
    // pair if `bin.targets` isn't present yet (e.g. a stale cached page hitting
    // an older API during rollout).
    function targetOptionsHtml(bin) {
      const targets = (bin && bin.targets) || [
        { os: "windows", arch: "x86_64", available: true },
        { os: "linux", arch: "x86_64", available: true },
      ];
      const avail = targets.filter(t => t.available);
      const list = avail.length ? avail : targets; // never render an empty select
      return list.map(t => `<option value="${t.os}:${t.arch}">${targetLabel(t.os, t.arch)}</option>`).join("");
    }

    function addPcHtml(bin) {
      // A missing binary for one target must not block the others; only disable
      // when nothing is available at all.
      const anyAvail = !bin || (bin.targets ? bin.targets.some(t => t.available) : bin.available || (bin.by_os && (bin.by_os.windows || bin.by_os.linux)));
      const dis = anyAvail ? "" : "disabled";
      return `<div class="kc-addpc">
        <div class="kc-addpc__head">${icon('plus', 14)}Add a PC</div>
        <input class="k-input" id="new-agent-id" placeholder="agent id (e.g. study-pc)" autocomplete="off" />
        <div class="k-row kc-addpc__row" style="margin-top:8px">
          <div class="kc-addpc__split">
            <select class="k-input kc-addpc__os" id="new-agent-os">${targetOptionsHtml(bin)}</select>
            <button class="k-btn k-btn--primary k-btn--sm kc-addpc__go" onclick="downloadNewInstaller()" ${dis}>${icon('download', 13)}installer</button>
          </div>
          <button class="k-btn k-btn--ghost k-btn--sm" onclick="shareNewInstaller()" ${dis}>${icon('link', 13)}share link</button>
        </div>
      </div>`;
    }

    // -- agent detail ------------------------------------------------------
    async function selectAgent(id) {
      state.selected = id;
      const det = document.getElementById("detail");
      if (det) det.innerHTML = `<div class="k-muted">loading ${esc(id)}…</div>`;
      setChatContext(id);
      renderConsoleListSelection();
      let data;
      try { data = await getJSON("/api/agent/" + encodeURIComponent(id)); }
      catch (e) { if (det) det.innerHTML = `<div class="k-muted">error: ${esc(e.message)}</div>`; return; }
      if (state.selected !== id) return; // selection changed while loading
      renderDetail(data);
      renderConsoleListSelection();
    }

    function renderConsoleListSelection() {
      const agents = (state.fleet && state.fleet.agents) || [];
      const a = agents.find(x => x.agent_id === state.selected);
      const crit = a && sev(a.overall) === "crit";
      document.querySelectorAll(".kc-agent").forEach(el => {
        el.classList.remove("is-selected", "is-crit");
        const sel = el.getAttribute("onclick") || "";
        if (sel.includes("'" + state.selected + "'")) {
          el.classList.add("is-selected");
          if (crit) el.classList.add("is-crit");
        }
      });
    }

    function reasonHtml(reason, status) {
      if (!reason || sev(status) === "ok") return "";
      return `<span class="k-reason k-reason--${sev(status)}">
        <span>${esc(reason)}</span>
        <span class="k-reason__arrow">&rArr;</span>
        <span class="k-reason__out">${esc(status)}</span>
      </span>`;
    }

    // Middle-truncate over-long path-like tokens in a section summary so a
    // mount point (e.g. /var/lib/docker/.../<hash>) can't overflow the tile,
    // keeping the trailing info (e.g. "82% full") visible. Non-path tokens and
    // short tokens are left untouched; the raw value stays in the detail popup.
    function shortenPaths(text, max = 30) {
      return String(text).replace(/\S+/g, tok => {
        if (tok.length <= max || !/[/\\]/.test(tok)) return tok;
        const head = Math.ceil((max - 1) / 2), tail = max - 1 - head;
        return tok.slice(0, head) + "…" + tok.slice(tok.length - tail);
      });
    }

    // A single telemetry section tile. Shared by the agent detail view and the
    // flagged (warnings/critical) view; onclick is the JS to run when tapped.
    function tileHtml(name, status, summary, reason, onclick) {
      return `<button class="k-tile k-tile--${sev(status)}" onclick="${onclick}" title="${esc(name)} details">
          <div class="k-tile__head">
            <span class="k-tile__name">${icon(secIcon(name), 15)}<span>${esc(name)}</span></span>
            <span class="k-dot k-dot--${sev(status)}"></span>
          </div>
          <div class="k-tile__sum">${esc(shortenPaths(summary || ""))}</div>
          ${reasonHtml(reason, status)}
          <span class="k-tile__more">${icon('search', 13)}details</span>
        </button>`;
    }

    function renderDetail(data) {
      state.detail = data; // stash so section popups can read raw without a refetch
      const det = document.getElementById("detail");
      if (!det) return;
      const h = data.health || { overall: "unknown", sections: {} };
      const meta = data.meta || {};
      const name = meta.hostname || data.agent_id;
      const ver = meta.version ? " · v" + meta.version : "";
      const osFamily = (data.os || meta.os || "").toLowerCase();
      const os = meta.os || meta.os_name || osFamily || "";
      const osGlyph = osIcon(osFamily);

      // Sections a collector can't report on this OS come back as an
      // "n/a on this platform" stub (see ADR-0031). They carry no signal, so
      // hide their tiles rather than filling the grid with dead cards.
      const secs = Object.entries(h.sections || {})
        .filter(([, s]) => (s.summary || "").trim().toLowerCase() !== "n/a on this platform")
        .map(([n, s]) =>
          tileHtml(n, s.status, s.summary, s.reason, `openSectionDetail(${jsArg(n)})`)
        ).join("");

      // Forecast card, pinned above the health trend. The AI mode is made
      // explicit with the sparkle + "AI Forecast"; without an API key the same
      // card renders a deterministic prose summary under a plain "Forecast".
      const fcHead = data.ai_enabled
        ? `${icon('sparkles', 15)}<span>AI Forecast</span>`
        : `${icon('activity', 15)}<span>Forecast</span>`;

      det.innerHTML = `
        <div class="kc-detail__head">
          <div class="k-row" style="gap:10px;flex-wrap:wrap">
            <span class="k-dot k-dot--${sev(h.overall)}"></span>
            <span class="kc-detail__name">${esc(name)}</span>
            <span class="k-mono kc-detail__meta">${esc(data.agent_id)}${esc(ver)}</span>
            <span class="kc-detail__meta">${data.online ? "online" : "offline"}${os ? " · " + osGlyph + esc(os) : ""}</span>
          </div>
          <div class="k-row" style="gap:6px;flex-wrap:wrap">
            <button class="k-btn k-btn--ghost k-btn--sm" onclick="refreshNow(${jsArg(data.agent_id)})">${icon('refresh-cw', 13)}refresh</button>
            <button class="k-btn k-btn--ghost k-btn--sm" onclick="remoteHelp(${jsArg(data.agent_id)})" title="open Quick Assist on this PC for a remote-help session">${icon('life-buoy', 13)}remote help</button>` +
            // Token-rotation + fleet-admin actions are operator/superuser only;
            // a scoped `user` sees the read-only view above but not these.
            (canOperate() ? (osFamily === "linux" ? `
            <button class="k-btn k-btn--ghost k-btn--sm" onclick="shareLinuxInstaller(${jsArg(data.agent_id)})" title="share a fresh root install one-liner for this Linux PC (rotates its token)">${icon('link', 13)}install link</button>` : `
            <button class="k-btn k-btn--ghost k-btn--sm" onclick="downloadInstaller(${jsArg(data.agent_id)})" title="rebuild the installer for this PC (rotates its token)">${icon('download', 13)}reinstall</button>
            <button class="k-btn k-btn--ghost k-btn--sm" onclick="shareInstaller(${jsArg(data.agent_id)})" title="share a fresh installer link for this PC (rotates its token)">${icon('link', 13)}re-share</button>`) + `
            <button class="k-btn k-btn--danger k-btn--sm" onclick="updateAgent(${jsArg(data.agent_id)})">${icon('circle-arrow-up', 13)}update</button>
            <button class="k-btn k-btn--danger k-btn--sm" onclick="removeAgent(${jsArg(data.agent_id)}, ${jsArg(name)})" title="remove this PC from the inventory">${icon('trash-2', 13)}remove</button>` : "") + `
          </div>
        </div>
        <section class="k-airec kc-forecast">
          <div class="k-airec__head">${fcHead}</div>
          <div class="k-airec__body" id="kc-forecast"><span class="k-airec__wait">thinking…</span></div>
        </section>
        <div class="k-card k-card--sunken kc-trend">
          <div class="k-row" style="justify-content:space-between">
            <span class="kc-section-lbl">health trend · 30 d</span>
            <span class="k-mono" style="font-size:11px;color:var(--fg-faint)">worst-of / snapshot</span>
          </div>
          ${sparkline(data.history || [])}
        </div>
        <div class="kc-tiles">${secs || '<div class="k-muted">no telemetry yet</div>'}</div>
        <div class="k-card k-card--sunken kc-shotcard">
          <div class="k-row" style="justify-content:space-between">
            <span class="kc-section-lbl">last screenshot</span>
            <button class="k-btn k-btn--ghost k-btn--sm" onclick="captureScreenshot(${jsArg(data.agent_id)})">${icon('camera', 13)}recapture</button>
          </div>
          <img class="kc-shot" id="kc-shot-${esc(data.agent_id)}"
            src="/api/agent/${encodeURIComponent(data.agent_id)}/screenshot?t=${Date.now()}"
            onclick="screenshotModal(this.src)"
            onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
          <div class="k-muted" style="display:none;font-size:12px">none yet</div>
        </div>`;
      mountForecast(data.agent_id);
    }

    // Stream the near-term forecast into the top card. The server
    // synthesizes the disk/battery trends and inventory diff into a short prose
    // outlook; with no API key it streams a deterministic prose summary of the
    // same signals, so the card is never empty. Re-queries the target each event
    // so a selection change mid-stream simply ends the loop (the node is gone).
    async function mountForecast(agentId) {
      let started = false, raw = "";
      try {
        for await (const ev of streamSSE("/api/forecast/stream", { agent_id: agentId })) {
          const panel = document.getElementById("kc-forecast");
          if (!panel || state.selected !== agentId) return; // detail closed/changed
          if (ev.type === "text_delta") {
            if (!started) { panel.textContent = ""; started = true; }
            raw += ev.text;
            panel.textContent = raw;
          } else if (ev.type === "error") {
            if (!started) { panel.textContent = ""; started = true; }
            const e = document.createElement("div");
            e.className = "k-airec__err";
            e.textContent = "forecast unavailable: " + ev.error;
            panel.appendChild(e);
          }
        }
      } catch (e) {
        const panel = document.getElementById("kc-forecast");
        if (panel && !started) panel.textContent = "forecast unavailable";
      }
    }

    function sparkline(history) {
      const pts = history.slice();
      if (!pts.length) return `<div class="k-muted" style="font-size:12px">no history</div>`;
      const yOf = ov => ({ crit: 5, warn: 18, ok: 32, unknown: 38 }[sev(ov)] ?? 38);
      const colOf = ov => ({ ok: "var(--ok-dot)", warn: "var(--warn-dot)", crit: "var(--crit-solid)", unknown: "var(--unk-dot)" }[sev(ov)]);
      const n = pts.length;
      const x = i => n === 1 ? 0 : (i / (n - 1)) * 400;
      const line = pts.map((p, i) => `${x(i).toFixed(1)},${yOf(p.overall)}`).join(" ");
      const last = pts[pts.length - 1];
      return `<svg class="kc-spark" viewBox="0 0 400 44" preserveAspectRatio="none" role="img">
        <title>overall health over the last ${n} snapshots</title>
        <polyline points="${line}" fill="none" stroke="${colOf(last.overall)}" stroke-width="2"
          stroke-linejoin="round" stroke-linecap="round"/>
      </svg>`;
    }

    // -- structured section detail popup (replaces in-tile raw JSON) -------
    function openSectionDetail(name) {
      const data = state.detail || {};
      const raw = (data.snapshot || {})[name] || {};
      const s = ((data.health || {}).sections || {})[name] || {};
      const st = sev(s.status);
      const title = `${icon(secIcon(name), 20)}<span>${esc(name)}</span>
        <span class="k-pill k-pill--${st}">${icon(STATUS_ICON[st], 13)}${esc(st)}</span>`;
      // For flagged sections, offer an AI Recommendation between the heading and
      // the metrics — but only when the server reports an API key is configured.
      const ai = (data.ai_enabled && st !== "ok")
        ? `<section class="k-airec">
             <div class="k-airec__head">${icon('sparkles', 15)}<span>AI Recommendation</span></div>
             <div class="k-airec__body" id="airec-body"><span class="k-airec__wait">thinking…</span></div>
             <div class="k-airec__foot" id="airec-foot"></div>
           </section>`
        : "";
      const render = SECTION_RENDERERS[name] || renderSectionDetail;
      openModal(title, ai + render(raw, s));
      if (ai) streamRecommendation(data.agent_id, name);
      if (name === "web_activity") mountWebfilterPanel(data.agent_id);
      if (name === "reliability") { mountReliabilityHeatmap(raw); mountReliabilitySuppressionPanel(data.agent_id); }
    }

    // Custom section renderers keyed by telemetry section name; a section not
    // listed here falls back to the generic renderSectionDetail partitioner.
    const SECTION_RENDERERS = {
      web_activity: renderWebActivityDetail,
      reliability: renderReliabilityDetail,
      screen_time: renderScreenTimeDetail,
      local_accounts: renderAccountsDetail,
    };

    // Parental awareness (ADR-0029): whole-machine interactive minutes per day
    // as simple horizontal bars — deliberately nothing finer than day buckets.
    function renderScreenTimeDetail(raw, s) {
      let body = "";
      if (s && s.summary) body += `<div class="k-modal__sum">${esc(s.summary)}</div>`;
      const days = Array.isArray(raw.days) ? raw.days : [];
      if (days.length) {
        const max = Math.max(...days.map(d => d.active_minutes || 0), 60);
        body += `<div class="k-detail-grp"><div class="k-detail-grp__lbl">interactive time per day</div>`
          + days.map(d => {
            const mins = d.active_minutes || 0;
            const pct = Math.min(100, Math.round((mins / max) * 100));
            return `<div class="k-row" style="gap:8px;align-items:center;margin:3px 0">
              <span class="k-mono" style="font-size:11px;width:78px">${esc(d.date)}</span>
              <div style="flex:1;background:rgba(128,128,128,.15);border-radius:4px;height:14px;overflow:hidden">
                <div style="width:${pct}%;height:100%;background:var(--ok-dot)"></div>
              </div>
              <span class="k-mono" style="font-size:11px;width:44px;text-align:right">${(mins / 60).toFixed(1)}h</span>
            </div>`;
          }).join("") + `</div>`;
      } else {
        body += `<div class="k-muted">no session data in the window</div>`;
      }
      const scalars = [];
      for (const k of ["window_days", "source"]) {
        if (raw[k] !== undefined) scalars.push([k, fmtValue(k, raw[k])]);
      }
      if (Array.isArray(raw.errors) && raw.errors.length) scalars.push(["errors", raw.errors.join("; ")]);
      if (scalars.length) body += defListGrp(null, scalars);
      return body;
    }
    // Reliability detail: WHAT is going wrong on this PC. A category × day heatmap
    // (built from the per-group `by_day` histograms) over the loudest problem
    // categories, then each category expands to the raw sources / event ids /
    // sample messages behind it. The heatmap is mounted async (see
    // mountReliabilityHeatmap) after the modal DOM exists.
    function renderReliabilityDetail(raw, s) {
      let body = "";
      if (s && s.summary) body += `<div class="k-modal__sum">${esc(s.summary)}</div>`;
      if (s) body += reasonHtml(s.reason, s.status);
      const events = Array.isArray(raw.events) ? raw.events : [];
      const si = typeof raw.stability_index === "number" ? `${raw.stability_index.toFixed(1)} / 10` : "not reported";
      body += defListGrp(null, [
        ["error/critical events", raw.recent_crashes == null ? "—" : String(raw.recent_crashes)],
        ["stability index", si],
        ["window", `${raw.window_days || 7} days`],
      ]);
      if (!events.length) {
        body += `<div class="k-detail-grp"><div class="k-muted">No error or critical events in the window — nothing to break down.</div></div>`;
      } else {
        body += `<div class="k-detail-grp"><div class="k-detail-grp__lbl">what's going wrong · by day — click a cell for its events</div>
          <div class="kc-chart" id="k-reliab-heat" style="height:200px"></div>
          <div id="k-reliab-cell" style="display:none"></div></div>`;

        // Group the raw events by friendly category for the expandable breakdown.
        const byCat = {};
        for (const e of events) {
          const cat = e.category || e.source || "Other";

        }
        const cats = Object.keys(byCat).sort((a, b) =>
          catTotal(byCat[b]) - catTotal(byCat[a]));

          const rows = byCat[cat].slice().sort((a, b) => (b.count || 0) - (a.count || 0)).map(e => reliabEventRow(e)).join("");
          return `<details class="k-relcat">
            <summary><span class="k-relcat__name">${esc(cat)}</span>
              <span class="k-relcat__count">${catTotal(byCat[cat])} event(s)</span></summary>

              <tbody>${rows}</tbody></table></details>`;
        }).join("");

      // pattern from severity scoring while leaving its count and heatmap
      // contribution untouched. Mounted async after the modal DOM exists — see

      body += `<div class="k-detail-grp" id="k-relsup-panel"><div class="k-muted">loading suppression rules…</div></div>`;

    }
    function catTotal(evs) { return evs.reduce((n, e) => n + (e.count || 0), 0); }
    function relLevelBadge(level) {
      const cls = level === "critical" ? "crit" : "warn";
      return `<span class="k-pill k-pill--${cls}">${esc(level || "error")}</span>`;
    }
    // Severity badge from the read-path LLM annotation (ADR-0026) — how
    // much this *pattern* matters, independent of how often it repeats. Absent on
    // events from before annotation ran (e.g. no API key yet), in which case we
    // show nothing rather than guess.
    function relSeverityBadge(severity) {
      if (!severity) return `<span class="k-muted">—</span>`;
      const cls = { serious: "crit", notable: "warn", unknown: "warn", benign: "ok" }[severity] || "warn";
      return `<span class="k-pill k-pill--${cls}">${esc(severity)}</span>`;

    function relRowAction(e) {

    // One event row for the reliability tables. With `dayKey` the count column shows

    function reliabEventRow(e, dayKey) {

        <td>${relLevelBadge(e.level)}</td>
        <td>${relSeverityBadge(e.severity)}${e.suppressed ? " " + relSuppressedBadge(e.suppressed_by) : ""}</td>

        <td>${esc(fmtValue("last_seen", e.last_seen))}</td>

      if (!panel) return;

        .filter(e => (e.category || e.source || "Other") === cat && ((e.by_day || {})[day] || 0) > 0)
        .sort((a, b) => ((b.by_day || {})[day] || 0) - ((a.by_day || {})[day] || 0));
      const total = hits.reduce((n, e) => n + ((e.by_day || {})[day] || 0), 0);
      const lbl = `${esc(cat)} · ${esc(day)} — ${total} event(s)`;
      if (!hits.length) {
        panel.innerHTML = `<div class="k-detail-grp__lbl">${lbl}</div>
          <div class="k-muted">no events recorded for this cell.</div>`;
      } else {
        const rows = hits.map(e => reliabEventRow(e, day)).join("");
        panel.innerHTML = `<div class="k-detail-grp__lbl">${lbl}</div>
          <table class="k-dtable"><thead><tr><th>source / id</th><th>level</th><th>severity</th><th>count</th><th>last seen</th><th>sample / suspected cause</th><th></th></tr></thead>
            <tbody>${rows}</tbody></table>`;

    // Draw the category × day heatmap into the reliability popup from the events'
    // `by_day` histograms. Rows = friendly categories, cols = days; a closed modal
    // (missing element) is a no-op.
    function mountReliabilityHeatmap(raw) {
      const el = document.getElementById("k-reliab-heat");
      if (!el || !window.echarts) return;
      const events = Array.isArray(raw.events) ? raw.events : [];
      // category -> { day -> count }
      const grid = {}, dayset = {};
      for (const e of events) {
        const cat = e.category || e.source || "Other";
        const bd = e.by_day || {};
        for (const day of Object.keys(bd)) {
          dayset[day] = true;
          (grid[cat] = grid[cat] || {})[day] = (grid[cat][day] || 0) + (bd[day] || 0);
        }
      }
      const days = Object.keys(dayset).sort();
      const cats = Object.keys(grid).sort((a, b) => catTotal(events.filter(e => (e.category || e.source || "Other") === b)) - catTotal(events.filter(e => (e.category || e.source || "Other") === a)));
      if (!days.length || !cats.length) { el.style.height = "auto"; el.innerHTML = `<div class="k-muted" style="font-size:12px">no per-day breakdown available.</div>`; return; }
      el.style.height = Math.max(120, cats.length * 30 + 60) + "px";
      const base = chartBase();
      const inst = newChart(el);
      let max = 1;
      const data = [];
      cats.forEach((cat, y) => days.forEach((day, x) => {
        const v = (grid[cat] || {})[day] || 0;
        if (v > max) max = v;
        data.push({ value: [x, y, v], _cat: cat, _day: day });
      }));
      inst.setOption({
        textStyle: base.textStyle,
        tooltip: { ...base.tooltip, trigger: "item", formatter: p =>
          `${esc(p.data._cat)} · ${esc(p.data._day)}<br/><b>${p.data.value[2]}</b> event(s)` },
        grid: { left: 4, right: 14, top: 6, bottom: 20, containLabel: true },
        xAxis: { type: "category", data: days, splitArea: { show: true },

                 axisLine: { lineStyle: { color: base._border } } },
        yAxis: { type: "category", data: cats, splitArea: { show: true },
                 axisLabel: { color: base._fg }, axisLine: { lineStyle: { color: base._border } } },
        visualMap: { min: 0, max, calculable: false, show: false,
                     inRange: { color: [cssVar("--surface-raised"), cssVar("--amber-deep") || cssVar("--accent"), statusColor("crit")] } },
        series: [{ type: "heatmap", data, itemStyle: { borderColor: base._border, borderWidth: 1 },
                   emphasis: { itemStyle: { borderColor: base._fg } } }],
      });

    }
    // Alarm suppression panel (ADR-0041 / issue #166): the reliability card's
    // editable list of operator rules that exclude a (source, event_id)
    // pattern from severity scoring while leaving its counts and heatmap
    // contribution untouched. Fetch → render, re-run after every mutation; a
    // closed modal is a no-op. Mirrors mountWebfilterPanel/renderWebfilterPanel.
    async function mountReliabilitySuppressionPanel(agentId) {
      const panel = document.getElementById("k-relsup-panel");
      if (!panel) return;
      let d;
      try { d = await getJSON("/api/reliability/suppressions"); }
      catch (e) {
        const p = document.getElementById("k-relsup-panel");
        if (p) p.innerHTML = `<div class="k-airec__err">suppression rules unavailable: ${esc(e.message)}</div>`;
        return;
      }
      renderReliabilitySuppressionPanel(agentId, d);
    }
    function renderReliabilitySuppressionPanel(agentId, d) {
      const panel = document.getElementById("k-relsup-panel");
      if (!panel) return;
      const aid = jsArg(agentId);
      const rw = canOperate();
      // Rules effective for this host: fleet-wide plus this host's own.
      const rules = (d.rules || []).filter(r => !r.agent_id || r.agent_id === agentId);
      const rows = rules.length ? rules.map(r => `
        <div class="kwf-row"><span class="k-mono">${esc(r.source || "any source")} / ${esc(String(r.event_id))}</span>
          <span class="k-pill k-pill--muted">${esc(r.agent_id ? "this PC" : "fleet-wide")}</span>
          ${r.note ? `<span class="k-muted">${esc(r.note)}</span>` : ""}
          ${rw ? `<button class="k-btn k-btn--danger k-btn--sm" style="margin-left:auto"
            title="remove" onclick="relUnsuppress(${jsArg(r.id)}, ${jsArg(r.agent_id ? "host" : "fleet")})">${icon('x', 12)}</button>` : ""}</div>`
        ).join("") : `<div class="k-muted">no suppression rules — every pattern counts toward scoring</div>`;
      // Event ID is required; source is optional (empty = any source with that id).
      const addRow = rw ? `
        <div class="kwf-add">
          <input class="k-input" id="krs-eid" inputmode="numeric" autocomplete="off" placeholder="event id (required) e.g. 4176"

          <input class="k-input" id="krs-source" autocomplete="off" placeholder="source (optional — empty = any source)"
            onkeydown="if(event.key==='Enter')relSuppressFromForm(${aid})"/>

            <option value="fleet">all PCs</option>
            <option value="host">this PC only</option>
          </select>
          <input class="k-input" id="krs-note" autocomplete="off" placeholder="note (optional)"
            onkeydown="if(event.key==='Enter')relSuppressFromForm(${aid})"/>
          <button class="k-btn k-btn--primary k-btn--sm" onclick="relSuppressFromForm(${aid})">${icon('plus', 13)}add</button>
        </div>` : "";
      panel.innerHTML = `
        <div class="k-detail-grp__lbl">alarm suppression — patterns excluded from severity scoring</div>
        <div class="k-muted" style="margin-bottom:8px">A suppressed pattern keeps its full count and colours the heatmap; it just stops driving warn/crit and drops out of the health reason. The reliability index still scores on its own.</div>
        ${addRow}
        <div class="kwf-list">${rows}</div>
        <div id="k-relsup-msg"></div>`;
    }
    // Suppress the exact (source, event_id) pair fleet-wide — the row action's
    // one-click affordance, no scope dialog.
    async function relSuppress(source, eventId) {
      const agentId = (state.detail || {}).agent_id;
      await relSuppressPost(agentId, { event_id: eventId, source: source || "" });
    }
    function relSuppressFromForm(agentId) {
      const eidRaw = ((document.getElementById("krs-eid") || {}).value || "").trim();

      const scope = (document.getElementById("krs-scope") || {}).value || "fleet";
      const note = ((document.getElementById("krs-note") || {}).value || "").trim();

        event_id: eid, source, note,
        agent_id: scope === "host" ? agentId : "",

    async function relSuppressPost(agentId, body) {
      try {
        await getJSON("/api/reliability/suppressions",
          { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

    }
    async function relUnsuppress(ruleId, scope) {
      const agentId = (state.detail || {}).agent_id;

      if (scope !== "host" && !confirm(
        "This suppression is fleet-wide — removing it re-enables the alarm on every PC. Continue?")) return;
      try {
        await getJSON("/api/reliability/suppressions/" + encodeURIComponent(ruleId), { method: "DELETE" });
        await relRefreshAfterSuppressionChange(agentId);
      } catch (e) { relSupMsg("could not unsuppress: " + e.message, true); }

    // Suppression changes the section's status, reason, and badges server-side,

    async function relRefreshAfterSuppressionChange(agentId) {
      await selectAgent(agentId);

    function relSupMsg(text, isErr) {
      const m = document.getElementById("k-relsup-msg");

    }
    // Parental-controls detail: flagged hits + observed domains + the per-host
    // list editor (mounted async after the modal opens — see mountWebfilterPanel).
    function renderWebActivityDetail(raw, s) {
      let body = "";
      if (s && s.summary) body += `<div class="k-modal__sum">${esc(s.summary)}</div>`;
      if (s) body += reasonHtml(s.reason, s.status);
      const flagged = Array.isArray(raw.flagged) ? raw.flagged : [];
      if (flagged.length) {
        const rows = flagged.map(f => `<tr>
          <td class="k-mono">${esc(f.domain)}</td>
          <td>${wfCatBadge(f.category)}</td>
          <td class="k-mono">${esc(f.matched_entry || "")}</td>

      if (domains.length) {

    // -- account governance (ADR-0042, ADR-0043) --------------------------
    // One control set for local, Microsoft and Linux accounts alike. Below the
    // account-database layer neither Windows nor Linux draws the distinctions

    // checkboxes, same buttons on every host.
    //
    // Every difference is data. Where a verb is not available for an account —
    // whatever the reason, its kind or its host — the section's `unsupported` map

    // operator wondering; branching on `os` here would rebuild the two worlds

    const ACCT_KIND_LABEL = {

    const ACCT_UNSUPPORTED_REASON = {

      kind_unknown: "kenny could not determine what kind of account this is",
      root_account: "this is root — group membership neither grants nor revokes it",
      admin_via_sudoers: "its administrator rights come from a sudoers rule, which kenny never edits",
      nologin_shell: "the account has no login shell, and kenny does not rewrite shells",
      no_network_logon_concept: "this machine has no per-account network sign-in to deny — SSH is covered by the other switch",
      no_sshd: "no SSH server is installed, so there is no remote sign-in to deny",
      sshd_no_include: "the SSH configuration has no drop-in directory, and kenny will not edit the main file",
      no_logind: "this machine has no session manager to act through",
      no_graphical_session: "there is no desktop session here to lock",
      no_admin_group: "this machine has no sudo, wheel or admin group",

    const ACCT_RIGHT_LABEL = {

    const ACCT_PROFILE_NOUN = { windows: "profile", linux: "home directory" };
    function acctOs() { return ((state.detail || {}).os) || "windows"; }

    function acctKindBadge(kind) {

    }

    function renderAccountsDetail(raw, s) {
      let body = "";
      if (s && s.summary) body += `<div class="k-modal__sum">${esc(s.summary)}</div>`;
      if (s) body += reasonHtml(s.reason, s.status);

      const agentId = (state.detail || {}).agent_id;
      const aid = jsArg(agentId);
      // Governance calls are operator-only server-side; a scoped `user` sees the

      // all (macOS today) shows the inventory without dead controls, and the
