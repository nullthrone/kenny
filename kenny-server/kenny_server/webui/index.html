    // -- activity tab: fleet-wide observability (audit + events) ----------
    function activityNavHtml(view) {
      const item = (v, ico, name, sub) =>
        `<a class="kc-navitem${view === v ? " is-active" : ""}" href="#/activity/${v}">
           ${icon(ico, 16)}
           <span class="kc-agent__body">
             <span class="kc-navitem__name">${name}</span>
             <span class="kc-navitem__sub">${sub}</span>
           </span></a>`;
      return `<div class="kc-section-lbl">activity</div>
        <div class="kc-fleet__list">
          ${item("audit", "shield-check", "tool-call audit log", "forwarded capability calls")}
          ${item("events", "activity", "events &amp; logs", "server + agent events")}
        </div>`;
    }

    async function renderActivity() {
      // The header metrics need fleet data in every tab; fetch it if missing.
      if (!state.fleet) {
        state.fleet = await getJSON("/api/fleet").catch(() => ({ agents: [] }));
      }
      renderHeaderRight(state.fleet, state.fleet.agents || []);
      // Lazy-load the fleet-wide logs on entry (same fallbacks as before).
      const [audit, events] = await Promise.all([
        getJSON("/api/audit").catch(() => ({ entries: [] })),
        getJSON("/api/events").catch(() => ({ entries: [] })),
      ]);
      state.audit = audit.entries || [];
      state.events = events.entries || [];
      const view = state.activityView;
      // no-copilot: there is no copilot rail here, so reuse the 2-column layout
      // and let the tables use the full width the rail would otherwise occupy.
      app.innerHTML =
        `<div class="kc-console no-copilot">
           <div class="k-panel kc-fleet">${activityNavHtml(view)}</div>
           ${view === "events" ? eventsPanelHtml() : auditPanelHtml()}
         </div>`;
      if (view === "events") renderEvents();
      else renderAudit();
    }

    function worstOf(agents) {
      const rank = { crit: 3, warn: 2, unknown: 1, ok: 0 };
      let best = null, score = -1;
      for (const a of agents) {
        const s = rank[sev(a.overall)] ?? 0;
        if (s > score) { score = s; best = a.agent_id; }
      }
      return best;
    }

    // -- header right: fleet metrics + copilot + theme + operator ----------
    function renderHeaderRight(fleet, agents) {
      // The copilot toggle only applies to the Fleet tab (the rail lives there).
      const copilotBtn = state.tab === "fleet"
        ? `<button class="kc-icon-btn" id="copilot-btn" onclick="toggleCopilot()" title="toggle copilot panel" aria-label="toggle copilot panel">${icon('sparkles', 16)}</button>`
        : "";
      headerRight.innerHTML =
        fleetMetricsHtml(agents) +
        copilotBtn +
        `<button class="kc-icon-btn" id="about-btn" onclick="openAboutModal()" title="about kenny" aria-label="about kenny">${icon('info', 16)}</button>
         <button class="kc-icon-btn" id="theme-btn" onclick="toggleTheme()" title="toggle theme">${icon(currentTheme() === "dark" ? "sun" : "moon", 16)}</button>
         <span class="kc-operator">${icon('user-round', 15)}operator</span>`;
    }

    // Total number of flagged sections of a given severity across the fleet
    // (a single agent can contribute several warnings/criticals at once).
    function flaggedCount(agents, sevName) {
      const key = sevName === "crit" ? "crit_sections" : "warn_sections";
      return agents.reduce((n, a) => n + ((a[key] || []).length), 0);
    }

    // Compact fleet summary shown in the header (replaces the old stat-card row).
    // A single segmented pill: online · warnings · critical · last push. Word
    // labels collapse on narrow screens, leaving icon + number. The warnings and
    // critical counts are section totals, and link into the flagged view.
    function fleetMetricsHtml(agents) {
      const online = agents.filter(a => a.online).length;
      const warn = flaggedCount(agents, "warn");
      const crit = flaggedCount(agents, "crit");
      const metric = (mod, ico, value, label) =>
        `<span class="kc-metric${mod ? ` kc-metric--${mod}` : ""}">${icon(ico, 14)}` +
        `<span>${value}${label ? `<span class="kc-metric__lbl"> ${label}</span>` : ""}</span></span>`;
      // Same markup as metric() but as a link into the flagged view (used when count > 0).
      const metricLink = (mod, ico, value, label, href) =>
        `<a class="kc-metric${mod ? ` kc-metric--${mod}` : ""}" href="${href}">${icon(ico, 14)}` +
        `<span>${value}${label ? `<span class="kc-metric__lbl"> ${label}</span>` : ""}</span></a>`;
      const flagMetric = (count, mod, ico, label, sevName) =>
        count
          ? metricLink(mod, ico, `<b>${count}</b>`, label, `#/flagged/${sevName}`)
          : metric("", ico, `<b>${count}</b>`, label);
      return `<div class="kc-metrics">` +
        metric("", "monitor", `<b>${online}</b><span class="kc-metric__sub">/${agents.length}</span>`, "online") +
        flagMetric(warn, "warn", "triangle-alert", "warnings", "warn") +
        flagMetric(crit, "crit", "octagon-alert", "critical", "crit") +
        metric("", "clock", lastPush(agents), "") +
        `</div>`;
    }

    function lastPush(agents) {
      const times = agents.map(a => a.collected_at).filter(Boolean).map(t => Date.parse(t)).filter(n => !isNaN(n));
      if (!times.length) return "—";
      const mins = Math.max(0, Math.round((Date.now() - Math.max(...times)) / 60000));
      return mins < 1 ? "just now" : `${mins}m ago`;
    }

    // -- copilot rail visibility (Fleet tab only) -------------------------
    // Two modes, split at the 1180px rail breakpoint:
    //  · desktop (>1180px): a docked column whose on/off is persisted in
    //    localStorage["kenny-copilot"] (default on);
    //  · tablet/narrow (<=1180px): a right-anchored overlay drawer that is
    //    transient and defaults closed, so it never obscures the dashboard on
    //    load. The ✨ button drives whichever mode the current width is in.
    const copilotNarrowMq = window.matchMedia("(max-width: 1180px)");
    let copilotDrawerOpen = false; // transient tablet-drawer state (not persisted)

    function copilotOn() {
      try { return localStorage.getItem("kenny-copilot") !== "off"; } catch (e) { return true; }
    }
    function applyCopilot() {
      const c = document.querySelector(".kc-console");
      if (c) c.classList.toggle("no-copilot", !copilotOn());
      // On tablet the drawer is closed unless explicitly opened; reconcile both
      // the drawer class and backdrop so a stale state can't linger after render.
      if (!copilotNarrowMq.matches) copilotDrawerOpen = false;
      if (c) c.classList.toggle("copilot-drawer-open", copilotDrawerOpen);
      const bd = document.getElementById("copilot-backdrop");
      if (bd) bd.classList.toggle("is-visible", copilotNarrowMq.matches && copilotDrawerOpen);
      const btn = document.getElementById("copilot-btn");
      // The button's active state reflects whichever mode is in effect.
      if (btn) btn.classList.toggle("is-active", copilotNarrowMq.matches ? copilotDrawerOpen : copilotOn());
    }
    function openCopilotDrawer() { copilotDrawerOpen = true; applyCopilot(); }
    function closeCopilotDrawer() { copilotDrawerOpen = false; applyCopilot(); }
    function toggleCopilot() {
      // Tablet: just flip the overlay drawer; CSS transitions the slide.
      if (copilotNarrowMq.matches) {
        copilotDrawerOpen ? closeCopilotDrawer() : openCopilotDrawer();
        return;
      }
      // Desktop: toggle the persisted docked column with the slide+fade animation.
      const on = !copilotOn();
      try { localStorage.setItem("kenny-copilot", on ? "on" : "off"); } catch (e) {}
      const rail = document.querySelector(".kc-copilot");
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (on) {
        // Reveal the column first, then play the slide+fade in. The class is
        // removed on animationend so periodic re-renders don't replay it.
        applyCopilot();
        if (rail && !reduce) {
          rail.classList.add("kc-copilot--enter");
          rail.addEventListener("animationend", () => rail.classList.remove("kc-copilot--enter"), { once: true });
        }
      } else if (rail && !reduce) {
        // Play the reverse slide+fade out *before* collapsing the column, so the
        // rail animates away instead of vanishing. The button reflects the new
        // (off) state immediately; applyCopilot hides the column when it ends.
        const btn = document.getElementById("copilot-btn");
        if (btn) btn.classList.remove("is-active");
        rail.classList.add("kc-copilot--exit");
        rail.addEventListener("animationend", () => {
          rail.classList.remove("kc-copilot--exit");
          applyCopilot();
        }, { once: true });
      } else {
        applyCopilot();
      }
    }
    // Crossing the rail breakpoint (e.g. tablet rotation) reconciles the two
    // modes: leaving narrow closes the drawer + backdrop; applyCopilot restores
    // the docked state from the persisted preference.
    copilotNarrowMq.addEventListener("change", () => { copilotDrawerOpen = false; applyCopilot(); });
    // Escape closes the tablet drawer.
    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && copilotNarrowMq.matches && copilotDrawerOpen) closeCopilotDrawer();
    });

    // -- fleet list (master) ----------------------------------------------
    function fleetListHtml(agents) {
      const sorted = agents.slice().sort((a, b) => {
        const rank = { crit: 3, warn: 2, unknown: 1, ok: 0 };
        return (rank[sev(b.overall)] || 0) - (rank[sev(a.overall)] || 0);
      });
      const items = sorted.map(a => {
        const name = (a.meta && a.meta.hostname) || a.agent_id;
        const selected = a.agent_id === state.selected;
        const crit = sev(a.overall) === "crit";
        const cls = (selected ? " is-selected" : "") + (selected && crit ? " is-crit" : "");
        const off = a.online ? "" : `<span class="kc-agent__off">offline</span>`;
        return `<button class="kc-agent${cls}" onclick="selectAgent('${esc(a.agent_id)}')">
          <span class="k-dot k-dot--${sev(a.overall)}"></span>
          <span class="kc-agent__body">
            <span class="kc-agent__name">${esc(name)}</span>
            <span class="kc-agent__sum">${esc(a.summary || "")}</span>
          </span>${off}</button>`;
      }).join("");
      return `<div class="kc-section-lbl">fleet</div>
        <div class="kc-fleet__list">${items || '<div class="k-muted">No agents yet.</div>'}</div>`;
    }

    function addPcHtml(bin) {
      const dis = bin && !bin.available ? "disabled" : "";
      return `<div class="kc-addpc">
        <div class="kc-addpc__head">${icon('plus', 14)}Add a PC</div>
        <input class="k-input" id="new-agent-id" placeholder="agent id (e.g. study-pc)" autocomplete="off" />
        <div class="k-row" style="margin-top:8px">
          <button class="k-btn k-btn--primary k-btn--sm" onclick="downloadNewInstaller()" ${dis}>${icon('download', 13)}installer</button>
          <button class="k-btn k-btn--ghost k-btn--sm" onclick="shareNewInstaller()" ${dis}>${icon('link', 13)}share link</button>
        </div>
      </div>`;
    }

    // -- agent detail ------------------------------------------------------
    async function selectAgent(id) {
      state.selected = id;
      const det = document.getElementById("detail");
      if (det) det.innerHTML = `<div class="k-muted">loading ${esc(id)}…</div>`;
      setChatContext(id);
      renderConsoleListSelection();
      let data;
      try { data = await getJSON("/api/agent/" + encodeURIComponent(id)); }
      catch (e) { if (det) det.innerHTML = `<div class="k-muted">error: ${esc(e.message)}</div>`; return; }
      if (state.selected !== id) return; // selection changed while loading
      renderDetail(data);
      renderConsoleListSelection();
    }

    function renderConsoleListSelection() {
      const agents = (state.fleet && state.fleet.agents) || [];
      const a = agents.find(x => x.agent_id === state.selected);
      const crit = a && sev(a.overall) === "crit";
      document.querySelectorAll(".kc-agent").forEach(el => {
        el.classList.remove("is-selected", "is-crit");
        const sel = el.getAttribute("onclick") || "";
        if (sel.includes("'" + state.selected + "'")) {
          el.classList.add("is-selected");
          if (crit) el.classList.add("is-crit");
        }
      });
    }

    function reasonHtml(reason, status) {
      if (!reason || sev(status) === "ok") return "";
      return `<span class="k-reason k-reason--${sev(status)}">
        <span>${esc(reason)}</span>
        <span class="k-reason__arrow">&rArr;</span>
        <span class="k-reason__out">${esc(status)}</span>
      </span>`;
    }

    // A single telemetry section tile. Shared by the agent detail view and the
    // flagged (warnings/critical) view; onclick is the JS to run when tapped.
    function tileHtml(name, status, summary, reason, onclick) {
      return `<button class="k-tile k-tile--${sev(status)}" onclick="${onclick}" title="${esc(name)} details">
          <div class="k-tile__head">
            <span class="k-tile__name">${icon(secIcon(name), 15)}<span>${esc(name)}</span></span>
            <span class="k-dot k-dot--${sev(status)}"></span>
          </div>
          <div class="k-tile__sum">${esc(summary || "")}</div>
          ${reasonHtml(reason, status)}
          <span class="k-tile__more">${icon('search', 13)}details</span>
        </button>`;
    }

    function renderDetail(data) {
      state.detail = data; // stash so section popups can read raw without a refetch
      const det = document.getElementById("detail");
      if (!det) return;
      const h = data.health || { overall: "unknown", sections: {} };
      const meta = data.meta || {};
      const name = meta.hostname || data.agent_id;
      const ver = meta.version ? " · v" + meta.version : "";
      const os = meta.os || meta.os_name || "";

      const secs = Object.entries(h.sections || {}).map(([n, s]) =>
        tileHtml(n, s.status, s.summary, s.reason, `openSectionDetail('${esc(n)}')`)
      ).join("");

      det.innerHTML = `
        <div class="kc-detail__head">
          <div class="k-row" style="gap:10px;flex-wrap:wrap">
            <span class="k-dot k-dot--${sev(h.overall)}"></span>
            <span class="kc-detail__name">${esc(name)}</span>
            <span class="k-mono kc-detail__meta">${esc(data.agent_id)}${esc(ver)}</span>
            <span class="kc-detail__meta">${data.online ? "online" : "offline"}${os ? " · " + esc(os) : ""}</span>
          </div>
          <div class="k-row" style="gap:6px;flex-wrap:wrap">
            <button class="k-btn k-btn--ghost k-btn--sm" onclick="refreshNow('${esc(data.agent_id)}')">${icon('refresh-cw', 13)}refresh</button>
            <button class="k-btn k-btn--ghost k-btn--sm" onclick="remoteHelp('${esc(data.agent_id)}')" title="open Quick Assist on this PC for a remote-help session">${icon('life-buoy', 13)}remote help</button>
            <button class="k-btn k-btn--ghost k-btn--sm" onclick="downloadInstaller('${esc(data.agent_id)}')" title="rebuild the installer for this PC (rotates its token)">${icon('download', 13)}reinstall</button>
            <button class="k-btn k-btn--ghost k-btn--sm" onclick="shareInstaller('${esc(data.agent_id)}')" title="share a fresh installer link for this PC (rotates its token)">${icon('link', 13)}re-share</button>
            <button class="k-btn k-btn--danger k-btn--sm" onclick="updateAgent('${esc(data.agent_id)}')">${icon('circle-arrow-up', 13)}update</button>
          </div>
        </div>
        <div class="k-card k-card--sunken kc-trend">
          <div class="k-row" style="justify-content:space-between">
            <span class="kc-section-lbl">health trend · 30 d</span>
            <span class="k-mono" style="font-size:11px;color:var(--fg-faint)">worst-of / snapshot</span>
          </div>
          ${sparkline(data.history || [])}
        </div>
        <div class="kc-tiles">${secs || '<div class="k-muted">no telemetry yet</div>'}</div>
        <div class="k-card k-card--sunken kc-shotcard">
          <div class="k-row" style="justify-content:space-between">
            <span class="kc-section-lbl">last screenshot</span>
            <button class="k-btn k-btn--ghost k-btn--sm" onclick="captureScreenshot('${esc(data.agent_id)}')">${icon('camera', 13)}recapture</button>
          </div>
          <img class="kc-shot" id="kc-shot-${esc(data.agent_id)}"
            src="/api/agent/${encodeURIComponent(data.agent_id)}/screenshot?t=${Date.now()}"
            onclick="screenshotModal(this.src)"
            onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
          <div class="k-muted" style="display:none;font-size:12px">none yet</div>
        </div>`;
    }

    function sparkline(history) {
      const pts = history.slice();
      if (!pts.length) return `<div class="k-muted" style="font-size:12px">no history</div>`;
      const yOf = ov => ({ crit: 5, warn: 18, ok: 32, unknown: 38 }[sev(ov)] ?? 38);
      const colOf = ov => ({ ok: "var(--ok-dot)", warn: "var(--warn-dot)", crit: "var(--crit-solid)", unknown: "var(--unk-dot)" }[sev(ov)]);
      const n = pts.length;
      const x = i => n === 1 ? 0 : (i / (n - 1)) * 400;
      const line = pts.map((p, i) => `${x(i).toFixed(1)},${yOf(p.overall)}`).join(" ");
      const last = pts[pts.length - 1];
      return `<svg class="kc-spark" viewBox="0 0 400 44" preserveAspectRatio="none" role="img">
        <title>overall health over the last ${n} snapshots</title>
        <polyline points="${line}" fill="none" stroke="${colOf(last.overall)}" stroke-width="2"
          stroke-linejoin="round" stroke-linecap="round"/>
      </svg>`;
    }

    // -- structured section detail popup (replaces in-tile raw JSON) -------
    function openSectionDetail(name) {
      const data = state.detail || {};
      const raw = (data.snapshot || {})[name] || {};
      const s = ((data.health || {}).sections || {})[name] || {};
      const st = sev(s.status);
      const title = `${icon(secIcon(name), 20)}<span>${esc(name)}</span>
        <span class="k-pill k-pill--${st}">${icon(STATUS_ICON[st], 13)}${esc(st)}</span>`;
      // For flagged sections, offer an AI Recommendation between the heading and
      // the metrics — but only when the server reports an API key is configured.
      const ai = (data.ai_enabled && st !== "ok")
        ? `<section class="k-airec">
             <div class="k-airec__head">${icon('sparkles', 15)}<span>AI Recommendation</span></div>
             <div class="k-airec__body" id="airec-body"><span class="k-airec__wait">thinking…</span></div>
             <div class="k-airec__foot" id="airec-foot"></div>
           </section>`
        : "";
      const render = SECTION_RENDERERS[name] || renderSectionDetail;
      openModal(title, ai + render(raw, s));
      if (ai) streamRecommendation(data.agent_id, name);
      if (name === "web_activity") mountWebfilterPanel(data.agent_id);
    }

    // Custom section renderers keyed by telemetry section name; a section not
    // listed here falls back to the generic renderSectionDetail partitioner.
    const SECTION_RENDERERS = { web_activity: renderWebActivityDetail };

    // Parental-controls detail: flagged hits + observed domains + the per-host
    // list editor (mounted async after the modal opens — see mountWebfilterPanel).
    function renderWebActivityDetail(raw, s) {
      let body = "";
      if (s && s.summary) body += `<div class="k-modal__sum">${esc(s.summary)}</div>`;
      if (s) body += reasonHtml(s.reason, s.status);
      const flagged = Array.isArray(raw.flagged) ? raw.flagged : [];
      if (flagged.length) {
        const rows = flagged.map(f => `<tr>
          <td class="k-mono">${esc(f.domain)}</td>
          <td>${wfCatBadge(f.category)}</td>
          <td class="k-mono">${esc(f.matched_entry || "")}</td>
          <td>${esc(fmtValue("last_seen", f.last_seen))}</td></tr>`).join("");
        body += `<div class="k-detail-grp"><div class="k-detail-grp__lbl">flagged — matched this PC's list</div>
          <table class="k-dtable"><thead><tr><th>domain</th><th>category</th><th>matched entry</th><th>last seen</th></tr></thead>
          <tbody>${rows}</tbody></table></div>`;
      }
      const domains = Array.isArray(raw.domains) ? raw.domains : [];
      if (domains.length) {
        const rows = domains.map(d => ({
          domain: d.domain, hits: d.hits,
          sources: (d.sources || []).join(", "), last_seen: d.last_seen,
        }));
        body += tableGrp("observed domains (24h)", rows);
      }
      const scalars = [];
      for (const k of ["window_hours", "sources", "browser_profiles_read", "truncated"]) {
        if (raw[k] === undefined) continue;
        const v = raw[k];
        scalars.push([k, Array.isArray(v) ? (v.join(", ") || "—") : fmtValue(k, v)]);
      }
      if (Array.isArray(raw.errors) && raw.errors.length) scalars.push(["errors", raw.errors.join("; ")]);
      if (scalars.length) body += defListGrp(null, scalars);
      body += `<div class="k-detail-grp" id="kwf-panel"><div class="k-muted">loading parental-controls list…</div></div>`;
      return body;
    }
    function wfCatBadge(cat) {
      const label = { custom: "custom", seed: "seed", external_adult: "adult list", bypass: "bypass" }[cat] || cat || "—";
      return `<span class="k-pill k-pill--${cat === "bypass" ? "warn" : "crit"}">${esc(label)}</span>`;
    }
    function wfActionBadge(action) {
      const cls = action === "allow" ? "ok" : action === "watch" ? "warn" : "crit";
      return `<span class="k-pill k-pill--${cls}">${esc(action)}</span>`;
    }

    // The dashboard's first editable list: fetch and render the per-host
    // parental-controls config into #kwf-panel. Re-runs after every mutation so
    // counts, drift, and applied-state stay current; a closed modal is a no-op.
    async function mountWebfilterPanel(agentId) {
      const panel = document.getElementById("kwf-panel");
      if (!panel) return;
      let d;
      try { d = await getJSON("/api/agent/" + encodeURIComponent(agentId) + "/webfilter"); }
      catch (e) {
        const p = document.getElementById("kwf-panel");
        if (p) p.innerHTML = `<div class="k-airec__err">list unavailable: ${esc(e.message)}</div>`;
        return;
      }
      renderWebfilterPanel(agentId, d);
    }
    function renderWebfilterPanel(agentId, d) {
      const panel = document.getElementById("kwf-panel");
      if (!panel) return;
      const c = d.config || {}, ext = d.external || {}, applied = d.applied || {};
      const on = v => v === true || v === 1;
      const aid = esc(agentId);
      const tog = (key, label, val, hint) => `
        <label class="kwf-tog" title="${esc(hint || "")}">
          <input type="checkbox" ${on(val) ? "checked" : ""}
            onchange="wfSetConfig('${aid}', '${key}', this.checked)"/><span>${esc(label)}</span></label>`;
      const dohOn = (c.doh_policy || "disable") === "disable";
      const custom = d.custom || [];
      const customRows = custom.length ? custom.map(r => `
        <div class="kwf-row"><span class="k-mono">${esc(r.domain)}</span>${wfActionBadge(r.action)}
          ${r.note ? `<span class="k-muted">${esc(r.note)}</span>` : ""}
          <button class="k-btn k-btn--danger k-btn--sm" style="margin-left:auto"
            title="remove" onclick="wfRemoveDomain('${aid}', '${esc(r.domain)}')">${icon('x', 12)}</button></div>`
        ).join("") : `<div class="k-muted">no custom entries yet</div>`;
      const adultN = (ext.adult || {}).count || 0, bypassN = (ext.bypass || {}).count || 0;
      const appliedLine = applied.at
        ? `applied ${esc(fmtValue("at", applied.at))}${applied.ok === false ? " — agent reported failure" : ""}`
        : "not yet applied";
      const drift = d.drift ? `<span class="k-pill k-pill--warn">list changed since last apply</span>` : "";
      panel.innerHTML = `
        <div class="k-detail-grp__lbl">parental-controls list</div>
        <div class="kwf-togs">
          ${tog("enabled", "monitor this PC", c.enabled, "observe web activity and match it against this list")}
          ${tog("block_mode", "block listed sites", c.block_mode, "push the block list to the agent (hosts file + DoH off)")}
          ${tog("use_external_adult", "use adult blocklist", c.use_external_adult, "reference the StevenBlack porn-only list (" + adultN + " domains)")}
          ${tog("use_bypass_protection", "block VPN/proxy bypass", c.use_bypass_protection, "also block DoH/VPN/proxy domains (" + bypassN + " domains)")}
          <label class="kwf-tog" title="turn DNS-over-HTTPS off in browsers so the hosts block can't be bypassed">
            <input type="checkbox" ${dohOn ? "checked" : ""}
              onchange="wfSetConfig('${aid}', 'doh_policy', this.checked ? 'disable' : 'leave')"/><span>disable browser DoH</span></label>
        </div>
        <div class="kwf-add">
          <input class="k-input" id="kwf-domain" autocomplete="off" placeholder="domain e.g. example.com"
            onkeydown="if(event.key==='Enter')wfAddDomain('${aid}')"/>
          <select class="k-input" id="kwf-action">
            <option value="block">block</option>
            <option value="watch">watch (alarm only)</option>
            <option value="allow">allow (exception)</option>
          </select>
          <button class="k-btn k-btn--primary k-btn--sm" onclick="wfAddDomain('${aid}')">${icon('plus', 13)}add</button>
        </div>
        <div class="kwf-list">${customRows}</div>
        <div class="k-muted" style="margin-top:6px">seed: ${d.seed_count || 0} known adult domains · adult list: ${adultN} · bypass: ${bypassN}</div>
        <div class="kwf-apply">
          <button class="k-btn k-btn--primary k-btn--sm" onclick="wfApply('${aid}')">${icon('refresh-cw', 13)}apply now</button>
          <span class="k-muted">${esc(appliedLine)}</span> ${drift}
        </div>
        <div id="kwf-msg"></div>`;
    }
    async function wfSetConfig(agentId, key, value) {
      try {
        const body = {}; body[key] = value;
        await getJSON("/api/agent/" + encodeURIComponent(agentId) + "/webfilter/config",
          { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        mountWebfilterPanel(agentId);
      } catch (e) { wfMsg("could not update: " + e.message, true); }
    }
    async function wfAddDomain(agentId) {
      const inp = document.getElementById("kwf-domain"), sel = document.getElementById("kwf-action");
      const domain = ((inp && inp.value) || "").trim();
      if (!domain) return;
      try {
        await getJSON("/api/agent/" + encodeURIComponent(agentId) + "/webfilter/domains",
          { method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ domain, action: sel ? sel.value : "block" }) });
        mountWebfilterPanel(agentId);
      } catch (e) { wfMsg("could not add: " + e.message, true); }
    }
    async function wfRemoveDomain(agentId, domain) {
      try {
        await getJSON("/api/agent/" + encodeURIComponent(agentId) + "/webfilter/domains/" + encodeURIComponent(domain),
          { method: "DELETE" });
        mountWebfilterPanel(agentId);
      } catch (e) { wfMsg("could not remove: " + e.message, true); }
    }
    async function wfApply(agentId) {
      wfMsg("applying…", false);
      try {
        const r = await getJSON("/api/agent/" + encodeURIComponent(agentId) + "/webfilter/apply", { method: "POST" });
        if (r && r.ok === false && r.error === "disabled")
          wfMsg("remote control is switched off at the PC — new rules were not applied; monitoring continues.", true);
        else wfMsg("applied.", false);
        mountWebfilterPanel(agentId);
      } catch (e) { wfMsg("apply failed: " + e.message, true); }
    }
    function wfMsg(text, isErr) {
      const m = document.getElementById("kwf-msg");
      if (m) m.innerHTML = `<div class="${isErr ? "k-airec__err" : "k-muted"}" style="margin-top:6px">${esc(text)}</div>`;
    }

    // Stream the Haiku recommendation into the popup. Re-queries the target on
    // every event so a closed modal simply ends the loop (the node is gone).
    async function streamRecommendation(agentId, section) {
      let started = false, raw = "";
      try {
        for await (const ev of streamSSE("/api/recommendation/stream", { agent_id: agentId, section })) {
          const body = document.getElementById("airec-body");
          if (!body) return; // modal closed mid-stream
          if (ev.type === "text_delta") {
            if (!started) { body.textContent = ""; started = true; }
            // Re-render the whole accumulated reply each delta so the inline
            // Action steps land on their own lines (see formatRecommendation).
            raw += ev.text;
            body.textContent = formatRecommendation(raw);
          } else if (ev.type === "remediation") {
            if (ev.available && ev.prompt) renderRemediate(agentId, ev.prompt);
          } else if (ev.type === "error") {
            if (!started) { body.textContent = ""; started = true; }
            const e = document.createElement("div");
            e.className = "k-airec__err";
            e.textContent = "recommendation unavailable: " + ev.error;
            body.appendChild(e);
          }
        }
      } catch (e) {
        const body = document.getElementById("airec-body");
        if (body && !started) body.textContent = "recommendation unavailable";
      }
    }

    // The advisor returns "Diagnosis: … / Action: 1) … 2) … / Urgency: …" with the
    // Action steps run together on one line. Break each numbered step (1) or 1.)
    // onto its own line so the list reads as a list. Only single-digit paren/dot
    // markers count as bullets — they don't occur in the Diagnosis/Urgency prose.
    function formatRecommendation(text) {
      return text.replace(/[ \t]+([1-9][.)])\s+/g, (_, mark) => "\n" + mark + " ");
    }

    // Auto-Remediate: Haiku judged the warning fixable with kenny's tools, so
    // offer a button that hands the suggested prompt to the copilot.
    function renderRemediate(agentId, prompt) {
      const foot = document.getElementById("airec-foot");
      if (!foot || foot.querySelector(".k-airec__fix")) return;
      const btn = document.createElement("button");
      btn.className = "k-btn k-btn--primary k-airec__fix";
      btn.innerHTML = `${icon('sparkles', 14)}Auto-Remediate`;
      btn.onclick = () => autoRemediate(agentId, prompt);
      foot.appendChild(btn);
    }

    // Inject the remediation prompt into the copilot: reveal the rail, scope the
    // chat to this PC, close the popup, and start the turn. State-changing steps
    // still hit the confirm-gate — Auto-Remediate does not bypass confirmation.
    function autoRemediate(agentId, prompt) {
      if (!copilotOn()) {
        try { localStorage.setItem("kenny-copilot", "on"); } catch (e) {}
        applyCopilot();
      }
      closeModal();
      setChatContext(agentId);
      startChatTurn(prompt);
    }

    function renderSectionDetail(raw, s) {
      let body = "";
      if (s && s.summary) body += `<div class="k-modal__sum">${esc(s.summary)}</div>`;
      if (s) body += reasonHtml(s.reason, s.status);
      // Partition the raw object: scalars (incl. scalar arrays) → a def-list;
      // arrays-of-objects → tables; nested objects → sub def-lists.
      const scalars = [], tables = [], groups = [];
      for (const [k, v] of Object.entries(raw)) {
        if (k === "status" || k === "summary") continue; // already in the header
        if (Array.isArray(v)) {
          if (v.length && v.every(x => x && typeof x === "object" && !Array.isArray(x))) tables.push([k, v]);
          else scalars.push([k, v.map(x => fmtValue(k, x)).join(", ") || "—"]);
        } else if (v && typeof v === "object") {
          groups.push([k, v]);
        } else {
          scalars.push([k, fmtValue(k, v)]);
        }
      }
      if (scalars.length) body += defListGrp(null, scalars);
      for (const [k, v] of tables) body += tableGrp(k, v);
      for (const [k, v] of groups) body += defListGrp(prettyKey(k), Object.entries(v).map(([kk, vv]) => [kk, fmtValue(kk, vv)]));
      if (!scalars.length && !tables.length && !groups.length) body += `<div class="k-muted">no further detail</div>`;
      return body;
    }
    function defListGrp(label, pairs) {
      const rows = pairs.map(([k, v]) =>
        `<div class="k-deflist__k">${esc(prettyKey(k))}</div><div class="k-deflist__v ${isMono(v) ? "k-mono" : ""}">${esc(v)}</div>`
      ).join("");
      return `<div class="k-detail-grp">${label ? `<div class="k-detail-grp__lbl">${esc(label)}</div>` : ""}<div class="k-deflist">${rows}</div></div>`;
    }
    // Long lists (services, peripherals, processes…) get a client-side filter
    // bar above the table; below this row count the table stays bare.
    const TABLE_FILTER_MIN = 8;
    let tableSeq = 0;
    function tableGrp(label, rows) {
      const cols = [];
      for (const r of rows) for (const k of Object.keys(r)) if (!cols.includes(k)) cols.push(k);
      const head = cols.map(c => `<th>${esc(prettyKey(c))}</th>`).join("");
      const body = rows.map(r => `<tr>${cols.map(c => {
        const val = fmtValue(c, r[c]);
        return `<td class="${isMono(r[c]) ? "k-mono" : ""}">${esc(val)}</td>`;
      }).join("")}</tr>`).join("");
      const tid = "dtbl-" + (++tableSeq);
      const bar = rows.length >= TABLE_FILTER_MIN
        ? `<div class="k-audit__bar">
             <span class="k-audit__search">${icon('search', 15)}
               <input class="k-input" autocomplete="off" placeholder="filter ${esc(prettyKey(label))}…"
                 oninput="filterTable('${tid}', this.value)" /></span>
             <span class="k-audit__count" id="${tid}-count">${rows.length} of ${rows.length}</span>
           </div>`
        : "";
      return `<div class="k-detail-grp"><div class="k-detail-grp__lbl">${esc(prettyKey(label))}</div>
        ${bar}
        <table class="k-dtable" id="${tid}"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
    }

    // Filter a long detail table in place by matching any cell against the query.
    function filterTable(id, q) {
      const tbl = document.getElementById(id);
      if (!tbl || !tbl.tBodies.length) return;
      const needle = q.trim().toLowerCase();
      const rows = tbl.tBodies[0].rows;
      let shown = 0;
      for (const r of rows) {
        const match = !needle || r.textContent.toLowerCase().includes(needle);
        r.hidden = !match;
        if (match) shown++;
      }
      const cnt = document.getElementById(id + "-count");
      if (cnt) cnt.textContent = shown + " of " + rows.length;
    }

    // -- flagged view: warnings/critical grouped by agent (from the pills) --
    async function renderFlagged() {
      // Reachable from any tab via the header pills; ensure fleet data is loaded.
      if (!state.fleet) {
        state.fleet = await getJSON("/api/fleet").catch(() => ({ agents: [] }));
      }
      const agents = state.fleet.agents || [];
      renderHeaderRight(state.fleet, agents);
      const sevName = state.flaggedSev === "crit" ? "crit" : "warn";
      const key = sevName === "crit" ? "crit_sections" : "warn_sections";
      const title = sevName === "crit" ? "Critical" : "Warnings";
      const titleIcon = sevName === "crit" ? "octagon-alert" : "triangle-alert";

      // One group per agent that has sections of this severity, busiest first.
      const groups = agents
        .map(a => ({ a, secs: a[key] || [] }))
        .filter(g => g.secs.length)
        .sort((x, y) => y.secs.length - x.secs.length);

      let body;
      if (!groups.length) {
        body = `<div class="k-panel"><div class="k-muted">Nothing needs attention right now — no ${esc(title.toLowerCase())} across the fleet.</div></div>`;
      } else {
        body = groups.map(({ a, secs }) => {
          const hostname = (a.meta && a.meta.hostname) || a.agent_id;
          const tiles = secs.map(s =>
            tileHtml(s.name, sevName, s.summary, s.reason,
              `gotoAgentSection('${esc(a.agent_id)}', '${esc(s.name)}')`)
          ).join("");
          return `<div class="k-panel kc-flagged__group">
            <div class="kc-flagged__head">
              <span class="k-dot k-dot--${sev(a.overall)}"></span>
              <span class="kc-detail__name">${esc(hostname)}</span>
              <span class="kc-detail__meta">${secs.length} ${secs.length === 1 ? "issue" : "issues"}</span>
            </div>
            <div class="kc-tiles">${tiles}</div>
          </div>`;
        }).join("");
      }

      app.innerHTML =
        `<div class="kc-flagged">
           <div class="kc-flagged__bar">
             <a class="k-btn k-btn--ghost k-btn--sm" href="#/fleet">${icon('chevron-left', 13)}back to fleet</a>
             <span class="kc-flagged__title">${icon(titleIcon, 18)}<span>${esc(title)}</span></span>
           </div>
           ${body}
         </div>`;
    }

    // Open one section's detail popup from the flagged view *in place* — without
    // navigating back to the Fleet tab. We only need the agent's snapshot/health
    // (what openSectionDetail reads from state.detail), so load that and open the
    // popup over the warnings/critical list; closing it leaves the page intact.
    async function gotoAgentSection(id, name) {
      let data;
      try { data = await getJSON("/api/agent/" + encodeURIComponent(id)); }
      catch (e) { notify("failed to load " + id + ": " + e.message, "err"); return; }
      state.selected = id;
      state.detail = data;
      openSectionDetail(name);
    }

    async function refreshNow(id) {
      try { await getJSON("/api/agent/" + encodeURIComponent(id) + "/refresh", { method: "POST" }); }
      catch (e) { notify("refresh failed: " + e.message, "err"); }
      selectAgent(id);
    }

    // Open Quick Assist on the agent's desktop for a remote-help session. kenny only
    // launches the app; the helper shares the code and the person at the PC accepts.
    async function remoteHelp(id) {
      const ok = await confirmModal({
        title: "Remote help",
        ico: "life-buoy",
        body: "Open Quick Assist on '" + id + "' now? A helper still has to share the "
          + "security code and the person at the PC must accept the connection.",
        confirmLabel: "Open Quick Assist",
      });
      if (!ok) return;
      try {
        const r = await getJSON("/api/agent/" + encodeURIComponent(id) + "/remotehelp", { method: "POST" });
        notify(r.note || "Quick Assist opened on the user's desktop.");
      } catch (e) { notify("remote help failed: " + e.message, "err"); }
    }

    // Enlarge the agent-detail screenshot in a modal. Built in JS (not inline in
    // the img's onclick attribute) so the icon() SVG markup can't break the tag.
    function screenshotModal(src) {
      openModal(`${icon('camera', 18)}<span>Screenshot</span>`, `<img class="kc-shot" src="${src}">`, "k-modal--media");
    }

    async function captureScreenshot(id) {
      try {
        await getJSON("/api/agent/" + encodeURIComponent(id) + "/screenshot", { method: "POST" });
      } catch (e) {
        notify("screenshot failed: " + e.message, "err");
        return;
      }
      const img = document.getElementById("kc-shot-" + id);
      if (img) {
        img.style.display = "";
        if (img.nextElementSibling) img.nextElementSibling.style.display = "none";
        img.src = "/api/agent/" + encodeURIComponent(id) + "/screenshot?t=" + Date.now();
      }
    }

    // -- agent distribution (installer / share / update) ------------------
    function downloadInstaller(id) { window.location = "/api/agents/" + encodeURIComponent(id) + "/installer"; }
    function downloadNewInstaller() {
      const id = (document.getElementById("new-agent-id").value || "").trim();
      if (!id) return notify("enter an agent id", "err");
      downloadInstaller(id);
    }
    async function shareInstaller(id) {
      try {
        const r = await getJSON("/api/agents/" + encodeURIComponent(id) + "/share-link", { method: "POST" });
        shareLinkModal(id, r.url, r.expires_in);
      } catch (e) { notify("share failed: " + e.message, "err"); }
    }
    function shareNewInstaller() {
      const id = (document.getElementById("new-agent-id").value || "").trim();
      if (!id) return notify("enter an agent id", "err");
      shareInstaller(id);
    }
    async function updateAgent(id) {
      const ok = await confirmModal({
        title: "Update agent",
        ico: "circle-arrow-up",
        body: "Push a self-update to '" + id + "' now?",
        confirmLabel: "Push update",
      });
      if (!ok) return;
      try {
        const r = await getJSON("/api/agents/" + encodeURIComponent(id) + "/update", { method: "POST" });
        notify("update triggered: v" + r.version);
      } catch (e) { notify("update failed: " + e.message, "err"); }
    }

    // -- binary banner -----------------------------------------------------
    function bannerHtml(bin) {
      if (!bin || bin.available) return "";
      const retry = bin.github_configured
        ? `<button class="k-btn k-btn--ghost k-btn--sm" onclick="retryFetch(this)">retry GitHub fetch</button>` : "";
      return `<div class="k-panel kc-banner">
        <div class="k-row" style="gap:8px">${icon('triangle-alert', 16)}<span style="font-size:13px;font-weight:600">No agent installer available</span></div>
        <div class="kc-banner__msg k-muted">${esc(bin.message)}</div>${retry}
      </div>`;
    }
    async function retryFetch(btn) {
      btn.disabled = true; btn.textContent = "fetching…";
      try {
        const r = await getJSON("/api/agent-binary/fetch", { method: "POST" });
        if (r.ok) notify("fetched " + (r.version || ""));
        else notify("fetch failed: " + r.message, "err");
      } catch (e) { notify("fetch failed: " + e.message, "err"); }
      renderFleet();
    }

    // -- chat (server-hosted Claude; read-only auto-run vs confirm-gate) ---
    let chatSessionId = null;
    let chatContext = null; // selected agent id, or null for fleet-wide
    let chatAbort = null;   // AbortController while a turn streams (drives Stop)

    function chatHtml() {
      return `<div class="k-panel kc-chat kc-copilot">
        <div class="kc-chat__head">
          <span class="k-row kc-chat__title" style="gap:8px">${icon('message-square', 16)}chat · server-hosted</span>
          <span class="kc-ctx" id="chat-ctx">context: fleet</span>
        </div>
        <div class="kc-transcript" id="transcript"></div>
        <div class="kc-composer">
          <input class="k-input" id="chat-input" placeholder="Ask kenny to inspect or fix a PC…" autocomplete="off" />
          <button class="k-btn k-btn--primary" id="chat-send" onclick="sendChat()">${icon('send-horizontal', 15)}send</button>
        </div>
        <div class="kc-suggest">
          <button class="kc-chip" onclick="suggest(this)">Why is this PC flagged?</button>
          <button class="kc-chip" onclick="suggest(this)">Free up disk space</button>
          <button class="kc-chip" onclick="suggest(this)">Update all packages</button>
        </div>
      </div>`;
    }
    function mountChat() {
      const input = document.getElementById("chat-input");
      if (input) input.addEventListener("keydown", e => { if (e.key === "Enter") sendChat(); });
      setChatContext(state.selected);
    }
    function suggest(btn) {
      const input = document.getElementById("chat-input");
      if (input) { input.value = btn.textContent; input.focus(); }
    }
    function setChatContext(id) {
      chatContext = id || null;
      const chip = document.getElementById("chat-ctx");
      if (chip) chip.textContent = "context: " + (id || "fleet");
    }
    function setComposerEnabled(on) {
      const input = document.getElementById("chat-input");
      const send = document.getElementById("chat-send");
      if (input) input.disabled = !on;
      if (send) send.disabled = !on;
    }
    // Swap the send button to a Stop button while a turn streams (like the
    // desktop apps). Only touches the button's label/handler — the disabled
    // state is owned by setComposerEnabled (e.g. the confirm-gate lock).
    function setComposerStreaming(on) {
      const send = document.getElementById("chat-send");
      if (!send) return;
      if (on) {
        send.innerHTML = `${icon('square', 15)}stop`;
        send.onclick = stopChat;
        send.disabled = false;
      } else {
        send.innerHTML = `${icon('send-horizontal', 15)}send`;
        send.onclick = sendChat;
      }
    }
    // Stop the in-flight turn: aborting the fetch disconnects the SSE stream;
    // the server cancels its generator and the next turn heals the session.
    function stopChat() {
      if (chatAbort) chatAbort.abort();
    }

    function bubble(cls, text) {
      const t = document.getElementById("transcript");
      const div = document.createElement("div");
      div.className = "k-bubble k-bubble--" + cls;
      div.textContent = text;
      t.appendChild(div);
      t.scrollTop = t.scrollHeight;
      return div;
    }
    function toolRun(tool, ok) {
      const t = document.getElementById("transcript");
      const div = document.createElement("div");
      div.className = "k-toolrun" + (ok ? " k-toolrun--auto" : " k-toolrun--err");
      div.innerHTML = `<span class="k-toolrun__tick">${icon(ok ? 'check' : 'octagon-alert', 13)}</span>${esc(tool)}`;
      t.appendChild(div);
      t.scrollTop = t.scrollHeight;
    }
    function chatShot(imageB64, format) {
      const t = document.getElementById("transcript");
      const card = document.createElement("div");
      card.className = "k-card k-card--sunken kc-shotcard";
      const src = `data:image/${format};base64,${imageB64}`;
      const img = document.createElement("img");
      img.className = "kc-shot";
      img.src = src;
      img.onclick = () => openModal(`${icon('camera', 18)}<span>Screenshot</span>`,
        `<img class="kc-shot" src="${src}">`, "k-modal--media");
      card.appendChild(img);
      t.appendChild(card);
      t.scrollTop = t.scrollHeight;
    }
    // Per-stream state for handleChatEvent. ctx.bubble() lazily creates the
    // single assistant bubble the first time a text token arrives, so empty
    // turns (tool-only or a confirm-gate) don't leave a blank bubble behind.
    function newChatCtx() {
      return { _div: null, bubble() { return (this._div ||= bubble("assistant", "")); }, brokeSinceText: false };
    }
    // Apply one streamed chat event. ctx.brokeSinceText tracks whether a tool
    // ran since the last text token, so a new text segment is separated from
    // the prior one with a blank line instead of running straight into it
    // ("...check.Good, we have...").
    function handleChatEvent(ev, ctx) {
      const t = document.getElementById("transcript");
      if (ev.type === "text_delta") {
        const div = ctx.bubble();
        if (ctx.brokeSinceText && div.textContent) div.textContent += "\n\n";
        ctx.brokeSinceText = false;
        div.textContent += ev.text;
        t.scrollTop = t.scrollHeight;
      } else if (ev.type === "tool_result") {
        ctx.brokeSinceText = true;
        toolRun(ev.tool, ev.ok !== false);
        if (ev.image_b64) chatShot(ev.image_b64, ev.format || "png");
      } else if (ev.type === "denied") {
        ctx.brokeSinceText = true;
        toolRun("denied " + ev.tool, false);
      } else if (ev.type === "pending") {
        renderPending(ev);
      } else if (ev.type === "done") {
        if (ev.session_id) chatSessionId = ev.session_id;
      } else if (ev.type === "error") {
        if (ev.session_id) chatSessionId = ev.session_id;
        toolRun("error: " + ev.error, false);
      }
    }
    function gateCall(tool, args) {
      const entries = Object.entries(args || {});
      if (!entries.length) return `<span class="tok-tool">${esc(tool)}</span> {}`;
      const lines = entries.map(([k, v], i) =>
        `  <span class="tok-key">${esc(k)}</span>: ${esc(JSON.stringify(v))}${i < entries.length - 1 ? "," : ""}`
      ).join("\n");
      return `<span class="tok-tool">${esc(tool)}</span> {\n${lines}\n}`;
    }
    function renderPending(p) {
      const t = document.getElementById("transcript");
      const div = document.createElement("div");
      div.className = "k-gate";
      div.innerHTML = `
        <div class="k-gate__head">${icon('shield-alert', 15)}<span class="k-gate__title">confirm-gate · awaiting operator</span></div>
        <div class="k-gate__body">
          <div class="k-gate__desc">This will <b>change state</b> on <b>${esc(p.agent_id || "the active PC")}</b>. Review before it runs.</div>
          <div class="k-gate__call">${gateCall(p.tool, p.args)}</div>
        </div>
        <div class="k-gate__foot">
          <button class="k-btn k-btn--primary" onclick="confirmChat(true, this)">${icon('check', 15)}confirm &amp; run</button>
          <button class="k-btn k-btn--ghost" onclick="confirmChat(false, this)">cancel</button>
        </div>`;
      t.appendChild(div);
      t.scrollTop = t.scrollHeight;
      setComposerEnabled(false); // lock the composer until the gate is resolved
    }
    async function sendChat() {
      if (chatAbort) return; // a turn is already streaming (Enter while busy)
      const input = document.getElementById("chat-input");
      const message = (input.value || "").trim();
      if (!message) return;
      input.value = "";
      startChatTurn(message);
    }
    // Drive one chat turn for a given message — from the composer or an injected
    // Auto-Remediate prompt. Streams under an AbortController so Stop can cut it.
    async function startChatTurn(message) {
      if (chatAbort) return; // never overlap turns
      bubble("user", message);
      const body = { session_id: chatSessionId, message };
      if (chatContext) body.agent_id = chatContext;
      const ctx = newChatCtx();
      chatAbort = new AbortController();
      setComposerStreaming(true);
      try {
        for await (const ev of streamSSE("/api/chat/stream", body, { signal: chatAbort.signal })) {
          handleChatEvent(ev, ctx);
        }
      } catch (e) {
        if (e.name !== "AbortError") toolRun("error: " + e.message, false);
      } finally {
        chatAbort = null;
        setComposerStreaming(false);
      }
    }
    async function confirmChat(approve, btn) {
      btn.closest(".k-gate").remove();
      setComposerEnabled(true);
      const ctx = newChatCtx();
      chatAbort = new AbortController();
      setComposerStreaming(true);
      try {
        for await (const ev of streamSSE("/api/chat/confirm/stream", { session_id: chatSessionId, approve }, { signal: chatAbort.signal })) {
          handleChatEvent(ev, ctx);
        }
      } catch (e) {
        if (e.name !== "AbortError") toolRun("error: " + e.message, false);
      } finally {
        chatAbort = null;
        setComposerStreaming(false);
      }
    }

    // -- global audit log: searchable + paged ------------------------------
    function auditPanelHtml() {
      return `<div class="k-panel">
        <div class="kc-section-lbl" style="margin-bottom:10px">tool-call audit log</div>
        <div class="k-audit__bar">
          <span class="k-audit__search">${icon('search', 15)}
            <input class="k-input" id="audit-search" list="audit-suggest" placeholder="search by time, PC, or tool…"
              autocomplete="off" oninput="onAuditSearch(this.value)" value="${esc(state.auditQuery)}" />
            <datalist id="audit-suggest"></datalist>
          </span>
          <span class="k-audit__count" id="audit-count"></span>
        </div>
        <div class="k-audit" id="audit-rows"></div>
        <div class="k-audit__pager" id="audit-pager"></div>
      </div>`;
    }
    function auditTime(e) { return (e.at || "").slice(11, 19); }
    function filterAudit() {
      const q = state.auditQuery.trim().toLowerCase();
      if (!q) return state.audit;
      return state.audit.filter(e =>
        String(e.tool || "").toLowerCase().includes(q) ||
        String(e.agent_id || "").toLowerCase().includes(q) ||
        auditTime(e).toLowerCase().includes(q));
    }
    function onAuditSearch(v) { state.auditQuery = v; state.auditPage = 1; renderAudit(); }
    function auditGo(delta) { state.auditPage += delta; renderAudit(); }
    function auditRow(e) {
      const res = e.ok
        ? `<span class="k-audit__res k-audit__res--ok">ok</span>`
        : `<span class="k-audit__res k-audit__res--err">err</span>`;
      const sc = e.state_changing;
      return `<div class="k-audit__row">
        <span class="k-audit__time">${esc(auditTime(e))}</span>
        ${res}
        <span class="k-audit__tool">${esc(e.tool)}</span>
        <span class="k-audit__kind k-audit__kind--${sc ? "sc" : "ro"}">${sc ? "state-changing" : "read-only"}</span>
        <span class="k-audit__agent">${esc(e.agent_id)}</span>
      </div>`;
    }
    function renderAudit() {
      const rowsEl = document.getElementById("audit-rows");
      if (!rowsEl) return;
      // autocomplete suggestions: distinct tools, PCs, and HH:MM times (built once)
      const dl = document.getElementById("audit-suggest");
      if (dl && !dl.children.length && state.audit.length) {
        const set = new Set();
        state.audit.forEach(e => {
          if (e.tool) set.add(e.tool);
          if (e.agent_id) set.add(e.agent_id);
          const hm = auditTime(e).slice(0, 5);
          if (hm) set.add(hm);
        });
        dl.innerHTML = [...set].map(v => `<option value="${esc(v)}"></option>`).join("");
      }
      const all = filterAudit();
      const total = all.length;
      const pages = Math.max(1, Math.ceil(total / AUDIT_PAGE_SIZE));
      state.auditPage = Math.min(Math.max(1, state.auditPage), pages);
      const start = (state.auditPage - 1) * AUDIT_PAGE_SIZE;
      const slice = all.slice(start, start + AUDIT_PAGE_SIZE);
      rowsEl.innerHTML = slice.map(auditRow).join("")
        || `<div class="k-muted" style="font-size:var(--text-sm);padding:8px 4px">${state.audit.length ? "no matching calls" : "no calls yet"}</div>`;
      const countEl = document.getElementById("audit-count");
      if (countEl) countEl.textContent = total
        ? `${total} call${total === 1 ? "" : "s"} · showing ${start + 1}–${start + slice.length}`
        : "0 calls";
      const pager = document.getElementById("audit-pager");
      if (pager) pager.innerHTML = pages > 1
        ? `<button class="k-btn k-btn--quiet k-btn--sm" onclick="auditGo(-1)" ${state.auditPage <= 1 ? "disabled" : ""}>${icon('chevron-left', 13)}prev</button>
           <span>page ${state.auditPage} / ${pages}</span>
           <button class="k-btn k-btn--quiet k-btn--sm" onclick="auditGo(1)" ${state.auditPage >= pages ? "disabled" : ""}>next${icon('chevron-right', 13)}</button>`
        : "";
    }

    // -- fleet-wide events / logs: searchable + paged ----------------------
    function eventsPanelHtml() {
      return `<div class="k-panel">
        <div class="kc-section-lbl" style="margin-bottom:10px">events &amp; logs</div>
        <div class="k-audit__bar">
          <span class="k-audit__search">${icon('search', 15)}
            <input class="k-input" id="events-search" placeholder="search by level, source, PC, or message…"
              autocomplete="off" oninput="onEventsSearch(this.value)" value="${esc(state.eventsQuery)}" />
          </span>
          <span class="k-audit__count" id="events-count"></span>
        </div>
        <div class="k-audit" id="events-rows"></div>
        <div class="k-audit__pager" id="events-pager"></div>
      </div>`;
    }
    function eventsTime(e) { return (e.at || "").slice(11, 19); }
    function filterEvents() {
      const q = state.eventsQuery.trim().toLowerCase();
      if (!q) return state.events;
      return state.events.filter(e =>
        String(e.level || "").toLowerCase().includes(q) ||
        String(e.source || "").toLowerCase().includes(q) ||
        String(e.agent_id || "").toLowerCase().includes(q) ||
        String(e.target || "").toLowerCase().includes(q) ||
        String(e.message || e.tool || "").toLowerCase().includes(q) ||
        eventsTime(e).toLowerCase().includes(q));
    }
    function onEventsSearch(v) { state.eventsQuery = v; state.eventsPage = 1; renderEvents(); }
    function eventsGo(delta) { state.eventsPage += delta; renderEvents(); }
    function eventRow(e) {
      // Audit rows carry no level/message; synthesize a readable line from the call.
      const lvl = e.level || (e.ok === false ? "error" : "info");
      const who = e.agent_id || "";
      let body;
      if (e.kind === "audit") {
        body = `<span class="k-events__target">${esc(e.tool || "")}</span>${e.ok === false ? "failed: " + esc(e.error || "") : "ok"}`;
      } else {
        body = `${e.target ? `<span class="k-events__target">${esc(e.target)}</span>` : ""}${esc(e.message || "")}`;
      }
      return `<div class="k-events__row">
        <span class="k-audit__time">${esc(eventsTime(e))}</span>
        <span class="k-events__lvl k-events__lvl--${esc(lvl)}">${esc(lvl)}</span>
        <span class="k-events__src">${esc(e.source || "")}</span>
        <span class="k-events__who">${esc(who)}</span>
        <span class="k-events__msg">${body}</span>
      </div>`;
    }
    function renderEvents() {
      const rowsEl = document.getElementById("events-rows");
      if (!rowsEl) return;
      const all = filterEvents();
      const total = all.length;
      const pages = Math.max(1, Math.ceil(total / EVENTS_PAGE_SIZE));
      state.eventsPage = Math.min(Math.max(1, state.eventsPage), pages);
      const start = (state.eventsPage - 1) * EVENTS_PAGE_SIZE;
      const slice = all.slice(start, start + EVENTS_PAGE_SIZE);
      rowsEl.innerHTML = slice.map(eventRow).join("")
        || `<div class="k-muted" style="font-size:var(--text-sm);padding:8px 4px">${state.events.length ? "no matching events" : "no events yet"}</div>`;
      const countEl = document.getElementById("events-count");
      if (countEl) countEl.textContent = total
        ? `${total} event${total === 1 ? "" : "s"} · showing ${start + 1}–${start + slice.length}`
        : "0 events";
      const pager = document.getElementById("events-pager");
      if (pager) pager.innerHTML = pages > 1
        ? `<button class="k-btn k-btn--quiet k-btn--sm" onclick="eventsGo(-1)" ${state.eventsPage <= 1 ? "disabled" : ""}>${icon('chevron-left', 13)}prev</button>
           <span>page ${state.eventsPage} / ${pages}</span>
           <button class="k-btn k-btn--quiet k-btn--sm" onclick="eventsGo(1)" ${state.eventsPage >= pages ? "disabled" : ""}>next${icon('chevron-right', 13)}</button>`
        : "";
    }

    window.addEventListener("hashchange", () => {
      router().catch(e => app.textContent = "error: " + e.message);
    });
    // Normalize a bare URL to the default tab (replaceState does not fire
    // hashchange, so router() runs exactly once below).
    if (!location.hash) history.replaceState(null, "", "#/overview");
    router().catch(e => app.textContent = "error: " + e.message);
  </script>
</body>
</html>
