      const al = actorLabel(e.actor);
      return `<div class="kc-timeline__row">
        <span class="k-audit__time">${time}</span>
        ${icon(TICKET_EVENT_ICON[e.kind] || "circle-help", 14)}

             "operator:<id>"/"user:<id>" render as the account's username via
             actorLabel(), with the role as a tooltip. -->
        <span class="kc-timeline__actor"${al.title ? ` title="${esc(al.title)}"` : ""}>${esc(al.label)}</span>
        <span>${body}</span>

    }

      if (send) {
        if (on) {
          send.innerHTML = `${icon('square', 13)}Stop`;
          send.onclick = stopTicketChat;
          send.disabled = false;
        } else {
          send.innerHTML = `${icon('send-horizontal', 13)}Send`;
          send.onclick = () => sendTicketChat(ticketId);
        }
      }
      setTicketComposerLocked(on);
    }
    function setTicketComposerLocked(on, reasonText) {
      const ta = document.getElementById("tk-chat-input");
      const mirror = document.getElementById("tk-chat-mirror");
      const reasonEl = document.getElementById("tk-chat-reason");
      if (ta) ta.disabled = on;
      if (mirror) mirror.disabled = on;
      if (reasonEl && reasonText !== undefined) reasonEl.textContent = reasonText;
    }
    function stopTicketChat() {
      if (tkChatAbort) tkChatAbort.abort();
    }
    async function sendTicketChat(id) {
      if (tkChatAbort) return; // a turn is already streaming
      const ta = document.getElementById("tk-chat-input");
      const message = ta ? ta.value.trim() : "";
      if (!message) return;
      const mirrorEl = document.getElementById("tk-chat-mirror");
      const mirror = !!(mirrorEl && mirrorEl.checked);
      ta.value = "";
      await startTicketChatTurn(id, message, mirror);
    }

    // Scroll #tk-timeline to its newest row. Shared by the live-append helpers
    // below and by renderTicketDetail, so a freshly loaded ticket also lands on
    // the newest message rather than only auto-scrolling on later live events.
    function tkScrollTimeline() {
      const t = document.getElementById("tk-timeline");
      if (t) t.scrollTop = t.scrollHeight;
    }
    // -- appending provisional (in-progress) rows to the live timeline ------
    // These are a preview only: "done" (or the abort/error fallback in
    // startTicketChatTurn) always follows with a full renderTicketDetail(),
    // which replaces every row here with the durable trail. Kept visually
    // consistent with ticketEventHtml's own rows (same time/icon/actor
    // chrome) so a live turn doesn't look like a different widget.
    function tkTimelineRow(actorLabel, iconName) {
      const t = document.getElementById("tk-timeline");
      if (!t) return null;
      const row = document.createElement("div");
      row.className = "kc-timeline__row";
      const time = document.createElement("span");
      time.className = "k-audit__time";
      time.textContent = new Date().toLocaleString();
      row.appendChild(time);
      row.insertAdjacentHTML("beforeend", icon(iconName, 14));
      const actor = document.createElement("span");
      actor.className = "kc-timeline__actor";
      actor.textContent = actorLabel;
      row.appendChild(actor);
      const body = document.createElement("span");
      row.appendChild(body);
      t.appendChild(row);
      tkScrollTimeline();
      return body;
    }
    function tkTimelineBubble(actorLabel, text) {
      const body = tkTimelineRow(actorLabel, "message-square");
      if (!body) return document.createElement("div");
      const div = document.createElement("div");
      // Same class as the durable trail's kenny-authored rows (see
      // ticketEventHtml) and the copilot's own assistant bubble — kenny's
      // text is markdown, a human's is plain, never interpreted as markup.
      if (actorLabel === "kenny") {
        div.className = "k-bubble k-bubble--assistant";
        div.innerHTML = renderMarkdown(text);
      } else {
        div.textContent = text;
      }
      body.appendChild(div);
      return div;
    }
    function tkTimelineToolRun(label, ok) {
      const body = tkTimelineRow("kenny", ok ? "check" : "octagon-alert");
      if (!body) return;
      const span = document.createElement("span");
      span.className = "k-toolrun" + (ok ? " k-toolrun--auto" : " k-toolrun--err");
      span.textContent = label;
      body.appendChild(span);
    }
    // ctx.bubble() lazily creates the one in-progress kenny bubble the first
    // time a text token arrives, same lazy-creation reason newChatCtx() has
    // in the copilot (a tool-only/gate-only turn shouldn't leave a blank row).
    function newTicketChatCtx() {
      return { _div: null, _raw: "", bubble() { return (this._div ||= tkTimelineBubble("kenny", "")); } };
    }
    function handleTicketChatEvent(ev, ctx, ticketId) {
      if (ev.type === "text_delta") {
        const div = ctx.bubble();
        ctx._raw += ev.text;
        // Re-render the whole buffered reply per token, not an incremental
        // append — a delta can land mid-token, same reasoning as the
        // copilot's handleChatEvent.
        div.innerHTML = renderMarkdown(ctx._raw);
        tkScrollTimeline();
      } else if (ev.type === "tool_result") {
        tkTimelineToolRun(ev.tool, ev.ok !== false);
      } else if (ev.type === "denied") {
        tkTimelineToolRun("denied " + ev.tool + (ev.message ? " — " + ev.message : ""), false);
      } else if (ev.type === "pending") {
        // The trail row + ticket state transition are already durable by the
        // time this event arrives (TicketAssistant.on_hold runs before the
        // loop yields it) — this is just a snappier local lock; the 'done'
        // event that immediately follows does the authoritative reload that
        // shows the new approval row with its inline Approve/Deny controls.
        setTicketComposerLocked(true, "Waiting on a decision above.");
        // Also surface the gate popup right here, not just once the 'done'
        // reload lands (see ticketPendingGate) — same guard (tkGateShownFor)
        // as the renderTicketDetail path, so the two never double-open it.
        ticketPendingGate(ticketId);
      } else if (ev.type === "error") {
        notify(ev.error || "chat failed", "err");
      }
      // 'done' is handled by the caller (startTicketChatTurn), which is the
      // one place that knows whether a reload already happened.
    }
    // Drive one turn of the ticket assistant. The trail is the truth, these
    // provisional rows are only a preview: on a normal end ('done') or on any
    // abnormal end (Stop, a network error, an in-band 'error' with no 'done'
    // behind it) this always finishes with one clean renderTicketDetail(),
    // which replaces every provisional row with the durable ones and
    // re-derives the composer's disabled state from the fresh ticket.
    async function startTicketChatTurn(ticketId, message, mirrorToDiscord) {
      if (tkChatAbort) return;
      tkTimelineBubble("you", message);
      const ctx = newTicketChatCtx();
      let sawDone = false;
      tkChatAbort = new AbortController();
      setTicketComposerStreaming(true, ticketId);
      try {
        for await (const ev of streamSSE(
          "/api/tickets/" + encodeURIComponent(ticketId) + "/chat/stream",
          { message, mirror_to_discord: mirrorToDiscord },
          { signal: tkChatAbort.signal }
        )) {
          if (ev.type === "done") {
            sawDone = true;
            await renderTicketDetail(ticketId);
          } else {
            handleTicketChatEvent(ev, ctx, ticketId);
          }
        }
      } catch (e) {
        if (e.name !== "AbortError") notify(e.message, "err");
      } finally {
        tkChatAbort = null;
        // A normal end already reloaded inside the loop (the 'done' branch
        // above); any abnormal end (Stop, a network error, a pre-stream
        // failure streamSSE threw on) has not, so catch it up here. Either
        // way the render that follows is a fresh, authoritative composer —
        // no separate "un-stream" step, that would just re-enable inputs a
        // fresh disabled-reason render may have deliberately locked.
        if (!sawDone) await renderTicketDetail(ticketId);
      }
    }

    // -- approvals badge modal: the frozen tool call, args and target, one
    // decision away from running (or being denied) ------------------------
    async function openApprovalsModal() {
      openModal(`${icon('shield-alert', 20)}<span>Pending approvals</span>`, `<div class="k-muted">loading…</div>`, "k-modal--wide");
      await refreshApprovalsModal();
    }
    async function refreshApprovalsModal() {
      let approvals = [];
      try { approvals = ((await api("/api/approvals")) || {}).approvals || []; }
      catch (e) {
        const b = modalBody(); if (b) b.innerHTML = `<div class="k-airec__err">${esc(e.message)}</div>`;
        return;
      }
      const b = modalBody(); if (b) b.innerHTML = approvalsBodyHtml(approvals);
    }
    function approvalsBodyHtml(approvals) {
      if (!approvals.length) return `<div class="k-muted">no pending approvals</div>`;
      const rows = approvals.map(a => `<tr>
          <td class="k-mono">${esc(a.tool)}</td>
          <td><span class="k-pill">${esc(a.tool_class)}</span></td>
          <td class="k-mono" style="max-width:420px">
            <pre style="margin:0;max-height:180px;overflow:auto;white-space:pre-wrap;word-break:break-word">${esc(JSON.stringify(a.args, null, 2))}</pre>
          </td>
          <td><a href="#/tickets/${encodeURIComponent(a.ticket_id)}" onclick="closeModal()">${icon('link', 13)}ticket</a></td>
          <td class="kacc-tbl__actions">
            <button class="k-btn k-btn--primary k-btn--sm" onclick="decideApproval(${jsArg(a.id)}, true)">${icon('check', 13)}Approve</button>
            <button class="k-btn k-btn--danger k-btn--sm" onclick="decideApproval(${jsArg(a.id)}, false)">${icon('x', 13)}Deny</button>
          </td></tr>`).join("");
      return `<table class="kacc-tbl"><thead><tr><th>Tool</th><th>Class</th><th>Args</th><th>Ticket</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table>`;
    }
    async function decideApproval(id, approve) {
      const ok = await confirmModal({
        title: approve ? "Approve tool call" : "Deny tool call",
        ico: approve ? "shield-check" : "shield-alert",
        body: approve
          ? "Allow this held tool call to run on the target host?"
          : "Deny this held tool call? It will not run.",
        confirmLabel: approve ? "Approve" : "Deny",
        confirmClass: approve ? "k-btn--primary" : "k-btn--danger",
      });
      if (ok) {
        try {
          const res = await api("/api/approvals/" + encodeURIComponent(id), "POST", { approve });
          if (res && res.resumed === false) {
            notify("recorded — kenny could not continue this ticket automatically", "err");
          } else {
            notify(approve ? "approved" : "denied");
          }
        } catch (e) { notify(e.message, "err"); }
      }
      // confirmModal() replaces/closes the single shared modal, so reopen the
      // approvals list (same pattern as resetUserTotp()) rather than trying to
      // patch the now-gone DOM in place.
      await openApprovalsModal();
      refreshHeader();
    }

    // ====================================================================
    // SETTINGS — one admin surface behind a left sidebar: the runtime
    // configuration catalog (grouped exactly as config.py's GROUP_ORDER,
    // values resolving DB override > environment > coded default) plus the
    // Backup and Updates sections, which are catalog groups too and share
    // this same shell. #/settings/{slug} picks one section; bare #/settings,
    // #/backup and #/updates all resolve into it (old bookmarks and the
    // Discord "see the dashboard" links keep working). Editable (live/
    // restart) settings write back via /api/settings; env_only ones
    // (secrets, wire-contract, process-bind) are shown read-only, grouped
    // under a separate "environment" nav block.
    //
    // /api/settings is superuser-only; Updates is operator+ (ADR-0040), so an
    // operator gets a single synthetic "Updates" section with no catalog
    // panel and never calls /api/settings at all (it would just 403).
    // ====================================================================
    let settingsGroups = [];   // last /api/settings payload — the nav's shape
    let settingsQuery = "";    // cross-section search text; not reflected in the hash

    const _SETTINGS_ICONS = {
      "alerting-digest": "bell", "web-filter": "globe", "chat-ai": "message-square",
      "logging": "monitor", "backup": "hard-drive", "updates": "download",
      "discord-tickets": "life-buoy", "network-process": "network",
      "operator-agent-auth": "key", "telemetry-limits": "activity",
      "agent-distribution": "box", "ticket-rules": "link",
    };
    function settingsGroupIcon(slug) { return _SETTINGS_ICONS[slug] || "sliders"; }

    function settingsOperatorSections() {
      // No .settings array: an operator can't reach /api/settings at all, so
      // there is no row count to show — an empty array would misleadingly
      // read as "Updates has 0 settings" instead of "not shown to you".
      return withTicketRulesSection([{ name: "Updates", slug: "updates" }]);
    }

    // Auto-ticket rules is a second section with no settings-catalog
    // group behind it, same shape as Updates: operator+ visible, appended after
    // whatever /api/settings returned (superuser) or after the synthetic
    // Updates-only list (operator) so both roles see it last, right after
    // "Discord & Tickets" (config.py's GROUP_ORDER ends there).
    function withTicketRulesSection(groups) {
      return [...groups, { name: "Auto-ticket rules", slug: "ticket-rules" }];
    }

    function settingsGroupIsReadonly(g) {
      const settings = g.settings || [];
      return settings.length > 0 && settings.every(s => s.lifecycle === "env_only");
    }

    function settingsGroupMatches(g, q) {
      return (g.settings || []).filter(s =>
        s.label.toLowerCase().includes(q) || s.key.toLowerCase().includes(q) ||
        (s.help || "").toLowerCase().includes(q));
    }

    function setSettingsPane(html) {
      const pane = document.getElementById("kset-pane");
      if (pane) pane.innerHTML = html;
    }

    async function renderSettings() {
      const nav = navToken;
      // The header metrics need fleet data in every tab; fetch it if missing.
      if (!state.fleet) {
        state.fleet = await getJSON("/api/fleet").catch(() => ({ agents: [] }));
      }
      if (nav !== navToken) return;  // navigated away while this was loading
      renderHeaderRight(state.fleet, state.fleet.agents || []);

      if (isSuperuser()) {
        try {
          settingsGroups = withTicketRulesSection((await getJSON("/api/settings")).groups || []);
        } catch (e) {
          app.innerHTML = `<div class="k-airec__err">could not load settings: ${esc(e.message)}</div>`;
          return;
        }
        if (nav !== navToken) return;
      } else {
        settingsGroups = settingsOperatorSections();
      }
      // A real navigation into Settings always shows fresh Backup/Updates
      // data; a search-text toggle mid-section (below) reuses whatever is
      // already cached instead of refetching on every keystroke.
      backupState.data = null;
      updatesState.data = null;

      const active = settingsGroups.find(g => g.slug === state.settingsSection) || settingsGroups[0];
      state.settingsSection = active.slug;
      const wantHash = "#/settings/" + active.slug;
      if (location.hash !== wantHash) history.replaceState(null, "", wantHash);

      app.innerHTML = `<div class="kc-console no-copilot">
        <div class="k-panel kc-fleet">
          ${isSuperuser() ? `<div class="k-muted" style="font-size:var(--text-xs);margin-bottom:10px">
            settings resolve <b>custom override → environment → default</b>; read-only ones are
            managed via the environment</div>
          <div class="k-audit__bar" style="margin-bottom:14px">
            <span class="k-audit__search">${icon('search', 15)}
              <input class="k-input" id="kset-search" placeholder="search settings…"
                autocomplete="off" oninput="settingsSearchInput(this.value)" value="${esc(settingsQuery)}" />
            </span>
          </div>` : ""}
          <div id="kset-navlist"></div>
        </div>
        <div class="ksetpane" id="kset-pane"></div>
      </div>`;
      renderSettingsNavList();
      await renderSettingsSection(active.slug);
    }

    function renderSettingsNavList() {
      const host = document.getElementById("kset-navlist");
      if (!host) return;
      const q = settingsQuery.trim().toLowerCase();
      const item = (g) => {
        const count = q ? settingsGroupMatches(g, q).length : (g.settings || []).length;
        const sub = !g.settings ? ""
          : q ? `${count} match${count === 1 ? "" : "es"}` : `${count} setting${count === 1 ? "" : "s"}`;
        return `<a class="kc-navitem${state.settingsSection === g.slug ? " is-active" : ""}" href="#/settings/${g.slug}">
           ${icon(settingsGroupIcon(g.slug), 16)}
           <span class="kc-agent__body">
             <span class="kc-navitem__name">${esc(g.name)}</span>
             <span class="kc-navitem__sub">${sub}</span>
           </span></a>`;
      };
      const visible = q ? settingsGroups.filter(g => settingsGroupMatches(g, q).length) : settingsGroups;
      const configurable = visible.filter(g => !settingsGroupIsReadonly(g));
      const readonly = visible.filter(g => settingsGroupIsReadonly(g));
      host.innerHTML =
        `<div class="kc-section-lbl">configuration</div>
         <div class="kc-fleet__list">${configurable.map(item).join("")
            || `<div class="k-muted" style="font-size:var(--text-sm);padding:4px">no matches</div>`}</div>` +
        (readonly.length
          ? `<div class="kc-section-lbl" style="margin-top:14px">environment (read-only)</div>
             <div class="kc-fleet__list">${readonly.map(item).join("")}</div>`
          : "");
    }

    function settingsSearchInput(v) {
      settingsQuery = v;
      renderSettingsNavList();
      if (settingsQuery.trim()) renderSettingsPaneFiltered();
      else renderSettingsSection(state.settingsSection);
    }

    function renderSettingsPaneFiltered() {
      const q = settingsQuery.trim().toLowerCase();
      const matches = settingsGroups
        .map(g => ({ name: g.name, slug: g.slug, settings: settingsGroupMatches(g, q) }))
        .filter(g => g.settings.length);
      setSettingsPane(matches.length
        ? matches.map(settingsGroupHtml).join("")
        : `<div class="k-panel"><div class="k-muted">no settings match “${esc(settingsQuery)}”.</div></div>`);
    }

    // Fills #kset-pane for one section. Backup/Updates/Discord & Tickets
    // compose their existing page content with the matching catalog group
    // (see backupSectionHtml/updatesSectionHtml/renderDiscordSection below);
    // every other section is just its catalog group's panel.
    async function renderSettingsSection(slug) {
      if (slug === "backup" && isSuperuser()) { await renderBackup(); return; }
      if (slug === "updates") { await renderUpdates(); return; }
      if (slug === "discord-tickets" && isSuperuser()) { await renderDiscordSection(); return; }
      if (slug === "ticket-rules") { await renderTicketRulesSection(); return; }
      const group = settingsGroups.find(g => g.slug === slug);
      setSettingsPane(group ? settingsGroupHtml(group) : `<div class="k-muted">nothing here yet.</div>`);
    }

    // The single "something changed, redraw the current section with fresh
    // everything" entry point: settingsSet()/settingsReset() call this after
    // every write so a badge flip, a Backup/Updates catalog row, or the nav's
    // match counts never show stale data — without it silently reusing the
    // catalog snapshot from whenever the section was first opened.
    async function refreshSettingsSection() {
      if (isSuperuser()) {
        try { settingsGroups = withTicketRulesSection((await getJSON("/api/settings")).groups || []); }
        catch (e) { /* keep the previous snapshot rather than blanking the page */ }
      }
      backupState.data = null;
      updatesState.data = null;
      renderSettingsNavList();
      await renderSettingsSection(state.settingsSection);
    }

    // The "Auto-ticket rules" section: which alerts open a ticket
    // on their own. No settings-catalog group behind it — same shape as
    // Updates — so this fetches straight from /api/ticket-rules* and fills
    // #kset-pane directly. Fetch → render, re-run after every mutation.
    async function renderTicketRulesSection() {
      setSettingsPane(`<div class="k-muted">loading…</div>`);
      let vocab, data;
      try {
        [vocab, data] = await Promise.all([
          getJSON("/api/ticket-rules/vocabulary"),
          getJSON("/api/ticket-rules"),
        ]);
      } catch (e) {
        setSettingsPane(`<div class="k-airec__err">auto-ticket rules unavailable: ${esc(e.message)}</div>`);
        return;
      }
      state.ticketRuleVocab = vocab;
      setSettingsPane(ticketRulesSectionHtml(vocab, data));
      // The section select's options depend on the event-type select's current
      // value, which only exists in the DOM once the HTML above has landed.
      onTkRuleEventTypeChange();
    }
    const TK_RULE_DECISION_LABEL = { open_all: "open", open_crit: "open if crit", never: "never" };
    function ticketRulesSectionHtml(vocab, d) {
      const rules = d.rules || [];
      const rows = rules.length ? rules.map(r => {
        const known = !r.section || (vocab.sections[r.event_type] || []).includes(r.section);
        return `<div class="kwf-row">
          <span class="k-mono">${esc(r.event_type)} / ${esc(r.section || "any section")}</span>
          ${!known ? `<span class="k-pill k-pill--warn" title="not a known section for this event type">unknown section</span>` : ""}
          <span class="k-pill ${r.decision === "never" ? "k-pill--muted" : "k-pill--ok"}">${esc(TK_RULE_DECISION_LABEL[r.decision] || r.decision)}</span>
          <span class="k-pill k-pill--muted">${esc(r.agent_id || "fleet-wide")}</span>
          ${r.note ? `<span class="k-muted">${esc(r.note)}</span>` : ""}
          <button class="k-btn k-btn--danger k-btn--sm" style="margin-left:auto"
            title="remove" onclick="removeTicketRule(${jsArg(r.id)}, ${jsArg(r.agent_id ? "host" : "fleet")})">${icon('x', 12)}</button>
        </div>`;
      }).join("") : `<div class="k-muted">no rules — every genuine alert opens a ticket; recoveries, inventory changes and the weekly digest never do</div>`;
      const eventTypeOpts = vocab.event_types.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("");
      const decisionOpts = vocab.decisions.map(a =>
        `<option value="${esc(a)}">${esc(TK_RULE_DECISION_LABEL[a] || a)}</option>`).join("");
      const agentOpts = (state.fleet.agents || []).map(a =>
        `<option value="${esc(a.agent_id)}">${esc(a.agent_id)}</option>`).join("");
      return `<div class="k-panel kset__grp">
        <div class="k-detail-grp__lbl">auto-ticket rules — which events open a ticket by themselves</div>
        <div class="k-muted" style="margin-bottom:8px">With no rules: every alert — a health escalation, an agent going offline, a
          disk-fill forecast — opens a ticket; recoveries, inventory changes and the weekly digest never do.
          Each rule below is an exception to that.</div>
        <div class="kwf-add">
          <select class="k-input" id="tkr-event-type" onchange="onTkRuleEventTypeChange()">${eventTypeOpts}</select>
          <select class="k-input" id="tkr-section"><option value="">any section</option></select>
          <select class="k-input" id="tkr-scope"><option value="">all PCs</option>${agentOpts}</select>
          <select class="k-input" id="tkr-decision">${decisionOpts}</select>
          <input class="k-input" id="tkr-note" autocomplete="off" placeholder="note (optional)"
            onkeydown="if(event.key==='Enter')addTicketRuleFromForm()"/>
          <button class="k-btn k-btn--primary k-btn--sm" onclick="addTicketRuleFromForm()">${icon('plus', 13)}add</button>
        </div>
        <div class="kwf-list">${rows}</div>
        <div id="k-tkrules-msg"></div>
      </div>`;
    }
    // The section select is populated per event type, and disabled for the
    // two event types that carry no section axis at all (offline,
    // disk_forecast) -- client-side mirror of ticket_rules.KNOWN_SECTIONS so
    // a 400 stays the exception, not the workflow. Also the trigger for the
    // event-type <select>'s own onchange; renderTicketRulesSection calls it
    // once right after the section HTML lands in the DOM.
    function onTkRuleEventTypeChange() {
      const vocab = state.ticketRuleVocab || { sections: {} };
      const et = (document.getElementById("tkr-event-type") || {}).value;
      const sel = document.getElementById("tkr-section");
      if (!sel) return;
      const sections = vocab.sections[et] || [];
      sel.innerHTML = `<option value="">any section</option>` +
        sections.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
      sel.disabled = sections.length === 0;
    }
    function addTicketRuleFromForm() {
      const eventType = (document.getElementById("tkr-event-type") || {}).value || "";
      const section = (document.getElementById("tkr-section") || {}).value || "";
      const agentId = (document.getElementById("tkr-scope") || {}).value || "";
      const decision = (document.getElementById("tkr-decision") || {}).value || "";
      const note = ((document.getElementById("tkr-note") || {}).value || "").trim();
      addTicketRulePost({ event_type: eventType, section, agent_id: agentId, decision, note });
    }
    async function addTicketRulePost(body) {
      try {
        const res = await getJSON("/api/ticket-rules",
          { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        if ((res.warnings || []).length) tkRuleMsg(res.warnings.join("; "), false);
        else tkRuleMsg("", false);
        await renderTicketRulesSection();
      } catch (e) { tkRuleMsg("could not add rule: " + e.message, true); }
    }
    async function removeTicketRule(id, scope) {
      // Removing a fleet-wide rule changes behaviour on every PC, so confirm it.
      if (scope !== "host" && !confirm(
        "This rule is fleet-wide — removing it changes which alerts open a ticket on every PC. Continue?")) return;
      try {
        await getJSON("/api/ticket-rules/" + encodeURIComponent(id), { method: "DELETE" });
        await renderTicketRulesSection();
      } catch (e) { tkRuleMsg("could not remove rule: " + e.message, true); }
    }
    function tkRuleMsg(text, isErr) {
      const m = document.getElementById("k-tkrules-msg");
      if (m) m.innerHTML = text ? `<div class="${isErr ? "k-airec__err" : "k-muted"}" style="margin-top:6px">${esc(text)}</div>` : "";
    }

    // The "Discord & Tickets" section: its catalog group's panel, then the
    // Discord identity panel below it (kept at id="discord-panel" — the
    // discord-settings screenshot target selects on that id).
    async function renderDiscordSection() {
      const group = settingsGroups.find(g => g.slug === "discord-tickets");
      setSettingsPane((group ? settingsGroupHtml(group) : "") +
        `<div class="k-panel kset__grp" id="discord-panel"><div class="k-detail-grp__lbl">Discord</div>
           <div class="k-muted">loading…</div></div>`);
      await renderDiscordPanel();
    }

    // ====================================================================
    // DISCORD PANEL (Settings, superuser) — gateway connection status, linked
    // identity table, and both enrollment paths: confirming a pending claim
    // code and picking a guild member directly. Superuser-only surface
    // (/api/discord/* on the server); degrades to a "not configured" notice
    // until the Discord identity service is wired in (identities is None).
    // ====================================================================
    // Both enrollment paths bind a Discord snowflake to a *kenny account*, so
    // each needs the operator to say which account — the server rejects either
    // without a user_id, and there is no sane default to guess.
    let discordUsers = [];
    function discordUserOptions(selectId) {
      return `<select id="${selectId}" class="k-input k-input--sm">
        <option value="">choose kenny user…</option>
        ${discordUsers.map(u => `<option value="${esc(u.id)}">${esc(u.username)} (${esc(u.role)})</option>`).join("")}
      </select>`;
    }
    function pickedUserId(selectId) {
      const el = document.getElementById(selectId);
      const v = el && el.value ? el.value : "";
      if (!v) { notify("choose a kenny user first", "err"); return null; }
      return Number(v);
    }
    async function renderDiscordPanel() {
      const host = document.getElementById("discord-panel");
      if (!host) return;
      let status = { connected: false, configured: false };
      try { status = await getJSON("/api/discord/status"); } catch (e) {}
      let identities = null, claims = [];
      try { identities = ((await api("/api/discord/identities")) || {}).identities || []; }
      catch (e) { identities = null; }
      if (identities !== null) {
        try { claims = ((await api("/api/discord/claims")) || {}).claims || []; } catch (e) {}
        try { discordUsers = ((await api("/api/users")) || {}).users || []; } catch (e) {}
      }
      host.innerHTML = discordPanelHtml(status, identities, claims);
    }
    function discordPanelHtml(status, identities, claims) {
      const statusPill = status.connected
        ? `<span class="k-pill k-pill--ok">${icon('check', 13)}connected</span>`
        : status.startup_error
          ? `<span class="k-pill k-pill--crit">${icon('alert-triangle', 13)}failed to start</span>`
          : `<span class="k-pill k-pill--muted">not connected</span>`;
      // "not connected" alone leaves an operator who configured everything with
      // nowhere to look; the reason belongs next to the switch they threw.
      const why = status.startup_error
        ? `<div class="k-airec__err" style="margin-bottom:14px">${esc(status.startup_error)}</div>`
        : status.missing_message_content
          ? `<div class="k-airec__err" style="margin-bottom:14px">Mentions are arriving
              empty — enable the privileged <b>Message Content</b> intent for this
              application in the Discord developer portal.</div>`
          : "";
      const head = `<div class="k-detail-grp__lbl">Discord</div>
        <div class="k-row" style="gap:10px;margin-bottom:14px">${statusPill}</div>${why}`;
      if (identities === null) {
        return head + `<div class="k-muted">Discord identity linking is not configured on
          this server yet.</div>`;
      }
      // i.user_id is a *kenny* account id (the account a Discord identity is
      // linked to, not a Discord snowflake — that's i.discord_user_id, its
      // own column below) — the same id space userLabel() resolves, so this
      // delegates to it rather than keeping its own lookup over discordUsers
      // (which stays around for discordUserOptions' role-qualified picker).
      const userName = uid => userLabel(uid);
      const linkedRows = identities.map(i => `<tr${i.disabled ? ' class="k-muted"' : ""}>
          <td>${esc(userName(i.user_id))}</td>
          <td class="k-mono">${esc(i.discord_user_id || "")}</td>
          <td>${esc(i.linked_via || "")}${i.disabled ? " · disabled" : ""}</td>
          <td class="kacc-tbl__actions">
            <button class="k-btn k-btn--danger k-btn--sm" onclick="deleteDiscordIdentity(${jsArg(i.discord_user_id)})">${icon('trash-2', 13)}</button>
          </td></tr>`).join("");
      const pendingRows = (claims || []).map((c, n) => `<tr>
          <td class="k-mono">${esc(c.code || "")}</td>
          <td>${esc(c.display_hint || "")}<div class="k-mono k-muted">${esc(c.discord_user_id || "")}</div></td>
          <td>${discordUserOptions("dc-claim-" + n)}</td>
          <td>
            <button class="k-btn k-btn--primary k-btn--sm"
              onclick="confirmDiscordClaim(${jsArg(c.code)}, ${jsArg('dc-claim-' + n)})">${icon('check', 13)}Confirm</button>
          </td></tr>`).join("");
      return head + `
        <div class="kacc-sec">
          <div class="kacc-sec__lbl">Linked accounts</div>
          <table class="kacc-tbl"><thead><tr><th>kenny user</th><th>Discord user</th><th>Linked via</th><th></th></tr></thead>
            <tbody>${linkedRows || `<tr><td colspan="4" class="kacc-empty">no linked accounts</td></tr>`}</tbody></table>
        </div>
        <div class="kacc-sec">
          <div class="kacc-sec__lbl">Pending claims</div>
          <div class="k-muted" style="margin-bottom:8px">Someone ran <code>/link</code> in
            Discord. Pick the kenny account it belongs to — that mapping is what decides which
            machines they may ask about.</div>
          <table class="kacc-tbl"><thead><tr><th>Code</th><th>Discord user</th><th>kenny user</th><th></th></tr></thead>
            <tbody>${pendingRows || `<tr><td colspan="4" class="kacc-empty">no pending claims</td></tr>`}</tbody></table>
        </div>
        <div class="kacc-sec">
          <div class="kacc-sec__lbl">Link by member picker</div>
          <button class="k-btn k-btn--ghost k-btn--sm" onclick="openDiscordMemberPicker()">${icon('users', 13)}Pick a guild member</button>
        </div>`;
    }
    async function deleteDiscordIdentity(did) {
      const ok = await confirmModal({ title: "Unlink Discord account", ico: "trash-2",
        body: "Remove this Discord link? The person will need to re-enroll to use Discord again.",
        confirmLabel: "Unlink", confirmClass: "k-btn--danger" });
      if (ok) {
        try { await api("/api/discord/identities/" + encodeURIComponent(did), "DELETE"); notify("unlinked"); }
        catch (e) { notify(e.message, "err"); }
      }
      await renderDiscordPanel();
    }
    async function confirmDiscordClaim(code, selectId) {
      const userId = pickedUserId(selectId);
      if (userId === null) return;
      try {
        await api("/api/discord/claims/" + encodeURIComponent(code), "POST", { user_id: userId });
        notify("claim confirmed");
      } catch (e) { notify(e.message, "err"); }
      await renderDiscordPanel();
    }
    async function openDiscordMemberPicker() {
      openModal(`${icon('users', 20)}<span>Link a Discord member</span>`, `<div class="k-muted">loading…</div>`);
      let members;
      try { members = ((await api("/api/discord/members")) || {}).members || []; }
      catch (e) {
        const b = modalBody(); if (b) b.innerHTML = `<div class="k-airec__err">${esc(e.message)}</div>`;
        return;
      }
      const b = modalBody();
      if (!b) return;
      b.innerHTML = members.length
        ? `<table class="kacc-tbl"><thead><tr><th>Member</th><th>Discord ID</th><th>kenny user</th><th></th></tr></thead><tbody>` +
          members.map((m, n) => `<tr>
              <td>${esc(m.display_hint || "")}</td>
              <td class="k-mono">${esc(m.user_id || "")}</td>
              <td>${discordUserOptions("dc-member-" + n)}</td>
              <td><button class="k-btn k-btn--primary k-btn--sm" onclick="linkDiscordMember(${jsArg(m.user_id)}, ${jsArg('dc-member-' + n)})">${icon('link', 13)}Link</button></td>
            </tr>`).join("") + `</tbody></table>`
        : `<div class="k-muted">no guild members found</div>`;
    }
    async function linkDiscordMember(discordUserId, selectId) {
      const userId = pickedUserId(selectId);
      if (userId === null) return;
      closeModal();
      try {
        await api("/api/discord/identities", "POST",
                  { discord_user_id: discordUserId, user_id: userId });
        notify("linked");
      } catch (e) { notify(e.message, "err"); }
      await renderDiscordPanel();
    }

    function settingsGroupHtml(g) {
      return `<div class="k-panel kset__grp">
        <div class="k-detail-grp__lbl">${esc(g.name)}</div>
        ${(g.settings || []).map(settingRowHtml).join("")}
      </div>`;
    }

    function settingsSourceBadge(src) {
      if (src === "db") return `<span class="k-pill k-pill--ok" title="operator override active">custom</span>`;
      if (src === "env") return `<span class="k-pill" title="from the environment">env</span>`;
      return `<span class="k-pill k-pill--muted" title="coded default">default</span>`;
    }

    function settingRowHtml(s) {
      const writable = s.lifecycle !== "env_only";
      const restart = s.lifecycle === "restart"
        ? `<span class="k-pill k-pill--warn" title="stored now; applies after a server restart">restart</span>` : "";
      const control = writable ? settingsControlHtml(s) : settingsReadonlyHtml(s);
      const reset = (writable && s.source === "db")
        ? `<button class="k-btn k-btn--sm" title="reset to environment/default" onclick="settingsReset(${jsArg(s.key)})">${icon('rotate-ccw', 12)}reset</button>` : "";
      return `<div class="kset__row">
        <div class="kset__meta">
          <div class="kset__label">${esc(s.label)} ${settingsSourceBadge(s.source)} ${restart}</div>
          ${s.help ? `<div class="k-muted kset__help">${esc(s.help)}</div>` : ""}
          <div class="kset__key k-mono">${esc(s.key)}</div>
        </div>
        <div class="kset__ctl">${control}${reset}</div>
      </div>`;
    }

    function settingsControlHtml(s) {
      const key = jsArg(s.key);
      if (s.type === "bool") {
        return `<label class="kwf-tog"><input type="checkbox" ${s.value ? "checked" : ""}
          onchange="settingsSet(${key}, this.checked)"/><span>${s.value ? "on" : "off"}</span></label>`;
      }
      if (s.type === "enum") {
        const opts = (s.choices || []).map(c =>
          `<option value="${esc(c)}" ${String(c) === String(s.value) ? "selected" : ""}>${esc(c)}</option>`).join("");
        return `<select class="k-input" onchange="settingsSet(${key}, this.value)">${opts}</select>`;
      }
      // int / float / str: text/number input committed via Enter or the save button.
      const numeric = s.type === "int" || s.type === "float";
      const val = (s.value === null || s.value === undefined) ? "" : String(s.value);
      return `<input class="k-input kset__input" id="set-${esc(s.key)}" value="${esc(val)}"
          ${numeric ? 'inputmode="decimal"' : ""} autocomplete="off"
          onkeydown="if(event.key==='Enter')settingsSetFromInput(${key})"/>
        <button class="k-btn k-btn--primary k-btn--sm" onclick="settingsSetFromInput(${key})">save</button>`;
    }

    function settingsReadonlyHtml(s) {
      let disp;
      if (s.sensitive) disp = s.is_set ? "•••••• (set)" : "not set";
      else disp = (s.value === "" || s.value === null || s.value === undefined) ? "(empty)" : String(s.value);
      return `<span class="kset__ro k-mono">${esc(disp)}</span>`;
    }

    async function settingsSet(key, value) {
      try {
        await getJSON("/api/settings/" + encodeURIComponent(key), {
          method: "PUT", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ value }),
        });
        notify("saved " + key, "ok");
        await refreshSettingsSection();
      } catch (e) { notify("could not save: " + e.message, "err"); }
    }
    function settingsSetFromInput(key) {
      const el = document.getElementById("set-" + key);
      if (el) settingsSet(key, el.value);
    }
    async function settingsReset(key) {
      try {
        await getJSON("/api/settings/" + encodeURIComponent(key), { method: "DELETE" });
        notify("reset " + key, "ok");
        await refreshSettingsSection();
      } catch (e) { notify("could not reset: " + e.message, "err"); }
    }

    // ====================================================================
    // BACKUP SECTION — DB snapshot list/create/verify/restore/delete + the
    // operator-configured remote fan-out targets (http/scp/ftp), followed by
    // the "Backup" catalog group (interval/retention live here now instead
    // of in a duplicate pair of inline inputs — see backupSectionHtml).
    // Superuser only (the API 403s lower roles anyway). The local `backups/`
    // directory reported here is what an external sync tool (e.g. Syncthing)
    // should watch instead of the live database file.
    // ====================================================================
    let backupState = { data: null, restoring: false, targetForm: null };
    let updatesState = { data: null };

    function relTime(iso) {
      if (!iso) return "never";
      const ms = Date.now() - new Date(iso).getTime();
      if (!isFinite(ms)) return esc(iso);
      const s = Math.max(0, Math.round(ms / 1000));
      if (s < 60) return s + "s ago";
      const m = Math.round(s / 60);
      if (m < 60) return m + "m ago";
      const h = Math.round(m / 60);
      if (h < 48) return h + "h ago";
      return Math.round(h / 24) + "d ago";
    }

    function integrityPillHtml(integrity) {
      if (integrity === "ok") return `<span class="k-pill k-pill--ok">ok</span>`;
      return `<span class="k-pill k-pill--crit" title="${esc(integrity || "unknown")}">bad</span>`;
    }

    async function renderBackup() {
      setSettingsPane(`<div class="k-muted">loading…</div>`);
      let data;
      try {
        data = await getJSON("/api/backups");
      } catch (e) {
        setSettingsPane(`<div class="k-airec__err">could not load backups: ${esc(e.message)}</div>`);
        return;
      }
      backupState.data = data;
      setSettingsPane(backupSectionHtml());
    }

    function backupSectionHtml() {
      const group = settingsGroups.find(g => g.slug === "backup");
      return backupPageHtml(backupState.data) + (group ? settingsGroupHtml(group) : "");
    }

    function backupPageHtml(data) {
      const backups = data.backups || [];
      const cfg = data.config || {};
      const totalSize = backups.reduce((a, b) => a + (b.size || 0), 0);
      const last = backups[0];
      const restoringBanner = backupState.restoring
        ? `<div class="k-panel" style="border-color:var(--warn-dot)">
             ${icon('triangle-alert', 15)}<b>server is restarting…</b>
             the database was replaced from a backup; the server process is
             restarting to apply it and should be back within a few seconds.
           </div>` : "";
      return `${restoringBanner}
        <div class="k-panel kset__grp">
          <div class="k-detail-grp__lbl">status</div>
          <div class="k-deflist">
            <div class="k-deflist__k">last backup</div>
            <div class="k-deflist__v">${last ? esc(relTime(last.created_at)) + " · " + esc(fmtValue("at", last.created_at)) : "never"}</div>
            <div class="k-deflist__k">count</div>
            <div class="k-deflist__v">${backups.length}</div>
            <div class="k-deflist__k">total size</div>
            <div class="k-deflist__v">${fmtBytes(totalSize)}</div>
            <div class="k-deflist__k">local directory</div>
            <div class="k-deflist__v k-mono">${esc(cfg.backup_dir || "")}</div>
          </div>
          <div class="k-muted" style="margin-top:8px">
            Point your sync tool (e.g. Syncthing) at this directory instead of the
            live database file — it only ever holds finished, static snapshots, so
            syncing it never causes lock contention on the running server.
            Backup interval and retention are set below, in the "Backup" group.
          </div>
          <div class="k-row" style="margin-top:14px">
            <button class="k-btn k-btn--primary" onclick="backupNow()" ${backupState.restoring ? "disabled" : ""}>${icon('hard-drive', 14)}Backup now</button>
          </div>
        </div>

        <div class="k-panel kset__grp">
          <div class="k-detail-grp__lbl">remote targets</div>
          ${backupTargetsHtml(data.targets || [])}
        </div>

        <div class="k-panel kset__grp">
          <div class="k-detail-grp__lbl">backups</div>
          ${backupTableHtml(backups)}
        </div>`;
    }

    async function backupNow() {
      try {
        await getJSON("/api/backups", { method: "POST" });
        notify("backup created", "ok");
        await renderBackup();
      } catch (e) { notify("backup failed: " + e.message, "err"); }
    }

    function backupTargetsHtml(targets) {
      const rows = targets.map(t => {
        const cfgLine = t.kind === "http" ? (t.config.url || "")
          : t.kind === "scp" ? `${t.config.username || ""}@${t.config.host || ""}:${t.config.remote_dir || ""}`
          : `${t.config.host || ""}:${t.config.remote_dir || ""}`;
        return `<tr>
          <td>${esc(t.label)}</td>
          <td><span class="k-pill">${esc(t.kind)}</span></td>
          <td class="k-mono">${esc(cfgLine)}</td>
          <td>${t.enabled ? `<span class="k-pill k-pill--ok">enabled</span>` : `<span class="k-pill k-pill--muted">disabled</span>`}</td>
          <td class="kacc-tbl__actions">
            <button class="k-btn k-btn--ghost k-btn--sm" onclick="backupTargetTest(${jsArg(t.id)})">${icon('refresh-cw', 12)}test</button>
            <button class="k-btn k-btn--ghost k-btn--sm" onclick="backupTargetEditForm(${jsArg(t.id)})">${icon('pencil', 12)}edit</button>
            <button class="k-btn k-btn--danger k-btn--sm" onclick="backupTargetDelete(${jsArg(t.id)}, ${jsArg(t.label)})">${icon('trash-2', 12)}</button>
          </td>
        </tr>`;
      }).join("");
      const table = `<table class="kacc-tbl"><thead><tr>
          <th>Label</th><th>Kind</th><th>Destination</th><th>Status</th><th></th></tr></thead>
          <tbody>${rows || `<tr><td colspan="5" class="kacc-empty">no remote targets configured — backups still go to the local directory above</td></tr>`}</tbody></table>`;
      const addBtn = backupState.targetForm
        ? "" : `<div class="k-row" style="justify-content:flex-end;margin-top:10px">
            <button class="k-btn k-btn--primary k-btn--sm" onclick="backupTargetAddForm()">${icon('plus', 13)}Add target</button>
          </div>`;
      const form = backupState.targetForm ? backupTargetFormHtml(backupState.targetForm) : "";
      return table + addBtn + form;
    }

    function backupTargetAddForm() {
      backupState.targetForm = { mode: "add", kind: "http", id: null, label: "", config: {} };
      setSettingsPane(backupSectionHtml());
    }
    function backupTargetEditForm(id) {
      const t = (backupState.data.targets || []).find(x => x.id === id);
      if (!t) return;
      backupState.targetForm = { mode: "edit", kind: t.kind, id: t.id, label: t.label, config: t.config || {} };
      setSettingsPane(backupSectionHtml());
    }
    function backupTargetFormCancel() {
      backupState.targetForm = null;
      setSettingsPane(backupSectionHtml());
    }
    function backupTargetFormKindChanged(kind) {
      backupState.targetForm.kind = kind;
      setSettingsPane(backupSectionHtml());
    }

    function backupTargetFieldsHtml(kind, c) {
      c = c || {};
      const secretHint = `<span class="k-muted" style="font-size:var(--text-sm)"> (leave blank to keep unchanged)</span>`;
      if (kind === "http") {
        return `
          <div class="kfield"><span class="kfield__lbl">URL</span>
            <input class="k-input" id="bt-url" value="${esc(c.url || "")}" placeholder="https://backup.example.test"></div>
          <div class="kfield"><span class="kfield__lbl">Token${secretHint}</span>
            <input class="k-input" id="bt-token" type="password" autocomplete="new-password"></div>`;
      }
      if (kind === "scp") {
        return `
          <div class="kfield"><span class="kfield__lbl">Host</span>
            <input class="k-input" id="bt-host" value="${esc(c.host || "")}"></div>
          <div class="kfield"><span class="kfield__lbl">Port</span>
            <input class="k-input" id="bt-port" value="${esc(c.port || 22)}" style="width:100px"></div>
          <div class="kfield"><span class="kfield__lbl">Username</span>
            <input class="k-input" id="bt-username" value="${esc(c.username || "")}"></div>
          <div class="kfield"><span class="kfield__lbl">Password${secretHint}</span>
            <input class="k-input" id="bt-password" type="password" autocomplete="new-password"></div>
          <div class="kfield"><span class="kfield__lbl">Private key (PEM)${secretHint}</span>
            <textarea class="k-input" id="bt-private_key" rows="3" autocomplete="new-password"></textarea></div>
          <div class="kfield"><span class="kfield__lbl">Remote directory</span>
            <input class="k-input" id="bt-remote_dir" value="${esc(c.remote_dir || "")}"></div>`;
      }
      // ftp
      return `
        <div class="kfield"><span class="kfield__lbl">Host</span>
          <input class="k-input" id="bt-host" value="${esc(c.host || "")}"></div>
        <div class="kfield"><span class="kfield__lbl">Port</span>
          <input class="k-input" id="bt-port" value="${esc(c.port || 21)}" style="width:100px"></div>
        <div class="kfield"><span class="kfield__lbl">Username</span>
          <input class="k-input" id="bt-username" value="${esc(c.username || "")}"></div>
        <div class="kfield"><span class="kfield__lbl">Password${secretHint}</span>
          <input class="k-input" id="bt-password" type="password" autocomplete="new-password"></div>
        <div class="kfield"><span class="kfield__lbl">Remote directory</span>
          <input class="k-input" id="bt-remote_dir" value="${esc(c.remote_dir || "")}"></div>
        <label class="kwf-tog"><input type="checkbox" id="bt-use_tls" ${c.use_tls === false ? "" : "checked"}/><span>use TLS (FTPS)</span></label>`;
    }

    function backupTargetFormHtml(f) {
      const kindOpts = ["http", "scp", "ftp"].map(k =>
        `<option value="${k}" ${k === f.kind ? "selected" : ""}>${k}</option>`).join("");
      return `<div class="k-panel" style="margin-top:12px">
        <div class="k-row" style="gap:10px;flex-wrap:wrap">
          <div class="kfield" style="margin-bottom:0">
            <span class="kfield__lbl">Kind</span>
            <select class="k-input" id="bt-kind" onchange="backupTargetFormKindChanged(this.value)" ${f.mode === "edit" ? "disabled" : ""}>${kindOpts}</select>
          </div>
          <div class="kfield" style="margin-bottom:0;flex:1 1 200px">
            <span class="kfield__lbl">Label</span>
            <input class="k-input" id="bt-label" value="${esc(f.label || "")}" placeholder="e.g. Offsite NAS">
          </div>
        </div>
        ${backupTargetFieldsHtml(f.kind, f.config)}
        <div class="k-modal__actions" style="padding:0;border:none">
          <button class="k-btn k-btn--ghost" onclick="backupTargetFormCancel()">Cancel</button>
          <button class="k-btn k-btn--primary" onclick="backupTargetFormSubmit()">${icon('check', 14)}${f.mode === "edit" ? "Save" : "Add"}</button>
        </div>
      </div>`;
    }

    function backupTargetFormCollect(kind) {
      const val = id => { const el = document.getElementById(id); return el ? el.value : ""; };
      if (kind === "http") {
        return { url: val("bt-url"), token: val("bt-token") };
      }
      if (kind === "scp") {
        return {
          host: val("bt-host"), port: Number(val("bt-port")) || 22,
          username: val("bt-username"), password: val("bt-password"),
          private_key: val("bt-private_key"), remote_dir: val("bt-remote_dir"),
        };
      }
      const tlsEl = document.getElementById("bt-use_tls");
      return {
        host: val("bt-host"), port: Number(val("bt-port")) || 21,
        username: val("bt-username"), password: val("bt-password"),
        remote_dir: val("bt-remote_dir"), use_tls: tlsEl ? tlsEl.checked : true,
      };
    }

    async function backupTargetFormSubmit() {
      const f = backupState.targetForm;
      if (!f) return;
      const kind = document.getElementById("bt-kind") ? document.getElementById("bt-kind").value : f.kind;
      const label = (document.getElementById("bt-label") || {}).value || "";
      if (!label.trim()) return notify("label is required", "err");
      const config = backupTargetFormCollect(kind);
      try {
        if (f.mode === "add") {
          await api("/api/backup-targets", "POST", { kind, label, config });
          notify("target added", "ok");
        } else {
          await api("/api/backup-targets/" + encodeURIComponent(f.id), "PUT", { label, config });
          notify("target saved", "ok");
        }
        backupState.targetForm = null;
        await renderBackup();
      } catch (e) { notify("could not save target: " + e.message, "err"); }
    }

    async function backupTargetTest(id) {
      try {
        const r = await api("/api/backup-targets/" + encodeURIComponent(id) + "/test", "POST");
        notify(r.message || (r.ok ? "connection ok" : "connection failed"), r.ok ? "ok" : "err");
      } catch (e) { notify("test failed: " + e.message, "err"); }
    }

    async function backupTargetDelete(id, label) {
      const ok = await confirmModal({
        title: "Remove backup target",
        ico: "trash-2",
        body: `Remove "${label || id}" from the backup targets? Existing copies already stored there are left in place.`,
        confirmLabel: "Remove", confirmClass: "k-btn--danger",
      });
      if (!ok) return;
      try {
        await api("/api/backup-targets/" + encodeURIComponent(id), "DELETE");
        notify("target removed");
        await renderBackup();
      } catch (e) { notify(e.message, "err"); }
    }

    function backupTableHtml(backups) {
      const rows = backups.map(b => {
        const targetsLine = (b.targets || []).map(t =>
          `<span class="k-pill ${t.ok === false ? "k-pill--crit" : "k-pill--ok"}" title="${t.ok === false ? esc(t.error || "failed") : "ok"}">${esc(t.target)}</span>`
        ).join(" ") || `<span class="k-muted">—</span>`;
        const disabled = backupState.restoring ? "disabled" : "";
        return `<tr>
          <td>${esc(fmtValue("at", b.created_at))}</td>
          <td>${fmtBytes(b.size || 0)}</td>
          <td><span class="k-pill">${esc(b.trigger || "?")}</span></td>
          <td>${integrityPillHtml(b.integrity)}</td>
          <td>${targetsLine}</td>
          <td class="kacc-tbl__actions">
            <a class="k-btn k-btn--ghost k-btn--sm" href="/api/backups/${encodeURIComponent(b.name)}/download?source=local">${icon('download', 12)}download</a>
            <button class="k-btn k-btn--ghost k-btn--sm" ${disabled} onclick="backupVerify(${jsArg(b.name)})">${icon('shield-check', 12)}verify</button>
            <button class="k-btn k-btn--ghost k-btn--sm" ${disabled} onclick="backupRestore(${jsArg(b.name)})">${icon('rotate-ccw', 12)}restore</button>
            <button class="k-btn k-btn--danger k-btn--sm" ${disabled} onclick="backupDelete(${jsArg(b.name)})">${icon('trash-2', 12)}</button>
          </td>
        </tr>`;
      }).join("");
      return `<table class="kacc-tbl"><thead><tr>
          <th>Created</th><th>Size</th><th>Trigger</th><th>Integrity</th><th>Targets</th><th></th></tr></thead>
          <tbody>${rows || `<tr><td colspan="6" class="kacc-empty">no backups yet</td></tr>`}</tbody></table>`;
    }

    async function backupVerify(name) {
      try {
        const r = await api("/api/backups/" + encodeURIComponent(name) + "/verify", "POST", { source: "local" });
        notify(`integrity: ${r.integrity}`, r.integrity === "ok" ? "ok" : "err");
      } catch (e) { notify("verify failed: " + e.message, "err"); }
    }

    async function backupDelete(name) {
      const ok = await confirmModal({
        title: "Delete backup",
        ico: "trash-2",
        body: `Delete "${name}" from every target? This cannot be undone.`,
        confirmLabel: "Delete", confirmClass: "k-btn--danger",
      });
      if (!ok) return;
      try {
        await api("/api/backups/" + encodeURIComponent(name), "DELETE");
        notify("backup deleted");
        await renderBackup();
      } catch (e) { notify(e.message, "err"); }
    }

    async function backupRestore(name) {
      const ok = await confirmModal({
        title: "Restore database",
        ico: "triangle-alert",
        body: `This overwrites the current database with "${name}" and restarts the server. This cannot be undone.`,
        confirmLabel: "Restore", confirmClass: "k-btn--danger",
      });
      if (!ok) return;
      try {
        await api("/api/backups/" + encodeURIComponent(name) + "/restore", "POST", { source: "local" });
        backupState.restoring = true;
        notify("restore staged — server is restarting…", "ok");
        setSettingsPane(backupSectionHtml());
      } catch (e) { notify("restore failed: " + e.message, "err"); }
    }

    // -- Updates: scheduled detection + operator-approved rollout (ADR-0040) --
    // Server apply is detect-and-show-command only: a container cannot replace
    // its own running image, so the page shows a digest-pinned `docker` command
    // instead of an "apply" button. Agent rollout is a pinned campaign: approving
    // one snapshots an exact version, so a later detection pass finding something
    // newer never changes what an already-approved campaign pushes.
    async function renderUpdates() {
      setSettingsPane(`<div class="k-muted">loading…</div>`);
      let data;
      try {
        data = await getJSON("/api/updates");
      } catch (e) {
        setSettingsPane(`<div class="k-airec__err">could not load updates: ${esc(e.message)}</div>`);
        return;
      }
      updatesState.data = data;
      setSettingsPane(updatesSectionHtml());
    }

    function updatesSectionHtml() {
      // Updates is operator+ (ADR-0040) but the catalog is superuser-only, so
      // an operator sees this page with no catalog panel appended.
      const group = isSuperuser() ? settingsGroups.find(g => g.slug === "updates") : null;
      return updatesPageHtml(updatesState.data) + (group ? settingsGroupHtml(group) : "");
    }

    function updatesPageHtml(data) {
      const avail = data.available || {};
      const agentAvail = avail.agent || {};
      const serverAvail = avail.server || {};
      const agentAvailDev = avail["agent:dev"] || {};
      const serverAvailDev = avail["server:dev"] || {};
      const campaign = data.active_campaign;
      const cfg = data.config || {};
      const serverApply = data.server_apply;

      const serverCard = `<div class="k-panel kset__grp">
        <div class="k-detail-grp__lbl">server</div>
        <div class="k-deflist">
          <div class="k-deflist__k">running</div>
          <div class="k-deflist__v k-mono">${esc(cfg.server_image_ref || "")}</div>
          <div class="k-deflist__k">latest known</div>
          <div class="k-deflist__v">${serverAvail.version ? esc(serverAvail.version) : "—"}
            ${serverAvail.checked_at ? `<span class="k-muted"> · checked ${esc(relTime(serverAvail.checked_at))}</span>` : ""}</div>
          <div class="k-deflist__k">latest dev</div>
          <div class="k-deflist__v">${serverAvailDev.version ? esc(serverAvailDev.version) : "—"}
            ${serverAvailDev.checked_at ? `<span class="k-muted"> · checked ${esc(relTime(serverAvailDev.checked_at))}</span>` : ""}</div>
        </div>
        ${serverApply ? `<div class="k-panel" style="margin-top:10px;border-color:var(--warn-dot)">
            ${icon('triangle-alert', 15)}<b>version ${esc(serverApply.tag)} available.</b>
            kenny cannot replace its own running container — run this on the host:
            ${serverApply.command
              ? `<div class="k-mono" style="margin-top:6px;word-break:break-all">${esc(serverApply.command)}</div>`
              : `<div class="k-muted" style="margin-top:6px">digest unavailable yet — check again shortly.</div>`}
          </div>`
          : `<div class="k-muted" style="margin-top:8px">server is up to date.</div>`}
      </div>`;

      const agentCard = `<div class="k-panel kset__grp">
        <div class="k-detail-grp__lbl">agent fleet</div>
        <div class="k-deflist">
          <div class="k-deflist__k">latest known</div>
          <div class="k-deflist__v">${agentAvail.version ? esc(agentAvail.version) : "—"}
            ${agentAvail.checked_at ? `<span class="k-muted"> · checked ${esc(relTime(agentAvail.checked_at))}</span>` : ""}</div>
          <div class="k-deflist__k">latest dev</div>
          <div class="k-deflist__v">${agentAvailDev.version ? esc(agentAvailDev.version) : "—"}
            ${agentAvailDev.checked_at ? `<span class="k-muted"> · checked ${esc(relTime(agentAvailDev.checked_at))}</span>` : ""}</div>
          <div class="k-deflist__k">auto-apply on connect</div>
          <div class="k-deflist__v">${cfg.rollout_on_connect ? "on" : "off"}</div>
        </div>
        ${isSuperuser() ? `<div class="k-muted" style="margin-top:8px">
          Check interval and auto-apply-on-connect are set below, in the "Updates" group.
        </div>` : ""}
        <div class="k-row" style="margin-top:14px">
          <button class="k-btn k-btn--ghost k-btn--sm" onclick="updatesCheckNow()">${icon('refresh-cw', 13)}check now</button>
        </div>
      </div>`;

      const campaignCard = `<div class="k-panel kset__grp">
        <div class="k-detail-grp__lbl">agent rollout campaign</div>
        ${campaignHtml(campaign, agentAvail, data.agents || [], "stable")}
      </div>`;

      // Dev-channel campaign card (ADR-0048): same control, pinned to channel
      // "dev" — a mixed fleet can have a stable and a dev campaign active at
      // once, so this is additive, not a toggle over the stable card above.
      const campaignCardDev = `<div class="k-panel kset__grp">
        <div class="k-detail-grp__lbl">agent rollout campaign (dev)</div>
        ${campaignHtml(data.active_campaign_dev, agentAvailDev, data.agents_dev || [], "dev")}
      </div>`;

      return `${serverCard}${agentCard}${campaignCard}${campaignCardDev}`;
    }

    function campaignHtml(campaign, agentAvail, agents, channel) {
      if (!campaign) {
        const canApprove = !!agentAvail.version;
        return `<div class="k-muted">no active ${esc(channel)} campaign.</div>
          <div class="k-row" style="margin-top:10px">
            <button class="k-btn k-btn--primary k-btn--sm" ${canApprove ? "" : "disabled"}
              onclick="updatesApproveCampaign(${jsArg(agentAvail.version || "")}, ${jsArg(channel)})">
              ${icon('download', 13)}approve ${esc(channel)} rollout to ${esc(agentAvail.version || "—")}
            </button>
          </div>`;
      }
      const rows = agents.map(a => {
        const status = a.updated ? `<span class="k-pill k-pill--ok">updated</span>`
          : a.held ? `<span class="k-pill k-pill--crit">held (${a.attempts})</span>`
          : a.eligible ? `<span class="k-pill">pending</span>`
          : `<span class="k-pill k-pill--muted">n/a for this arch/channel</span>`;
        return `<tr>
          <td>${esc(a.agent_id)}</td>
          <td>${esc(a.os)}/${esc(a.arch)}</td>
          <td class="k-mono">${esc(a.current_version || "?")}</td>
          <td>${agentChannelCellHtml(a)}</td>
          <td>${a.online ? `<span class="k-pill k-pill--ok">online</span>` : `<span class="k-pill k-pill--muted">offline</span>`}</td>
          <td>${status}</td>
        </tr>`;
      }).join("");
      const table = `<table class="kacc-tbl"><thead><tr>
          <th>Agent</th><th>OS/Arch</th><th>Current</th><th>Channel (built / desired)</th><th>Connection</th><th>Status</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="6" class="kacc-empty">no known agents</td></tr>`}</tbody></table>`;
      return `<div class="k-deflist">
          <div class="k-deflist__k">pinned version</div>
          <div class="k-deflist__v k-mono">${esc(campaign.version)}</div>
          <div class="k-deflist__k">on-connect auto-apply</div>
          <div class="k-deflist__v">${campaign.on_connect ? "on" : "off (apply now only)"}</div>
          <div class="k-deflist__k">expires</div>
          <div class="k-deflist__v">${campaign.expires_at ? esc(relTime(campaign.expires_at)) : "never"}</div>
        </div>
        <div class="k-row" style="gap:8px;margin:10px 0">
          <button class="k-btn k-btn--primary k-btn--sm" onclick="updatesApplyNow(${jsArg(campaign.id)})">
            ${icon('refresh-cw', 13)}apply to online agents now</button>
          <button class="k-btn k-btn--danger k-btn--sm" onclick="updatesRevokeCampaign(${jsArg(campaign.id)})">
            ${icon('x', 13)}revoke</button>
        </div>
        ${table}
        <div class="k-muted" style="margin-top:6px">
          revoking stops future pushes only — an update already in flight to an
          agent cannot be recalled. an agent held after repeated refusal (e.g.
          remote control switched off locally) needs the operator to look at it.
          eligibility (and the campaign that will apply on connect) is decided
          by an agent's <b>desired</b> channel below, not its currently-built one.
        </div>`;
    }

    // Soll/ist channel badges (ADR-0048): "channel" is what the connected
    // binary actually reports about itself (read-only here); "desired_channel"
    // is the operator-set target a campaign's eligibility is checked against.
    // The select lets an operator flip the latter without leaving this table.
    function agentChannelCellHtml(a) {
      const built = `<span class="k-pill k-pill--muted">${esc(a.channel || "stable")}</span>`;
      return `${built} <select class="k-input k-input--sm" style="width:auto;display:inline-block"
          onchange="updatesSetDesiredChannel(${jsArg(a.agent_id)}, this.value)">
          <option value="stable" ${a.desired_channel === "dev" ? "" : "selected"}>desired: stable</option>
          <option value="dev" ${a.desired_channel === "dev" ? "selected" : ""}>desired: dev</option>
        </select>`;
    }

    async function updatesSetDesiredChannel(agentId, channel) {
      try {
        await api("/api/agent/" + encodeURIComponent(agentId) + "/channel", "PUT", { channel });
        notify(`${agentId}: desired channel set to ${channel}`, "ok");
        await renderUpdates();
      } catch (e) { notify("could not set channel: " + e.message, "err"); }
    }

    async function updatesCheckNow() {
      try {
        await api("/api/updates/check", "POST");
        notify("update check complete", "ok");
        await renderUpdates();
      } catch (e) { notify("check failed: " + e.message, "err"); }
    }

    async function updatesApproveCampaign(version, channel) {
      channel = channel || "stable";
      const ok = await confirmModal({
        title: "Approve agent update campaign",
        ico: "download",
        body: `Approve rolling out agent version ${version} (${channel} channel) to the fleet? This pins that exact version — a later release found by a future check will not be included unless separately approved.`,
        confirmLabel: "Approve", confirmClass: "k-btn--primary",
      });
      if (!ok) return;
      try {
        await api("/api/updates/campaigns", "POST", { version, channel });
        notify("campaign approved", "ok");
        await renderUpdates();
      } catch (e) { notify("could not approve campaign: " + e.message, "err"); }
    }

    async function updatesApplyNow(id) {
      try {
        const r = await api("/api/updates/campaigns/" + encodeURIComponent(id) + "/apply-now", "POST");
        notify(`applied to ${(r.attempted || []).length} online agent(s)`, "ok");
        await renderUpdates();
      } catch (e) { notify("apply failed: " + e.message, "err"); }
    }

    async function updatesRevokeCampaign(id) {
      const ok = await confirmModal({
        title: "Revoke update campaign",
        ico: "x",
        body: "Stop future pushes under this campaign? An update already in flight to an agent cannot be recalled.",
        confirmLabel: "Revoke", confirmClass: "k-btn--danger",
      });
      if (!ok) return;
      try {
        await api("/api/updates/campaigns/" + encodeURIComponent(id) + "/revoke", "POST");
        notify("campaign revoked");
        await renderUpdates();
      } catch (e) { notify(e.message, "err"); }
    }

    function worstOf(agents) {
      const rank = { crit: 3, warn: 2, unknown: 1, ok: 0 };
      let best = null, score = -1;
      for (const a of agents) {
        const s = rank[sev(a.overall)] ?? 0;
        if (s > score) { score = s; best = a.agent_id; }
      }
      return best;
    }

    // -- header right: fleet metrics + copilot + operator ------------------
    // Theme, About and Settings live in the user menu (see toggleUserMenu);
    // the header keeps only the fleet metrics, the copilot toggle and the
    // identity control.
    async function renderHeaderRight(fleet, agents) {
      // The copilot toggle only applies to the Fleet tab (the rail lives there).
      const copilotBtn = state.tab === "fleet"
        ? `<button class="kc-icon-btn" id="copilot-btn" onclick="toggleAskRail()" title="toggle Ask kenny panel" aria-label="toggle Ask kenny panel">${icon('sparkles', 16)}</button>`
        : "";
      headerRight.innerHTML =
        fleetMetricsHtml(agents) +
        copilotBtn +
        approvalsBadgeHtml() +
        identityHtml();
      if (canOperate()) {
        try {
          const data = await getJSON("/api/approvals");
          state.approvalsCount = (data.approvals || []).length;
        } catch (e) { state.approvalsCount = 0; }
        try {
          const summary = await getJSON("/api/tickets/summary");
          state.ticketsNeedsYouCount = summary.needs_you || 0;
        } catch (e) { state.ticketsNeedsYouCount = 0; }
        const btn = document.getElementById("approvals-badge");
        if (btn) btn.outerHTML = approvalsBadgeHtml();
        renderTabs();
      }
    }

    // A pending-approvals count badge (operator+) opening the approvals modal —
    // the operator-facing gate on every held tool call across the fleet.
    function approvalsBadgeHtml() {
      if (!canOperate()) return "";
      const n = state.approvalsCount || 0;
      return `<button class="kc-icon-btn${n ? " is-active" : ""}" id="approvals-badge"
          onclick="openApprovalsModal()" title="pending approvals" aria-label="pending approvals">
          ${icon('shield-alert', 16)}${n ? `<span class="k-badge">${n > 99 ? "99+" : n}</span>` : ""}</button>`;
    }

    // -- identity control: avatar + username + dropdown -------------------
    // Renders the current user's avatar (or an initials/icon fallback) followed
    // by their name; clicking toggles a small menu (Profile / Users / Log out).
    function avatarHtml(user, cls) {
      const u = user || {};
      const extra = cls ? " " + cls : "";
      if (u.avatar) {
        return `<span class="kc-avatar${extra}"><img src="/assets/${encodeURIComponent(u.avatar)}.png" alt="" width="128" height="128"></span>`;
      }
      const name = (u.username || "").trim();
      if (name) {
        const initials = name.split(/[\s._-]+/).filter(Boolean).slice(0, 2).map(p => p[0].toUpperCase()).join("") || name[0].toUpperCase();
        return `<span class="kc-avatar kc-avatar--init${extra}">${esc(initials)}</span>`;
      }
      return `<span class="kc-avatar${extra}">${icon('user-round', 16)}</span>`;
    }

    function identityHtml() {
      const u = state.me;
      if (!u) return `<span class="kc-operator">${icon('user-round', 15)}operator</span>`;
      const name = u.username || (u.is_shared_token ? "shared token" : "account");
      return `<div class="kc-identity" id="kc-identity">
        <button class="kc-identity__btn" onclick="toggleUserMenu(event)" aria-haspopup="menu" aria-label="account menu">
          ${avatarHtml(u)}<span class="kc-identity__name">${esc(name)}</span>${icon('chevron-down', 14).replace('<svg', '<svg class="kc-chev"')}
        </button>
      </div>`;
    }

    let userMenuBound = false;
    function toggleUserMenu(ev) {
      if (ev) ev.stopPropagation();
      const host = document.getElementById("kc-identity");
      if (!host) return;
      const open = host.querySelector(".kc-usermenu");
      if (open) { open.remove(); return; }
      const admin = isSuperuser()
        ? `<button class="kc-usermenu__item" onclick="closeUserMenu();openUsersModal()">${icon('users', 16)}Users</button>` : "";
      // Settings mutates server-wide runtime config — superuser only (the API
      // 403s lower roles anyway). It now covers Backup and Updates too (one
      // sidebar, #/settings/{slug}), so this is the only entry point here.
      const settings = isSuperuser()
        ? `<a class="kc-usermenu__item" href="#/settings" onclick="closeUserMenu()">${icon('sliders', 16)}Settings</a>` : "";
      // A superuser reaches Updates via Settings above; an operator (who
      // cannot open Settings at all) still needs a way in — Updates
      // approves/rolls out fleet software, operator+ (ADR-0040).
      const updatesLink = (canOperate() && !isSuperuser())
        ? `<a class="kc-usermenu__item" href="#/settings/updates" onclick="closeUserMenu()">${icon('download', 16)}Updates</a>` : "";
      const menu = document.createElement("div");
      menu.className = "kc-usermenu";
      menu.setAttribute("role", "menu");
      menu.innerHTML =
        `<button class="kc-usermenu__item" onclick="closeUserMenu();openProfileModal()">${icon('user-round', 16)}Profile</button>` +
        admin +
        `<div class="kc-usermenu__sep"></div>` +
        // Theme flips in place (menu stays open); the item advertises the
        // theme it switches to.
        `<button class="kc-usermenu__item" id="theme-menu-item" onclick="toggleTheme()">${themeMenuItemInner(currentTheme())}</button>` +
        settings +
        updatesLink +
        `<button class="kc-usermenu__item" onclick="closeUserMenu();openAboutModal()">${icon('info', 16)}About</button>` +
        `<a class="kc-usermenu__item" href="${esc(docsUrl())}" target="_blank" rel="noopener">${icon('book-open', 16)}Documentation</a>` +
        `<div class="kc-usermenu__sep"></div>` +
        `<a class="kc-usermenu__item" href="/logout">${icon('log-out', 16)}Log out</a>`;
      host.appendChild(menu);
      if (!userMenuBound) {
        // Dismiss on any outside click (bound once; the handler is a no-op when
        // no menu is open).
        document.addEventListener("mousedown", e => {
          const h = document.getElementById("kc-identity");
          const m = h && h.querySelector(".kc-usermenu");
          if (m && !h.contains(e.target)) m.remove();
        });
        userMenuBound = true;
      }
    }
    function closeUserMenu() {
      const m = document.querySelector("#kc-identity .kc-usermenu");
      if (m) m.remove();
    }

    // ====================================================================
    // ACCOUNT / IDENTITY MODALS — Profile (self-service) and Users (admin).
    // Both reuse the single-modal system: destructive actions route through
    // confirmModal() (which replaces the modal) and then re-open their parent,
    // so the operator always lands back where they were.
    // ====================================================================
    function modalBody() { return document.querySelector("#modal-overlay .k-modal__body"); }
    function refreshHeader() {
      renderHeaderRight(state.fleet || { agents: [] }, (state.fleet && state.fleet.agents) || []);
    }
    function copyText(text) {
      navigator.clipboard.writeText(text)
        .then(() => notify("copied to clipboard"))
        .catch(() => notify("press Ctrl+C to copy", "err"));
    }
    function rolePill(role) { return `<span class="k-pill k-pill--role">${esc(role)}</span>`; }

    // Show a freshly minted secret (PAT) exactly once in a copyable field. On
    // dismissal the caller's `reopen` restores the parent modal.
    function tokenOnceModal(title, token, reopen) {
      const body = `<div class="k-modal__sum">Copy this now — for security it will not be shown again.</div>
        <div class="kfield__row">
          <input class="k-input k-mono" id="km-token" readonly>
          <button class="k-btn k-btn--primary" id="km-token-copy" style="flex:none">${icon('copy', 14)}copy</button>
        </div>`;
      openModal(`${icon('key', 20)}<span>${esc(title)}</span>`, body, null, reopen);
      const inp = document.getElementById("km-token");
      inp.value = token; inp.focus(); inp.select();
      document.getElementById("km-token-copy").onclick = () => { copyText(token); inp.focus(); inp.select(); };
    }

    // -- shared avatar picker (used by profile + user create/edit) --------
    const avatarPick = {}; // pickerId -> selected avatar id (or null)
    function avatarPickerHtml(pickerId, avatars, selected) {
      avatarPick[pickerId] = selected || null;
      const none = `<button type="button" class="kacc-av kacc-av--none${selected ? "" : " is-sel"}"
        onclick="pickAvatar('${pickerId}', this, null)">none</button>`;
      const opts = (avatars || []).map(a =>
        `<button type="button" class="kacc-av${a === selected ? " is-sel" : ""}"
          onclick="pickAvatar('${pickerId}', this, ${jsArg(a)})"><img src="/assets/${encodeURIComponent(a)}.png" alt="${esc(a)}"></button>`
      ).join("");
      return `<div class="kacc-avgrid" id="${pickerId}">${none}${opts}</div>`;
    }
    function pickAvatar(pickerId, btn, val) {
      avatarPick[pickerId] = val;
      const grid = document.getElementById(pickerId);
      if (grid) grid.querySelectorAll(".kacc-av").forEach(b => b.classList.remove("is-sel"));
      btn.classList.add("is-sel");
    }
    // Host-scope checkbox grid (used by user create/edit). `hosts` = all known
    // host ids; `selected` = the subset assigned to the user.
    function hostGridHtml(gridId, hosts, selected) {
      const sel = new Set((selected || []).map(String));
      if (!hosts || !hosts.length) return `<div class="kacc-empty">no hosts in inventory yet</div>`;
      return `<div class="kacc-hostgrid" id="${gridId}">` + hosts.map(h =>
        `<label><input type="checkbox" value="${esc(h)}" ${sel.has(String(h)) ? "checked" : ""}>${esc(h)}</label>`
      ).join("") + `</div>`;
    }
    function checkedHosts(gridId) {
      return [...document.querySelectorAll("#" + gridId + " input:checked")].map(c => c.value);
    }

    // ---------------------------------------------------------------- PROFILE
    let pendingTotp = null; // {secret, uri} while a 2FA enrolment is mid-flight
    async function openProfileModal() {
      pendingTotp = null;
      openModal(`${icon('user-round', 20)}<span>Profile</span>`, `<div class="k-muted">loading…</div>`, "k-modal--wide");
      await refreshProfileModal();
    }
    async function refreshProfileModal() {
      let me, avatars = [], pats = [];
      try {
        me = await api("/api/me");
        state.me = me;
        refreshHeader();
      } catch (e) {
        const b = modalBody(); if (b) b.innerHTML = `<div class="k-airec__err">${esc(e.message)}</div>`;
        return;
      }
      if (!me.is_shared_token) {
