  <!-- wrinkle over nose -->
  <path d="M56 72 C60 69 68 69 72 72" fill="none" stroke="#6b5844" stroke-width="2.2" stroke-linecap="round"/>
  <!-- mouth -->
  <path d="M64 83 C64 88 59 90 56 89 M64 83 C64 88 69 90 72 89" fill="none" stroke="#2b2018" stroke-width="2.4" stroke-linecap="round"/>
  <!-- amber collar -->
  <path d="M49 95 C55 101 73 101 79 95" fill="none" stroke="#E8A33D" stroke-width="5" stroke-linecap="round"/>
</svg>
