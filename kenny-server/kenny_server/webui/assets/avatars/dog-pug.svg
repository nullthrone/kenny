  <path d="M34 60 C34 42 46 36 64 36 C82 36 94 42 94 60 C94 82 82 98 64 98 C46 98 34 82 34 60 Z" fill="#E7C48C"/>
  <!-- dark mask -->
  <path d="M44 66 C44 56 52 52 64 52 C76 52 84 56 84 66 C84 84 76 96 64 96 C52 96 44 84 44 66 Z" fill="#4A3D30"/>
  <!-- forehead wrinkle -->
  <path d="M56 46 C60 42 68 42 72 46" fill="none" stroke="#C9A46A" stroke-width="3" stroke-linecap="round"/>
  <!-- big eyes -->
  <circle cx="53" cy="64" r="6.2" fill="#1C140E"/>
  <circle cx="75" cy="64" r="6.2" fill="#1C140E"/>
  <circle cx="55" cy="61.5" r="2" fill="#fff"/>
  <circle cx="77" cy="61.5" r="2" fill="#fff"/>
