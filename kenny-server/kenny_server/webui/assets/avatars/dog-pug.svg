<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Pug avatar">
  <circle cx="64" cy="64" r="64" fill="#F7D8DC"/>
  <!-- small folded dark ears -->
  <path d="M40 40 C32 36 28 44 32 54 C38 56 44 50 46 44 Z" fill="#3A312A"/>
  <path d="M88 40 C96 36 100 44 96 54 C90 56 84 50 82 44 Z" fill="#3A312A"/>
