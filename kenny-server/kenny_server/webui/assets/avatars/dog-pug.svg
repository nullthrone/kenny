<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Pug avatar">
  <rect width="128" height="128" fill="#E9E6DF"/>
  <!-- shoulders -->
  <path d="M20 128 V119 C20 107 38 99 64 99 C90 99 108 107 108 119 V128 Z" fill="#141317"/>
  <!-- collar and tag -->
  <path d="M48 95 H80 V104 H48 Z" fill="#A87E2F"/>
  <path d="M60.5 107 H67.5 V114 H60.5 Z" fill="#A87E2F"/>
  <!-- broad fawn head -->
  <path d="M35 62 C35 45 47 37 64 37 C81 37 93 45 93 62 L93 66 C93 84 81 96 64 96 C47 96 35 84 35 66 Z" fill="#E4D5AC"/>
  <!-- button ears, folded down over the top corners -->
  <path d="M40 36 C33 37 31 46 36 53 C43 51 46 44 45 38 Z" fill="#141317"/>
  <path d="M88 36 C95 37 97 46 92 53 C85 51 82 44 83 38 Z" fill="#141317"/>
  <!-- forehead wrinkle -->
  <path d="M56 50 C59 46 69 46 72 50" fill="none" stroke="#C09A4B" stroke-width="3" stroke-linecap="round"/>
  <!-- eyes -->
  <circle cx="51" cy="61" r="5.4" fill="#141317"/>
  <circle cx="77" cy="61" r="5.4" fill="#141317"/>
  <!-- dark muzzle patch -->
  <path d="M48 79 C48 70 55 66 64 66 C73 66 80 70 80 79 C80 88 73 95 64 95 C55 95 48 88 48 79 Z" fill="#3A3740"/>
  <!-- flat wide nose -->
  <path d="M55 76 H73 V79.5 C73 83.5 69 86 64 86 C59 86 55 83.5 55 79.5 Z" fill="#141317"/>
  <!-- mouth -->
  <path d="M64 86 V89" fill="none" stroke="#141317" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M56 89 C58.5 92.5 61.5 92.5 64 89 C66.5 92.5 69.5 92.5 72 89" fill="none" stroke="#141317" stroke-width="2.2" stroke-linecap="round"/>
  <rect x=".5" y=".5" width="127" height="127" fill="none" stroke="#D9D6D3"/>
</svg>
