[package]
name = "kenny-agent"
version = "0.1.0"
edition = "2021"
description = "kenny agent: outbound-tunnel remote-admin and telemetry agent for Windows PCs"
license = "AGPL-3.0-only"
authors = ["t11z and the kenny contributors"]
repository = "https://github.com/t11z/kenny"
homepage = "https://github.com/t11z/kenny"
keywords = ["remote-admin", "telemetry", "windows", "mcp", "agent"]
categories = ["command-line-utilities"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt"] }
tracing-appender = "0.2"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
regex = "1"
sysinfo = "0.39"
# Per-agent mutual-auth (ADR-0023): Ed25519 keypair + signatures over the handshake
# transcript. NOT windows-gated so keygen/signing/verification build and test on Linux CI.
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# Synchronous HTTP client, reused for the one-time enrollment POST (ADR-0023) and the
# self-update download. Not windows-gated: enrollment runs on every platform's tunnel.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
# Portable PNG encoder for screen_capture. NOT windows-gated so encode_png can be
# unit-tested on Linux CI.
png = "0.18"
# Bundled SQLite for browser-history parsing (`web_activity` collector). NOT
# windows-gated: bundling the amalgamation lets the Chromium/Firefox history readers
# be unit-tested against fabricated temp DBs on Linux CI (matches the ungated
# ureq/png precedent above).
rusqlite = { version = "0.32", features = ["bundled"] }
# SHA-256. Used by `agent_update` (Windows-only) for binary verification AND by the
# `webfilter` handler's portable `list_hash`, which is unit-tested on Linux CI — so this
# is NOT windows-gated (the ungated ureq/png/rusqlite precedent applies).
sha2 = "0.11"

# Build scripts run on the *host* (we cross-compile from Linux), so the manifest
# embedder is an unconditional build-dependency, gated at runtime on the target.
[build-dependencies]
embed-manifest = "1"
# Embed a Windows VERSIONINFO resource (CompanyName/ProductName/FileVersion/…) and the
# exe icon so AV/anti-cheat heuristics and the user see identifiable publisher software
# (ADR-0039). Unconditional build-dep like embed-manifest; only invoked inside the
# `CARGO_CFG_WINDOWS` guard in build.rs, so it never runs for Linux/musl targets.
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    # Activate the packaged Quick Assist app by AUMID (IApplicationActivationManager),
    # the same way the Start menu does — a bare spawn cannot launch a Store app (ADR-0022).
    "Win32_System_Com",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_RemoteDesktop",
    # ShellExecuteExW + SHELLEXECUTEINFOW (setup's UAC relaunch) live behind this feature.
    "Win32_System_Registry",
    "Win32_Security",
    # screen_capture pipe hardening (ADR-0018): explicit DACL from SDDL + verifying the
    # pipe server's owning SID on connect (SID string conversion, SD from SDDL).
    "Win32_Security_Authorization",
] }
# Windows service lifecycle (install/uninstall/run-service + SCM control handler).
windows-service = "0.7"

[profile.release]
strip = true
lto = true
