[package]
name = "kenny-agent"
version = "0.1.0"
edition = "2021"
description = "kenny agent: outbound-tunnel remote-admin and telemetry agent for Windows PCs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
sysinfo = "0.31"
# Portable PNG encoder for screen_capture. NOT windows-gated so encode_png can be
# unit-tested on Linux CI.
png = "0.17"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
] }
# Windows service lifecycle (install/uninstall/run-service + SCM control handler).
windows-service = "0.7"
# Self-update (download + verify + stage). Windows-only because `agent_update`
# returns `unsupported` off Windows.
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
strip = true
lto = true
