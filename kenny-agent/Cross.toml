# cross-rs configuration for release cross-compilation (see .github/workflows/release.yml).
#
# The Linux musl release binaries are built with `cross` so the toolchain (including the
# C compiler for bundled rusqlite) lives in a target-matched Docker image. `cross` runs
# the build in a container that mounts ONLY the crate directory, so anything the build
# needs from outside the crate must be passed through or mounted explicitly:
#
# - KENNY_AGENT_VERSION -> KENNY_BUILD_VERSION (ADR-0015): the release version build.rs reads.
# - KENNY_DENY_RULES_DIR: the repo's `docs/policy/` directory, which holds the shared
#   deny-rule catalog build.rs embeds (ADR-0021). It lives outside the crate, so the release
#   workflow points this at `<repo>/docs/policy` and we mount it into the container (`volumes`)
#   at the same path AND expose the variable to the build (`passthrough`). Without this the
#   cross build fails: `couldn't read .../docs/policy/deny_rules.json`.
[build.env]
passthrough = ["KENNY_AGENT_VERSION", "KENNY_DENY_RULES_DIR"]
volumes = ["KENNY_DENY_RULES_DIR"]
